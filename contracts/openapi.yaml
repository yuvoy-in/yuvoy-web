  /plans/{id}/reply:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [plans]
      operationId: replyToMyPlan
      summary: The planner's or a signed-in member's own reply
      description: >-
        A member Yuvoy holds no age for sends `adult: true` on their first
        reply, else 400 with `details.adult`. A list over its cap (answers 6,
        claims 20, paid 10) or naming one id twice is 400 with
        `details.answers`, `details.claims` or `details.paid`. An item
        somebody took first is listed in `notClaimed`; that is not an error.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanReply" } } } }
      responses:
        "200": { description: The plan., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`plan_closed`; `details.reason` says why.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
    delete:
      tags: [plans]
      operationId: leaveMyPlan
      summary: Leave a plan. My row and answers are deleted, my items are freed, and any frozen share of mine goes with me.
      description: The planner cannot leave; that is 409 `conflict` with `details.reason` `planner_leaves` ("Cancel the plan instead.").
      security: [{ travellerSession: [] }]
      responses:
        "204": { description: Gone. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict`: the planner cannot leave.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/{id}/members/{memberId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [plans]
      operationId: removePlanMember
      summary: Remove a guest (planner). With block=true they cannot answer this plan again.
      description: Their claims are released; frozen shares stay until the planner removes the cost line.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: block, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: The plan., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict` with `details.reason` `planner`: the planner cannot be removed.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/{id}/link:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [plans]
      operationId: renewPlanLink
      summary: Make a new link; the old one stops working at once (planner)
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: The plan with its new link., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`plan_closed`; `details.reason` says why.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/{id}/done:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [plans]
      operationId: markPlanDone
      summary: We did it. From the decided start; the planner's mark closes the plan.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: The plan., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict` with `details.reason` `not_started`, or `plan_closed`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [plans]
      operationId: cancelPlan
      summary: Cancel the plan and any weekly repeat (planner)
      description: A plan already cancelled answers 200.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: The plan., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`plan_closed`; `details.reason` says why.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/{id}/reports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [plans]
      operationId: reportPlan
      summary: Report this plan or somebody on it (planner or member)
      description: >-
        The planner or a signed-in member reports the plan to a person at Yuvoy. A report is taken on a plan that is
        done or cancelled, and on a plan Yuvoy closed, whose link no longer works. `personName`, when sent, must
        be the first name of somebody on the plan, matched ignoring case, else 400 `invalid_input` with
        `details.personName`. A report is never refused for being one too many: past the daily count it is still
        stored and raised. Reports sent too fast answer 429; send it again in a moment. A plan the caller is not
        on is 404.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanReport" } } } }
      responses:
        "202": { description: Received. A person at Yuvoy reads it within one working day. Past the daily count a report is still stored and raised. }
        "400": { description: "`invalid_input`: a reason outside the list, a note too long, or `details.personName` for a name not on the plan.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/by-token/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, pattern: "^yp_[A-Za-z0-9_-]{43}$" } }
      - { name: X-Yuvoy-Plan-Key, in: header, required: false, schema: { type: string, pattern: "^ypk_[A-Za-z0-9_-]{43}$" } }
    get:
      tags: [plans]
      operationId: getPlanByLink
      summary: A plan, as somebody holding its link sees it
      description: >-
        No phone number, email, traveller id or member id of anybody, and nobody else's share. A cancelled or
        finished plan still answers, with its state, so a guest is told rather than shown a dead page. A plan Yuvoy
        closed answers 404 like any dead link, because closing nulls the link hash; its signed-in members read state
        `closed` through `GET /plans/{id}` (CAL-96). An unknown or renewed link, and a key whose member was removed
        or blocked, also answer 404.


        Who is reading is decided by `X-Yuvoy-Plan-Key`, else by a session when one is sent. A visitor (nobody has
        replied from here yet) sees everything except `payee`, `me` and `costs[].mine`; `payeeSet` still says whether
        there is somebody to pay. A member and the planner see `payee`.


        After `linkExpiresAt`, and until the plan is purged, a caller who never replied gets 404, while a member
        found by key or session still reads it with `canReply` false: answers and claims are then 409 `plan_closed`,
        and a paid-only reply is still taken. `earlierShares` lists a member's unsettled shares on earlier weeks of
        a weekly plan.
      security: []
      responses:
        "200": { description: 'The plan, guest view.', content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/by-token/{token}/reply:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, pattern: "^yp_[A-Za-z0-9_-]{43}$" } }
      - { name: X-Yuvoy-Plan-Key, in: header, required: false, schema: { type: string, pattern: "^ypk_[A-Za-z0-9_-]{43}$" } }
    put:
      tags: [plans]
      operationId: replyByLink
      summary: Reply with a first name, or change a reply
      description: >-
        A first reply with no `X-Yuvoy-Plan-Key` and no session needs `name`, `adult: true` and an
        `Idempotency-Key`, and its answer carries `guestKey` (201). A first reply with a session makes a reply that
        belongs to that account, carries no key and answers 200; its name is `name`, else the first word of the profile's name.
        A later reply sends the key (or the session) and answers 200 without `guestKey`. answers, claims and paid
        are complete sets, as in `replyToMyPlan`. After `answersCloseAt`, or once the link has expired, only a
        paid-only reply is taken; one may mark a share on an earlier week of a weekly plan (`earlierShares`).
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            The form's nonce, made once per form. Required on a first reply sent with no `X-Yuvoy-Plan-Key` and no
            session, else 400 with `details.idempotencyKey`. A repeat within 10 minutes with the same name returns
            the same guest and the same `guestKey`; a repeat with another name, or after 10 minutes, answers 409
            `conflict`.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{22,64}$" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanReply" } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "201": { description: First reply made with no session; carries `guestKey`., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`plan_full`; `plan_closed` with `details.reason`; or `conflict` with `details.reason` `nonce` (an `Idempotency-Key` used with another name or more than 10 minutes ago: send again).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
    delete:
      tags: [plans]
      operationId: leaveByLink
      summary: Remove my reply. My name and answers are deleted, my items are freed, and any frozen share of mine goes with me (CSO-26).
      description: The planner cannot leave; that is 409 `conflict` with `details.reason` `planner_leaves` ("Cancel the plan instead.").
      security: []
      responses:
        "204": { description: Gone. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict`: the planner cannot leave.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/by-token/{token}/link-account:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, pattern: "^yp_[A-Za-z0-9_-]{43}$" } }
    post:
      tags: [plans]
      operationId: linkPlanReplyToAccount
      summary: Attach this browser's reply to the signed-in account, so Yuvoy can send reminders
      security: [{ travellerSession: [] }]
      parameters:
        - { name: X-Yuvoy-Plan-Key, in: header, required: true, schema: { type: string, pattern: "^ypk_[A-Za-z0-9_-]{43}$" } }
      responses:
        "200": { description: Linked., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict` with `details.reason` `already_answered`: this account already answered this plan.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/by-token/{token}/reports:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, pattern: "^yp_[A-Za-z0-9_-]{43}$" } }
      - { name: X-Yuvoy-Plan-Key, in: header, required: false, schema: { type: string, pattern: "^ypk_[A-Za-z0-9_-]{43}$" } }
    post:
      tags: [plans]
      operationId: reportPlanByLink
      summary: Report this plan or somebody on it
      description: >-
        Anybody holding the link may report the plan, a visitor who never replied included. Who is reporting is
        decided by `X-Yuvoy-Plan-Key`, else by a session when one is sent. A key whose member was removed or
        blocked is accepted on this route only, while the link is live; every other by-token route answers it 404.
        A report is taken on a plan that is done or cancelled. A plan Yuvoy closed answers 404 here like any dead
        link; its signed-in members report it through `reportPlan`. An unknown or renewed link is 404.


        `personName`, when sent, must be the first name of somebody on the plan, matched ignoring case, else 400
        `invalid_input` with `details.personName`. A report is never refused for being one too many: past the
        daily count it is still stored and raised. Reports sent too fast answer 429; send it again in a moment.
      security: [{}, { travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanReport" } } } }
      responses:
        "202": { description: Received. A person at Yuvoy reads it within one working day. Past the daily count a report is still stored and raised. }
        "400": { description: "`invalid_input`: a reason outside the list, a note too long, or `details.personName` for a name not on the plan.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PlansUnavailable" }

  /organisers:
    post:
      tags: [organisers]
      operationId: createOrganiser
      summary: Set up an organiser page
      description: >-
        A signed-in adult sets up an organiser for a group or a series of
        events (R11-T2) and becomes its owner. It starts `pending`: a person at
        Yuvoy checks it, and every event it posts is checked before it shows.
        Every organiser route needs a sign-in session (a recovery link is
        401) and the 18+ answer (403 `adult_confirmation_required`), and is
        404 while the `supply` release does not admit the caller. Writes
        answer 503 `organisers_paused` while organiser pages are paused, except
        `cancelOrganiserEvent`. A field the server refuses is a 400 with
        `details` keyed by that field (a link's is `links.<index>`). Three a
        day per person, then 429 with `Retry-After` in seconds; requests sent
        too fast answer 429 with no `Retry-After`. Never cached.

        With `clubId` (OrganiserFromClubInput), the holder of an approved
        claim on an R9 group sets up that group's organiser: it takes the
        group's name and place (a body that also sends `name` or
        `destinationKey` is 400 with `details.name` or
        `details.destinationKey`) and is `verified` at once, with no
        verification code. Checks run in this order after the organiser
        gates: the body (400), the day count (429), a group that is not shown
        (404), not the holder (403 `not_club_holder`), People not open to the
        caller (403 `people_paused`), a group that already has an organiser
        (409 `club_already_linked`).
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganiserCreateInput" } } } }
      responses:
        "201": { description: "Created, pending a check; or verified at once when clubId names a group the caller holds.", content: { application/json: { schema: { $ref: "#/components/schemas/Organiser" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required`, `not_club_holder`, or `people_paused` with details.standing and details.until.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`club_already_linked`, with details.organiserId: only the group's holder gets this far.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
  /me/organisers:
    get:
      tags: [organisers]
      operationId: listMyOrganisers
      summary: The organisers I am a member of
      description: >-
        Oldest first, with the caller's role in each, and the R9 groups the
        caller may set up an organiser for (`clubsToLink`). Never cached.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: Mine.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, clubsToLink]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Organiser" } }
                  clubsToLink:
                    type: array
                    description: >-
                      Groups the caller's approved claim holds, shown, with no
                      organiser yet; empty when there are none, and for a
                      caller People is not open to. By name, then clubId.
                      Choosing one sends createOrganiser with its clubId.
                    items:
                      type: object
                      additionalProperties: false
                      required: [clubId, name, destinationKey, category]
                      properties:
                        clubId: { type: string, format: uuid }
                        name: { type: string }
                        destinationKey: { $ref: "#/components/schemas/DestinationKey" }
                        category: { type: [string, "null"], description: "The group's category key, for the form to pre-tick." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
  /organisers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [organisers]
      operationId: getOrganiser
      summary: One organiser, for a member
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: One., content: { application/json: { schema: { $ref: "#/components/schemas/Organiser" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
    patch:
      tags: [organisers]
      operationId: updateOrganiser
      summary: Change an organiser page (owner)
      description: >-
        The whole page, as `createOrganiser` takes it: a field left out is
        cleared. The slug never changes. A closed organiser is 409 `conflict`
        with `details.state`. On an organiser set up from a group (`clubId`
        set), `name` and `destinationKey` must be the stored ones; other
        values are 400 `invalid_input`.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganiserInput" } } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/Organiser" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member`, `not_owner` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict`; `details.state` is the organiser's state.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
  /organisers/{id}/club:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [organisers]
      operationId: linkOrganiserToClub
      summary: Link an organiser to a group you hold
      description: >-
        The owner of an organiser links it to an R9 group whose approved claim
        they hold. The organiser takes the group's name and place and keeps
        its slug. Every organiser linked becomes verified by the claim, method
        club_claim, whatever its state was (pending, not_verified or
        verified); its earlier method stays in the audit trail. Checks run in
        this order: the organiser gates; not a member (403 `not_a_member`), a
        helper (403 `not_owner`); the pause (503 `organisers_paused`); the
        body (400; a body that sends `name` or `destinationKey` is 400 with
        `details.name` or `details.destinationKey`, and a missing or bad
        `clubId` is 400 with `details.clubId`); a suspended or closed
        organiser (409 `conflict` with `details.state`); the day count, three
        a day per person (429 with `Retry-After` in seconds); a group that is
        not shown (404); not the holder (403 `not_club_holder`); People not
        open to the caller (403 `people_paused` with `details.standing` and
        `details.until`); the group already has another organiser, or this
        organiser already has another group (409 `club_already_linked` with
        `details.organiserId`, and `details.clubId` naming the other group
        for the second). Linking again to the same group answers 200 and
        changes nothing. Never cached.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganiserClubLink" } } } }
      responses:
        "200": { description: "Linked, now or before: the organiser with the group's name, place and clubId, verified.", content: { application/json: { schema: { $ref: "#/components/schemas/Organiser" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member`, `not_owner`, `adult_confirmation_required`, `not_club_holder`, or `people_paused` with details.standing and details.until.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict` with details.state for a suspended or closed organiser; `club_already_linked` with details.organiserId, and details.clubId when this organiser already has another group.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
  /organisers/{id}/helpers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [organisers]
      operationId: listOrganiserHelpers
      summary: An organiser's helpers, for a member
      description: >-
        The helpers, oldest added first; the owners are not in it. An owner
        is given each helper's `travellerId`, to remove them by; a helper is
        given the first names only.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: Oldest added first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OrganiserHelperListed" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
    post:
      tags: [organisers]
      operationId: addOrganiserHelper
      summary: Add a helper by their email (owner)
      description: >-
        The email of an account that already proved it. Only a `verified`
        organiser takes helpers: otherwise 409 `conflict` with
        `details.state`. Somebody already a member is answered as they are.
        Ten a day per organiser, then 429 with `Retry-After` in seconds.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "201": { description: Added., content: { application/json: { schema: { $ref: "#/components/schemas/OrganiserHelper" } } } }
        "400": { description: "`invalid_input` with `details.email`, or `no_account_with_that_email`: they sign in to Yuvoy once with it first.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member`, `not_owner` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict`; `details.state` is the organiser's state.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
  /organisers/{id}/helpers/{travellerId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: travellerId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [organisers]
      operationId: removeOrganiserHelper
      summary: Remove a helper (owner)
      description: Somebody who is not a helper of it, an owner included, is 404.
      security: [{ travellerSession: [] }]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member`, `not_owner` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
  /organisers/{id}/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [organisers]
      operationId: listOrganiserEvents
      summary: An organiser's events, for a member
      description: >-
        Live ones soonest first, then those in checking soonest first, then
        cancelled, not accepted and ended ones latest first.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: Coming up first, then in checking, then past.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OrganiserEvent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
    post:
      tags: [organisers]
      operationId: postOrganiserEvent
      summary: Post an event (any member)
      description: >-
        It waits for a person's check (`in_checking`), or is `live` at once
        when self-publish is on for this organiser and caller. The posting
        member needs a proven email (409 `organiser_email_required`: open the
        add-a-way-in screen); nothing is stored without one. A suspended or
        closed organiser is 409 `conflict` with `details.state`. A field the
        server refuses is a 400 with `details` keyed by that field. Twenty
        posts and edits a day per organiser, then 429 with `Retry-After` in
        seconds.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganiserEventInput" } } } }
      responses:
        "201": { description: "In checking, or live when self-publish is on.", content: { application/json: { schema: { $ref: "#/components/schemas/OrganiserEvent" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`organiser_email_required`: Add an email to your account to post events. Or `conflict` with `details.state`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
  /organisers/{id}/events/{eventPostId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventPostId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [organisers]
      operationId: editOrganiserEvent
      summary: Change an event (any member)
      description: >-
        The whole event. One still in checking is changed where it waits. A
        live one reads `changes_in_checking` until a person accepts the
        changes, or stays `live` with them when self-publish is on. An event
        that started may keep its start. An ended event is 409
        `event_has_ended`; a cancelled or not accepted one, or a suspended or
        closed organiser, is 409 `conflict` with `details.state`. Counts
        against the twenty a day that posts do.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganiserEventInput" } } } }
      responses:
        "200": { description: "changes_in_checking, or live when self-publish is on.", content: { application/json: { schema: { $ref: "#/components/schemas/OrganiserEvent" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`event_has_ended`, `organiser_email_required`, or `conflict` with `details.state`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
  /organisers/{id}/events/{eventPostId}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventPostId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [organisers]
      operationId: cancelOrganiserEvent
      summary: Cancel an event (any member)
      description: >-
        Applies at once, whatever the organiser's state, and works while
        organiser pages are paused: everyone going is told once. Cancelling
        again answers the event as it is. An ended event is 409
        `event_has_ended`; a not accepted one is 409 `conflict` with
        `details.state`. 503 only when the server has no organiser store.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: Cancelled now; people going are told once., content: { application/json: { schema: { $ref: "#/components/schemas/OrganiserEvent" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`event_has_ended`, or `conflict` with `details.state`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
  /organisers/{id}/events/{eventPostId}/numbers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventPostId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [organisers]
      operationId: getOrganiserEventNumbers
      summary: How many are going, tapping through and turning up (any member)
      description: >-
        Counts only, never a name or an id: who is going stays private. An
        event that is not live yet has every count 0. Every count is for one
        date of the event, `on`: a weekly event's current date by default,
        or one before it. A traveller has one going and one answer per
        event, so on a past date `going` and `went` count only the people
        whose latest going is for that date: a regular who has since marked
        a later week counts on neither. `checkedIn` is the codes for that
        date used at the door. `ticketTapsAtLeast` is the taps from the day
        after the date before it ended up to this date's last day (the first
        date takes every tap before it): a tap does not say which week it was
        for.
      security: [{ travellerSession: [] }]
      parameters:
        - name: on
          in: query
          required: false
          description: >-
            One of the event's dates up to its current one: the current date
            or a whole number of weeks before it, back to its first. Anything
            else is 400 `invalid_input` with `details.on`, as is any `on` for
            an event with no date.
          schema: { type: string, format: date }
      responses:
        "200": { description: Counts only., content: { application/json: { schema: { $ref: "#/components/schemas/OrganiserEventNumbers" } } } }
        "400": { description: "`invalid_input` with `details.on`: not one of the event's dates.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }
  /organisers/{id}/claims:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [organisers]
      operationId: claimEventForOrganiser
      summary: Claim an event card as the organiser's (owner)
      description: >-
        An owner says a card Yuvoy found is one of the organiser's own events,
        and shows it one of three ways: `email_domain` (one of the owner's
        proven emails is at the event's website), `public_page_code` (the
        owner posts the code in the answer on a page the organiser controls)
        or `call_to_published_number` (a person calls the number on the
        event's own page). A person at Yuvoy checks the claim; the answer is
        202 with the claim's id and the words to show. Only a `verified`
        organiser claims: otherwise 409 `conflict` with `details.state`. An
        event the caller cannot see, one `getEvent` answers 404 for them, is
        404.
        `getEvent`'s `claimable` says whether a card can be claimed now. Five
        claims a day per organiser, then 429 with `Retry-After` in seconds.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [eventId, proofMethod]
              properties:
                eventId: { type: string, format: uuid, description: "The event card's id, as getEvent has it." }
                proofMethod: { type: string, enum: [email_domain, public_page_code, call_to_published_number] }
      responses:
        "202": { description: "Claimed; a person checks it.", content: { application/json: { schema: { $ref: "#/components/schemas/EventClaimReceipt" } } } }
        "400":
          description: >-
            `invalid_input` with `details` keyed by the field. `details.proofMethod`
            `no_website`: the event's page is on a ticket site, so an email does
            not show it; `email_not_at_event_domain`: none of the owner's proven
            emails is at the event's website. Choose another way.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`not_a_member`, `not_owner` or `adult_confirmation_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `claim_already_open`: somebody's claim on this event is with a person
            already. `conflict` with `details.reason` `already_claimed` (the event
            has an organiser) or `not_claimable` (post it from the organiser's
            page instead), or with `details.state` when the organiser is not
            verified. `organiser_email_required`: the owner has no proven email.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/OrganisersPaused" }

components:
  securitySchemes:
    travellerSession:
      type: http
      scheme: bearer
      description: >-
        The opaque token `verifyTravellerSignIn` returns. Proves a code reached
        a phone number; not tied to any booking. Lasts 14 days since it was
        last used: each request it authenticates extends it.
    statusToken:
      type: http
      scheme: bearer
      description: >-
        The opaque token minted by `createReservation`. Not a JWT and carries no
        claims — it is 256 bits of random with no meaning outside our database,
        which is what lets it be revoked and lets a stolen one be worthless once
        it is.
        A checkout or recovery link lives until 7 days after its departure ends,
        and never less than 72 hours from when it was issued (since 2026-10-15,
        yuvoy-api#305). Moving the departure later moves that expiry with it.
        Keep the link until it answers `token_expired` rather than dropping it
        on a clock of your own. A recovery link resolves its number's other
        trips (`/me`, `/me/bookings`) only in its first 72 hours; after that it
        still opens its own booking.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: A dependency is unavailable; the request was not recorded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SignInUnavailable:
      description: >-
        `sign_in_unavailable`: this way of signing in is switched off
        (`features.signIn` in `getAppConfig`), so nothing was recorded or sent.
        Not an outage. Hide the door rather than retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountDeletionPending:
      description: >-
        `account_deletion_pending`: the code was right, but this number closed
        its account (`deleteMyAccount`) and the request to erase it is still
        open, so it cannot sign in. Only ever answered after the code checked
        out, so it tells nobody without the code anything. The message says to
        contact support if closing the account was a mistake; render it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    TablesUnavailable:
      description: >-
        `tables_unavailable`: tables are paused, not broken. Say so and try
        again later.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    PeoplePaused:
      description: >-
        `people_paused`: the traveller's use of People is paused or has ended. `details.standing` says which
        and `details.until` when a pause ends.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    CatalogUnavailable:
      description: >
        The catalog cannot be read. Deliberately NOT an empty `200`: an empty
        list reads to a traveller as "nothing is on", which is a different and
        untrue statement about the world.


        Referenced from the experience routes since the contract was written and
        never defined until now — so the document did not resolve, and anything
        generating a client from it would have failed on this ref.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    AdultsOnly:
      description: >-
        `adult_confirmation_required`: this needs a traveller who has said they
        are 18 or over (`confirmMyAge`). Ask, then try again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PlansUnavailable:
      description: >-
        `plans_unavailable`: plans are paused, not broken. Say so and try again
        later.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OrganisersPaused:
      description: >-
        `organisers_paused`: organiser pages are paused, not broken. Say so and
        try again later. Cancelling an event still works.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    AccountDeletion:
      type: object
      additionalProperties: false
      required: [state, erasureDueBy, message]
      properties:
        state:
          type: string
          enum: [received]
          description: >-
            The erasure request has been recorded and nobody has acted on it
            yet. The only value this call answers with.
        erasureDueBy:
          type: string
          format: date-time
          description: >-
            When the personal data must be erased by: 30 days after the request
            was first made. A repeated call answers the first request's date.
        message:
          type: string
          description: >-
            One plain paragraph saying what happened and what is kept. Safe to
            show as it is.

    DeviceRegistration:
      type: object
      required: [kind, token, platform, appVersion]
      properties:
        kind:
          type: string
          enum: [expo]
          description: >-
            Which push service the token is for. Only `expo` today; another
            kind would be added here without changing anything else.
        token:
          type: string
          minLength: 25
          maxLength: 219
          pattern: '^(ExponentPushToken|ExpoPushToken)\[[A-Za-z0-9_-]{10,200}\]$'
          description: The token `getExpoPushTokenAsync` returned, exactly as returned.
        platform: { type: string, enum: [ios, android] }
        appVersion:
          type: string
          maxLength: 32
          pattern: '^[0-9A-Za-z][0-9A-Za-z._+-]{0,31}$'
          description: The app's own version, like `1.4.0`.

    DeviceToken:
      type: object
      required: [kind, token]
      properties:
        kind: { type: string, enum: [expo] }
        token:
          type: string
          minLength: 25
          maxLength: 219
          pattern: '^(ExponentPushToken|ExpoPushToken)\[[A-Za-z0-9_-]{10,200}\]$'

    AppUpdateRule:
      type: object
      additionalProperties: false
      required: [mode, minimumVersion, reason, changedAt]
      description: One app and platform's update rule.
      properties:
        mode:
          type: string
          enum: ["off", soft, required]
          description: >-
            `off`: no prompt. `soft`: below `minimumVersion`, a prompt the
            person can dismiss; the app stays usable. `required`: below
            `minimumVersion`, the app is blocked on the update screen.
        minimumVersion:
          type: string
          example: "1.4.0"
          description: '`MAJOR.MINOR.PATCH`, no leading zeros. `0.0.0` only while `off`.'
        reason:
          type: [string, "null"]
          enum: [general, security_fix, contract_break, null]
          description: >-
            Why staff set it. `required` always has `security_fix` or
            `contract_break`. Null on a rule nobody has set.
        changedAt:
          type: [string, "null"]
          format: date-time
          description: When staff last changed it. Null when the server has not read the rules yet.
    AppConfig:
      type: object
      additionalProperties: false
      required: [minimumVersion, features, support, deliveryHost]
      properties:
        minimumVersion:
          type: object
          additionalProperties: false
          required: [ios, android]
          description: >-
            The oldest app build still served, per platform, as
            `MAJOR.MINOR.PATCH`. An app whose own version is lower shows an
            update screen. `0.0.0` means no build is refused. Kept for builds
            older than `updatePolicy`: it carries a `required` rule's version
            and never a `soft` one's, so an older build never treats a prompt
            as a block. A build that reads `updatePolicy` ignores it.
          properties:
            ios: { type: string, example: "1.0.0" }
            android: { type: string, example: "1.0.0" }
        updatePolicy:
          type: object
          additionalProperties: false
          required: [ios, android]
          description: >-
            The update rule staff set for this app on each platform (D-052
            plan C), changed in the console without a deploy and served at
            most a minute late. A database fault keeps the last rule, and a
            server that never read one sends `off`, so a fault never makes
            the gate stricter. An API older than this sends no
            `updatePolicy`: read that, or anything malformed, as `off`.
          properties:
            ios: { $ref: '#/components/schemas/AppUpdateRule' }
            android: { $ref: '#/components/schemas/AppUpdateRule' }
        features:
          type: object
          additionalProperties: false
          required: [payments, inviteOnly]
          properties:
            payments:
              type: string
              enum: [coming_soon, available]
              description: >-
                `coming_soon` means cash is the only way to pay, and the app
                says online payment is on its way instead of offering it.
            inviteOnly:
              type: boolean
              description: Whether creating a reservation needs an admitted number.
            signIn:
              type: object
              additionalProperties: false
              required: [email, google, apple]
              description: >-
                Which sign-in doors are open (yuvoy-api#304), so each one
                appears the day its endpoint is live, with no app release.
                Signing in with a number has no switch and is always open. An
                API older than this sends no `signIn`: read that as all three
                false.
              properties:
                email:
                  type: boolean
                  description: "`requestTravellerSignIn` and `verifyTravellerSignIn` take `email`."
                google:
                  type: boolean
                  description: >-
                    `signInWithGoogle` is open. An iPhone app shows Google only
                    while `apple` is true as well (App Store guideline 4.8):
                    until Sign in with Apple exists, Google is Android only.
                apple:
                  type: boolean
                  description: >-
                    Reserved for Sign in with Apple, which is not decided yet
                    and has no endpoint. Always false until it does.
        support:
          type: object
          additionalProperties: false
          required: [whatsappE164, hours]
          description: How to reach a person. The same block `GET /me` carries.
          properties:
            whatsappE164:
              type: [string, "null"]
              description: Null until there is a support number; hide the chat button then.
            hours: { type: string }
        deliveryHost:
          type: [string, "null"]
          description: >-
            The host video and photographs are served from, or null when none
            is configured. An app may use it to allow-list media URLs.
        releases:
          type: object
          additionalProperties: false
          description: >-
            How far each release has reached, one key per release, changed by staff without a deploy. A key that is
            absent, or no `releases` at all (an API older than this), means "off". A release is open to the caller
            when its stage is `all`; `early` and the caller's `cohort` (getMyAccount) is `early` or `staff`; `staff`
            and the cohort is `staff`; never at "off". The server applies the same rule to every route a release
            adds, so this decides only what the app shows. A change reaches the app within about 8 minutes.
          properties:
            explore: { $ref: "#/components/schemas/ReleaseStage" }
            checkedCities: { $ref: "#/components/schemas/ReleaseStage" }
            going: { $ref: "#/components/schemas/ReleaseStage" }
            trigo: { $ref: "#/components/schemas/ReleaseStage" }
            plans: { $ref: "#/components/schemas/ReleaseStage" }
            tables: { $ref: "#/components/schemas/ReleaseStage" }
            people: { $ref: "#/components/schemas/ReleaseStage" }
            creator: { $ref: "#/components/schemas/ReleaseStage" }
            supply: { $ref: "#/components/schemas/ReleaseStage" }
            me: { $ref: "#/components/schemas/ReleaseStage" }
            organiserSelfPublish: { $ref: "#/components/schemas/ReleaseStage" }
            trigoActions: { $ref: "#/components/schemas/ReleaseStage" }
    ReleaseStage:
      type: string
      enum: ["off", staff, early, all]
      description: >-
        How far a release has reached: `off` nobody, `staff` staff testers, `early` staff testers and early users,
        `all` everybody, signed in or not.
    CatalogIndexEntry:
      type: object
      required: [kind, slug, lastModified, hasBookableDates]
      properties:
        kind:
          type: string
          enum: [experience, destination, market]
        slug: { type: string }
        marketKey: { type: string }
        destinationKey: { type: string }
        lastModified: { type: string, format: date-time }
        hasBookableDates:
          type: boolean
          description: >-
            Whether anything is currently sellable. A page with
            nothing bookable is still worth indexing — the
            season starts again — but the site may render it
            differently, and finding out should not cost a
            query per URL.
    ReelListItem:
      type: object
      properties:
        media: { $ref: "#/components/schemas/Media" }
        experience: { $ref: "#/components/schemas/ExperienceSummary" }
    DroppedReelViewEvent:
      type: object
      required: [index, reason]
      properties:
        index:
          type: integer
          minimum: 0
          description: The event's position in the request's `events` list, from 0.
        reason:
          type: string
          enum:
            - invalid_event
            - invalid_event_id
            - unknown_reel
            - watched_ms_out_of_range
            - invalid_viewed_at
            - viewed_at_in_future
            - viewed_at_too_old
            - consent_denied
          description: >-
            `invalid_event` is an event that is not an object
            or is missing `reelId`, `watchedMs`, `completed` or
            `viewedAt`. `consent_denied` is every event of a
            batch sent with the session of a traveller whose
            analytics choice is `denied`; none of it is stored.
    MyBookingListItem:
      type: object
      required: [reference, reservationId, experience, operator, localDate, localTime, state, guests, statusToken, experienceSlug, operatorSlug, heroImageUrl, destination, startsAt, timezone, createdAt, price, reviewed, canReview, unreadCount]
      properties:
        reference:
          type: string
          description: >-
            Empty while there is no booking: a request the
            operator has not answered yet, or one they accepted
            that is not paid for yet (`holding`).
        reservationId:
          type: string
          description: >-
            Always present. What the app matches against the
            trips saved on the phone when there is no reference
            yet.
        experience: { type: string }
        operator: { type: string, deprecated: true, description: The old name of `hostName`; sent beside it until the traveller cut-over (D-049). }
        hostName: { type: string }
        localDate: { type: string, format: date }
        localTime: { type: string, example: "06:30" }
        state:
          type: string
          enum: [pending_request, holding, paid_pending_ops, confirmed, declined, cancelled, completed, no_show]
          description: >-
            The booking's state, or for a request with no booking
            yet `pending_request` (waiting on the operator),
            `holding` (accepted, waiting on payment) or `declined`
            (the operator said no; see `reasonCode`). These are
            every value this field takes (since 2026-09-14 the list
            is declared; `holding` since yuvoy-api#270).


            - `pending_request`: a request the operator has not
            answered yet. There is no `reference` and no `payment`.

            - `holding`: the operator accepted the request and the
            seats are held until `holdExpiresAt`, which can be
            hours away (twelve, or the departure's booking cutoff
            if sooner). The same word, for the same hold, as
            `BookingStatus.state` on the page `statusToken` opens.
            There is no `reference` and no `payment` yet. Show it as
            a trip with something to do: "pay by" `holdExpiresAt`,
            as a time with its day when that is not today in the
            trip's market, and open the booking page, which offers
            what it offers any live hold: `createPaymentOrder`
            (card, when `getAppConfig` says `features.payments`
            is `available`) and
            `confirmCashBooking` with this row's `reservationId`
            (book now, pay the operator in cash on the day); the
            booking then reads `paid_pending_ops` here. Never show a
            price on this row as paid. Once the
            hold lapses unpaid the row is no longer listed, as a
            request nobody answered is not.

            - `paid_pending_ops`: booked, and not yet settled. For
            a cash booking this is a seat that is theirs, with the
            cash still to be paid on the day; `payment.collected`
            says whether it has been. `getBookingStatus` shows the
            same booking as `confirmed` with a `payment` block.

            - `confirmed`: booked and settled.

            - `declined`: the operator said no, to a request or to
            a booking. `reasonCode` says why on a request.

            - `cancelled`: called off by the traveller, the
            operator or us, including a departure cancelled for
            weather.

            - `completed`: the trip happened.

            - `no_show`: the boat went and the traveller was not on
            it. A past trip, not a cancelled one.
        guests: { type: integer }
        meetingPoint: { type: string }
        statusToken:
          type: string
          description: >-
            A booking link for this trip, minted for this
            response, so a trip booked on another phone opens
            here. Opens this booking only; it can never list the
            number's other trips. Issuing it revokes nothing.
        cancelledAt: { type: [string, "null"], format: date-time }
        reasonCode:
          type: string
          enum: [no_capacity, weather, not_operating, party_too_large, unsafe_for_party, other]
          description: Why the operator declined. Present only when `state` is `declined`.
        holdExpiresAt:
          type: string
          format: date-time
          description: >-
            When an accepted request's seats stop being held: the
            same instant as `holdExpiresAt` on the booking page.
            Present only when `state` is `holding` (yuvoy-api#270).
        experienceSlug:
          type: string
          description: The listing this trip was booked from, for linking back to it.
        operatorSlug:
          type: string
          deprecated: true
          description: The old name of `hostSlug`; sent beside it until the traveller cut-over (D-049).
        hostSlug:
          type: string
          description: The business, for linking to its page.
        heroImageUrl:
          type: [string, "null"]
          format: uri
          description: >-
            The listing's headline picture, resolved exactly as
            the catalog resolves `heroMedia`: a photograph from
            the image host or a video's poster. `null` when the
            listing has none; always sent.
        destination:
          type: string
          description: The place's display name, for example `Havelock`.
        startsAt:
          type: string
          format: date-time
          description: >-
            The departure as an instant, in UTC. `localDate` and
            `localTime` are the same moment already rendered in
            the market's zone.
        timezone:
          type: string
          description: IANA zone of the market, for rendering local time.
        createdAt:
          type: string
          format: date-time
          description: >-
            When the traveller asked for it: the reservation, so
            a request and a paid booking both have one.
        price:
          type: object
          required: [totalPaise, currency]
          description: >-
            The total agreed at checkout, from the frozen price
            snapshot. The same number `getBookingStatus` reports.
          properties:
            totalPaise: { type: integer }
            currency: { type: string }
        payment:
          type: object
          required: [method, collected, amountPaise]
          description: >-
            How the booking is being paid. Present once a booking
            exists; absent on a request nobody has answered and on
            an accepted one not yet paid for (`holding`).
            `online` is paid and collected. `cash` is paid to the
            operator on the day, and `collected` turns true when
            they record taking it.
          properties:
            method: { type: string, enum: [online, cash] }
            collected: { type: boolean }
            amountPaise:
              type: integer
              description: The same number as `price.totalPaise`.
        refund:
          type: object
          required: [amountPaise, state]
          description: >-
            Present only when a refund exists: the latest
            refund's state and the sum on its way back, as
            `getBookingStatus` reports it.
          properties:
            amountPaise: { type: integer }
            state:
              type: string
              enum: [requested, pending, failed, processed, reversed, abandoned]
        reviewed:
          type: boolean
          description: A review has been left for this trip.
        canReview:
          type: boolean
          description: >-
            Offer "leave a review": the trip is `completed`, has
            no review yet, and ended no more than 30 days ago.
            When true, `leaveReview` with this row's
            `statusToken` will accept one.
        unreadCount:
          type: integer
          minimum: 0
          description: >-
            Messages from the business on this booking that the
            traveller has not marked read (since 2026-09-21).
            Counted exactly as `BookingMessageThread.unreadCount`
            is, from the same marker, so only
            `markBookingMessagesRead` lowers it and fetching the
            conversation lowers nothing. Always present: `0`
            when there is nothing new, no conversation yet, or
            no booking yet.
    InterestOption:
      type: object
      required: [key, label, kind]
      properties:
        key: { type: string, description: "What to send in `interests`." }
        label: { type: string }
        kind: { type: string, enum: [activityType, category] }
    TripInviteDelivery:
      type: string
      enum: [not_sent_no_channel, queued, not_applicable]
      description: >-
        Whether we told anybody. `not_sent_no_channel`: an invitation to a
        number while there is no WhatsApp sender; it still waits in that
        number's account. `queued`: a WhatsApp message is on its way.
        `not_applicable`: a link, which we never send.

    GuestTripStatus:
      type: string
      enum: [pending, confirmed, completed, cancelled, called_off]
      description: >-
        Where the trip stands, for a guest. `pending` is a request still waiting
        on the operator. `called_off` is the operator standing the departure
        down; `cancelled` is the booking withdrawn, declined or lapsed.

    CreatedTripInvite:
      type: object
      required: [id, state, delivery, inviteUrl]
      properties:
        id: { type: string }
        state: { type: string, enum: [invited] }
        delivery: { $ref: "#/components/schemas/TripInviteDelivery" }
        inviteUrl:
          type: string
          description: >-
            Returned once. Offer Copy and Share; do not print it. Opens
            `/i/{token}` on the traveller app, where the invited person signs in
            with their own number and accepts.
          example: https://app.yuvoy.in/i/8Hk2-pQv7Zr

    TripGuest:
      type: object
      required: [id, state, delivery, createdAt]
      description: One invitation as the booker sees it. At most one of `name` and `phoneMasked`; a link nobody accepted has neither.
      properties:
        id: { type: string }
        phoneMasked:
          type: string
          description: The number's last four digits, the rest replaced.
        name:
          type: string
          description: The name a guest's profile had when they joined.
        state: { type: string, enum: [invited, joined, declined] }
        delivery: { $ref: "#/components/schemas/TripInviteDelivery" }
        createdAt: { type: string, format: date-time }

    TripInvitePreview:
      type: object
      required: [experience, experienceSlug, operator, hostName, localDate, localTime, status]
      properties:
        experience: { type: string }
        experienceSlug: { type: string }
        operator: { type: string, deprecated: true, description: The old name of `hostName`; sent beside it until the traveller cut-over (D-049). }
        hostName: { type: string }
        localDate: { type: string, format: date }
        localTime: { type: string, example: "06:30" }
        status: { $ref: "#/components/schemas/GuestTripStatus" }

    InvitedTrip:
      type: object
      description: >-
        A trip as a guest sees it. Deliberately absent: the booking reference,
        any booking link, the price, the payment, the refund position, and
        anything about the person who paid. A guest cannot cancel or change the
        booking.
      required: [id, role, guestState, experience, experienceSlug, operator, hostName, localDate, localTime,
                 meetingPoint, durationMinutes, partySize, status, going]
      properties:
        id:
          type: string
          description: The invitation's id, for getInvitedTrip, acceptInvitedTrip and declineInvitedTrip.
        role: { type: string, enum: [guest] }
        guestState: { type: string, enum: [invited, joined] }
        experience: { type: string }
        experienceSlug:
          type: string
          description: Links to the listing, `getExperience`.
        operator: { type: string, deprecated: true, description: The old name of `hostName`; sent beside it until the traveller cut-over (D-049). }
        hostName: { type: string }
        localDate: { type: string, format: date }
        localTime: { type: string, example: "06:30" }
        meetingPoint: { type: string }
        landmark: { type: string }
        durationMinutes: { type: integer }
        bring:
          type: array
          items: { type: string }
          description: What to bring. No listing field carries this yet, so it is absent for now.
        partySize: { type: integer }
        status: { $ref: "#/components/schemas/GuestTripStatus" }
        going:
          type: array
          description: >-
            Guests who accepted, in the order they did. A name only when they
            joined with a profile name, otherwise "Guest"; never a number. The
            booker is not listed; `partySize` counts them.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              you: { type: boolean, description: Present and true on the caller's own place. }

    TravellerSession:
      type: object
      description: One phone the signed-in number is signed in on.
      required: [id, device, createdAt, lastUsedAt, expiresAt, current]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Send to `endMySession` to end it.
        device:
          type: [string, "null"]
          maxLength: 100
          description: >-
            What the app said this phone is when it signed in, cleaned. Null
            when it said nothing. A label, not proof.
        createdAt:
          type: string
          format: date-time
          description: When this session signed in.
        lastUsedAt:
          type: string
          format: date-time
          description: >-
            When it last made a request, to within an hour: a session is only
            written back when its end has moved by more than that.
        expiresAt:
          type: string
          format: date-time
          description: >-
            When it ends unless it is used before then: 14 days since it was
            last used.
        current:
          type: boolean
          description: True for the session that made this request, and only it.

    TravellerAccount:
      type: object
      required: [phone, name, email, emailProven, provenEmail, interests, onboardingRequired, memberSince, trips, reviews,
                 support, admitted, stay]
      properties:
        phone:
          type: [string, "null"]
          description: >-
            The proven number, in E.164. Null for a traveller who signed in by
            email or Google and has not proved a number (yuvoy-api#304). Since
            then a traveller is one account with any number of proven ways in,
            and a number is one of them, not the account itself.
        name:
          type: [string, "null"]
          description: Null until given; also null for somebody who skipped the first screen.
        email: { type: [string, "null"] }
        emailProven:
          type: boolean
          description: >-
            True only when the account has a proven email, one a code was sent
            to or one Google runs, so Yuvoy's emails can reach it. False for an
            account with only a number, and for a Google sign-in at an address
            Google does not run. When false, say "Check this page for the
            answer" rather than promising an email.
        provenEmail:
          type: [string, "null"]
          description: >-
            The proven email itself, lower case: the address Ways in lists.
            Null exactly when emailProven is false. Not the profile's email,
            which is what the traveller typed on the Account tab.
        interests:
          type: array
          items: { type: string }
          description: Category and activity-type keys, in the order chosen.
        onboardingRequired:
          type: boolean
          description: Show the first-sign-in screen, skippable. Never a gate on booking.
        memberSince:
          type: [string, "null"]
          format: date-time
          description: The earlier of the profile's creation and the first booking on the number.
        trips:
          type: object
          required: [total, upcoming, completed]
          properties:
            total: { type: integer }
            upcoming: { type: integer }
            completed: { type: integer }
        reviews:
          type: object
          required: [count]
          properties:
            count: { type: integer, description: "Reviews this number wrote, published or not." }
        support: { $ref: "#/components/schemas/SupportContact" }
        admitted:
          type: boolean
          description: >-
            Whether this number may book when booking is by invitation: it
            redeemed a code, or it already held a booking when invitations
            began. Reported whether or not the gate is on. Show the code screen
            while it is false.
        cohort:
          type: [string, "null"]
          enum: [staff, early, null]
          description: >-
            Who this traveller is among the people who see releases early:
            staff, early, or null. See getAppConfig releases.
        ageConfirmed:
          type: boolean
          description: >-
            True once the traveller confirmed they are 18 or over (R4-T1).
            False for an account made before the year was asked: ask it once
            with `confirmMyAge`.
        creatorToolsOn:
          type: boolean
          description: >-
            Whether the traveller turned on the tools for adding a video of
            something they went on (R12-T1), set with `updateMyAccount`. False
            until they do. It shows or hides the tools and gates nothing.
        people:
          $ref: "#/components/schemas/PeopleSummary"
        stay:
          description: >-
            The days the traveller says they are on the island, set with
            `setMyStay`, or `null` when none is kept. Always present on this
            API.
          oneOf:
            - $ref: "#/components/schemas/TravellerStay"
            - type: "null"
        session:
          type: object
          description: >-
            Present only when a traveller session signed the request in; absent
            for a recovery token. Additive: a client that ignores it loses
            nothing.
          required: [expiresAt]
          properties:
            expiresAt:
              type: string
              format: date-time
              description: >-
                When this session now ends: 14 days since it was last used,
                including this request.

    PeopleStanding:
      type: string
      enum: [ok, requests_paused, restricted, removed]
      description: >-
        What the traveller may still do in People. `ok` everything; `requests_paused` everything but asking
        for new friends; `restricted` and `removed` nothing. Set by an automatic pause after reports and by
        the Yuvoy team's decision on a report.
    PeopleSummary:
      type: object
      additionalProperties: false
      required: [standing, requestsWaiting]
      description: The People line of the Account tab.
      properties:
        standing: { $ref: "#/components/schemas/PeopleStanding" }
        requestsWaiting: { type: integer, minimum: 0, description: Friend requests waiting for the traveller's answer. }
    PeopleHome:
      type: object
      additionalProperties: false
      required: [ageConfirmed, standing, sharing, needsName, requestEmails, friendCount, requestsIn, requestsOut, friendLink, privateUpcomingGoing]
      properties:
        ageConfirmed: { type: boolean, description: "R4-T1's answer. False: show R4's age step and call confirmMyAge." }
        standing: { $ref: "#/components/schemas/PeopleStanding" }
        standingUntil: { type: [string, "null"], format: date-time }
        sharing: { type: [string, "null"], enum: [friends, only_me, null], description: Null until chosen; reads as only_me. }
        needsName:
          type: boolean
          description: >-
            True when the account has no first name People can show: no name, or a first word that is not a
            name (a number, an address or a link). Ask for one with updateMyAccount before People opens.
        requestEmails: { type: boolean }
        friendCount: { type: integer, minimum: 0 }
        requestsIn: { type: array, items: { $ref: "#/components/schemas/FriendRequest" } }
        requestsOut: { type: array, items: { $ref: "#/components/schemas/FriendRequest" } }
        friendLink: { oneOf: [{ $ref: "#/components/schemas/FriendLink" }, { type: "null" }] }
        privateUpcomingGoing: { type: integer, minimum: 0, description: "Upcoming goings that are only me, for the first step's offer (`shareUpcomingGoing`)." }
    ItemVisibility:
      type: string
      enum: [only_me, friends]
      description: Who may see a going or a went answer. friends shows only when the person's sharing is friends too.
    FriendActivity:
      type: object
      additionalProperties: false
      required: [kind, at, person, event]
      description: A friend's going or went answer, as listFriendActivity shows it. Never a rating or tags.
      properties:
        kind: { type: string, enum: [going, went] }
        at: { type: string, format: date-time, description: "The event's start; for a went answer on an event with no date, when it was answered." }
        person: { $ref: "#/components/schemas/PersonRef" }
        event:
          type: object
          additionalProperties: false
          required: [eventId, title, startsAt, destinationKey]
          properties:
            eventId: { type: string, format: uuid }
            title: { type: string }
            startsAt: { type: string, format: date-time }
            destinationKey: { type: string }
    PersonRef:
      type: object
      additionalProperties: false
      required: [personId, shortName, initial]
      properties:
        personId: { type: string, format: uuid }
        shortName: { type: string, description: 'First name and last initial, like "Priya S.". Never a number or an email.' }
        firstName: { type: string, description: Present only where the caller may see the name. }
        initial: { type: string, maxLength: 2 }
    LifeEntry:
      type: object
      additionalProperties: false
      required: [entryId, kind, title, happenedAt, proof, checked, visibility, cheers]
      description: One entry of a life list, read from a record, with what proves it.
      properties:
        entryId: { type: string, description: "kind:uuid, like trip:{bookingId}." }
        kind: { type: string, enum: [trip, went, plan, table] }
        title: { type: string }
        happenedAt: { type: string, format: date-time }
        photoUrl: { type: [string, "null"], format: uri, description: "The entry's photo once photos are stored (R12-T1); null until then, and the app draws the department art (REQ-R10-01)." }
        destinationKey: { type: [string, "null"] }
        category: { oneOf: [{ $ref: "#/components/schemas/Category" }, { type: "null" }] }
        experienceSlug: { type: string, description: Trips only; opens the listing. }
        eventId: { type: string, format: uuid, description: Went entries only; opens the card. }
        proof: { type: string, enum: [booked, checked_in, said_you_went, with_friends, table_check_in] }
        checked: { type: boolean, description: True when the record itself proves it happened (an operator's tick or a table check-in). }
        rating: { type: [integer, "null"], minimum: 1, maximum: 5, description: "The owner's own rating, on the owner's list only; null on a friend's." }
        visibility: { $ref: "#/components/schemas/ItemVisibility" }
        cheers: { type: integer, minimum: 0 }
        cheeredBy: { type: array, items: { $ref: "#/components/schemas/PersonRef" }, description: "Who cheered. The owner's own list only." }
        cheeredByMe: { type: boolean, description: "Whether the caller has cheered it. A friend's list only." }
    FriendBadge:
      type: object
      additionalProperties: false
      required: [key, name, emoji, description]
      description: >-
        A badge on a friend's page. Computed live over the entries that friend may see, so it has no stored
        earned date, seen flag or evidence (CAL-121).
      properties:
        key: { type: string }
        name: { type: string }
        emoji: { type: string }
        description: { type: string }
        endsOn: { type: string, format: date, description: Seasons only. }
    Badge:
      type: object
      additionalProperties: false
      required: [key, name, emoji, description, earnedAt, checked, seen, evidence]
      description: A badge the caller earned, from the records that earned it.
      properties:
        key: { type: string }
        name: { type: string }
        emoji: { type: string }
        description: { type: string }
        earnedAt: { type: string, format: date-time }
        checked: { type: boolean, description: Earned by checked records alone. Only these show to friends. }
        seen: { type: boolean, description: "False until the app marks it with `markBadgesSeen`." }
        endsOn: { type: string, format: date, description: "Seasons only: the season's last day." }
        evidence:
          type: array
          maxItems: 10
          description: >-
            The entries that earned it, oldest first. An entry whose record is gone is left out, and the
            badge stays.
          items:
            type: object
            additionalProperties: false
            required: [entryId, title, happenedAt]
            properties:
              entryId: { type: string, description: "kind:uuid, as on LifeEntry." }
              title: { type: string }
              happenedAt: { type: string, format: date-time }
    BadgeProgress:
      type: object
      additionalProperties: false
      required: [key, name, emoji, description, have, need]
      description: A badge not earned yet, with how far the caller has got.
      properties:
        key: { type: string }
        name: { type: string }
        emoji: { type: string }
        description: { type: string }
        have: { type: integer, minimum: 0 }
        need: { type: integer, minimum: 1 }
        endsOn: { type: string, format: date, description: "Seasons only: the season's last day." }
    Friend:
      type: object
      additionalProperties: false
      required: [personId, name, firstName, initial, since]
      properties:
        personId: { type: string, format: uuid }
        name: { type: string, description: "The first word of the name the friend chose, the only part of it People shows." }
        firstName: { type: string }
        initial: { type: string, maxLength: 2 }
        since: { type: string, format: date-time }
    FriendRequest:
      type: object
      additionalProperties: false
      required: [requestId, direction, person, source, requestedAt]
      properties:
        requestId: { type: string, format: uuid }
        direction: { type: string, enum: [incoming, outgoing] }
        person: { $ref: "#/components/schemas/PersonRef" }
        source: { type: string, enum: [friend_link, plan, table] }
        requestedAt: { type: string, format: date-time }
        mutualFriends: { type: integer, minimum: 0, description: Incoming requests only. }
    FriendLink:
      type: object
      additionalProperties: false
      required: [code, url, expiresAt, requestsLeft]
      properties:
        code: { type: string, description: "Shown as XXXXX-XXXXX." }
