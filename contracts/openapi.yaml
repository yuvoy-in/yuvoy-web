      summary: Add an idea to vote on (planner; at most three)
      description: >-
        An event or experience idea must be one the planner can see. Its title
        passes the same check as a typed title (no link, email or phone
        number), else 400 with `details.id`. A fourth idea is 400 with
        `details.ideas`.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NewPlanIdea" } } } }
      responses:
        "200": { description: The plan., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`plan_closed`; `details.reason` says why.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/{id}/ideas/{optionId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: optionId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [plans]
      operationId: removePlanIdea
      summary: Withdraw an idea (planner)
      description: Withdrawing the picked idea clears `decidedIdeaId`.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: The plan., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
