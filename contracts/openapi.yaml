      required: [generatedAt, sections]
      properties:
        generatedAt: { type: string, format: date-time }
        sections:
          type: object
          description: >-
            One key per section of the erase coverage map; each an object or
            an array, described in docs/data-export.md.
          additionalProperties: true

    SupportContact:
      type: object
      description: >-
        How a traveller reaches a person. The same configuration everywhere it
        appears (`getMyAccount`, `getBookingStatus`).
      required: [whatsappE164, hours]
      properties:
        whatsappE164:
          type: [string, "null"]
          description: Null while Yuvoy has no support number. Hide "Chat with us" then.
        hours: { type: string, description: "When somebody is there to reply, in words." }

    BookingMove:
