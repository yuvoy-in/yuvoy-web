openapi: 3.1.0
info:
  title: Yuvoy API
  # 1.0.0: the catalog shapes are now implemented rather than proposed. This
  # release is breaking against 0.0.0-proposal — ratings and review counts are
  # gone (no real reviews exist, and a number nobody earned is a fabricated
  # claim), Media became a playback object, and Slot carries local time and
  # freshness. There are no live consumers of those shapes.
  version: 1.1.0
  description: >
    The Experience Commerce API consumed by yuvoy-web (and, later, the mobile
    app). This document is the FE/BE contract and the source of truth: the copy
    in `yuvoy-api` is canonical, the copy in `yuvoy-web` is a mirror.

    Conventions: money is an integer minor unit + currency; timestamps are
    ISO-8601 UTC; lists use cursor pagination; money-mutating requests require an
    `Idempotency-Key`; errors use a single envelope `{ error: { code, message, details, requestId } }`.

    Cross-origin, a browser may read four response headers: `Date`, our clock;
    `X-Request-Id`, the same value as an error's `requestId` and the one to
    quote when reporting a failure; `Idempotent-Replay`, on a write answered
    from an earlier send under the same `Idempotency-Key`; and `Retry-After`,
    on an answer that says to wait. A preflight answer carries
    `Access-Control-Max-Age: 7200`, so a browser may reuse it for the same URL
    for up to two hours (Chromium's limit; some browsers keep it for less)
    instead of five seconds.

    Two rules this API holds to, visible in the shapes below. Nothing is
    published that is not backed by a record — there are no ratings, no review
    counts and no placeholder prices, because a number nobody earned is a
    fabricated claim. And availability is only ever what Yuvoy itself has
    recorded and recently verified: a `request`-mode slot carries no seat count
    at all, because Yuvoy holds no inventory on it.

    Limits "per IP" count the address a request comes from. A web app's own
    server calling for a person (the traveller app's `/api/v1` proxy) names that
    person's address in `X-Yuvoy-Client-IP` and sends `X-Yuvoy-Proxy-Secret`
    with it; the address is counted only when the secret matches the one the API
    holds, and both headers are ignored otherwise, including while the API holds
    none. Server to server only: a browser cannot send either header here, and
    the secret never goes to a browser or a phone.

    `X-Yuvoy-Client-IP` holds one bare IPv4 or IPv6 address, on one header
    line: no port, no brackets, no list. Anything else, or two lines, counts
    the calling server instead. The calling server sets the header (never
    appends to one it received) from its host's visitor address: on Vercel,
    the `x-real-ip` request header.
servers:
  - url: https://api.yuvoy.in/v1
    description: Production
  - url: https://dev.api.yuvoy.in/v1
    description: >-
      Development. A second App Runner service with its own database, seeded
      fixtures and the FAKE payment provider — so checkout, capture, refunds and
      cancellation can be exercised end to end without a merchant account and
      without consuming real seats.


      It is called DEV and not staging on purpose. Staging implies a rehearsal
      of production — same shape, same data, a place you trust a green run. This
      is not that: the catalog is fixtures, the database is resettable, and it
      exists to be broken. A green run here means the wiring works, never that a
      release is safe.
  - url: http://localhost:8099/v1
    description: >-
      Local development. `scripts/dev-stack.sh` brings this up with seeded data,
      the fake payment provider and OTP codes in the response, so every flow is
      exercisable without a Razorpay account or an SMS provider.
tags:
  - name: auth
  - name: experiences
  - name: bookings
  - name: leads
  - name: messages
  - name: waitlist
  - name: me
  - name: trigo
  - name: plans
    description: >-
      Plans with friends (R7): a signed-in planner offers times, a bring list and
      costs, and shares one link. Never shown in Discover.
  - name: tables
    description: >-
      Join a table (R8): small tables the Yuvoy team opens at public places.
      A traveller asks to join; a person at Yuvoy approves each guest.
  - name: people
  - name: operators
    description: >
      The old paths of the `hosts` operations, kept until the traveller
      cut-over (D-049).
  - name: hosts
    description: >
      Supply-side entry points that need no account, because the person using
      them does not have one yet.
  - name: organisers
    description: >
      Organisers, venues and groups sending Yuvoy their events. The public
      form needs no account: an emailed code proves the address, and a person
      at Yuvoy checks every event before it shows. A signed-in adult can also
      set up an organiser page (R11-T2), post and edit its events and see how
      many people are going.
  - name: directory
    description: >
      Businesses in a place that are not on Yuvoy (R11): four facts and the
      public page they came from. Anybody may remove one at once.

security: []

paths:
  /leads:
    post:
      tags: [leads]
      summary: Register pre-launch interest as a traveller or a provider
      description: >
        Public, rate-limited pre-launch lead capture. The request is
        discriminated on `audience`. Geography is generic: `marketKey` names a
        launch market and destination keys name a destination within it, so
        future markets reuse this shape unchanged.


        A returning contact (same audience + normalised WhatsApp) updates its
        current preferences and attribution and returns `200`; a new contact
        returns `201`. Notification jobs are written in the same transaction as
        the lead, so a saved lead is never lost to an unavailable alert target.
      operationId: createLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201":
          description: New lead recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadAcceptance" }
        "200":
          description: Existing lead updated (same audience + WhatsApp)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadAcceptance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /messages:
    post:
      tags: [messages]
      summary: Send a message from the public contact form
      description: >
        Public, rate-limited contact form. Where `/leads` asks a visitor for
        their details, this lets them say something — the questions a
        pre-launch product gets and otherwise has nowhere to receive.


        Deliberately not a lead: a message carries no marketing opt-in and
        never joins a marketing list. It is used to answer the sender, and
        nothing else.


        Always `202`, never `201`: the response acknowledges receipt and
        promises nothing about a reply, because the site publishes no reply
        time. Notification jobs are written in the same transaction as the
        message, so a stored message is never lost to an unavailable alert
        target.
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "202":
          description: >
            Message received. Also returned for a submission caught by the
            honeypot, which is acknowledged normally and then discarded — a
            bot must not be able to tell that it was detected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageAcceptance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /search:
    get:
      tags: [experiences]
      summary: Find something to do
      description: >
        Full-text over the words a traveller would actually type — the title,
        the destination, the category, the summary.


        **Not the operator's name.** Searching by business is a supply-side
        question, and surfacing it here would be the one place ranking could
        express a preference between operators, which nothing else in this API
        can do. Ordering is relevance then recency, with no operator term.


        Its own route rather than a `q` on the feed: the feed is ordered by
        recency and is the browsing surface, search is ordered by relevance and
        is the finding surface. One endpoint doing both means one of the two
        orderings is always wrong and the client cannot tell which it got.


        An empty `q` **with no filters** returns nothing, not everything —
        "everything" is what the feed is for, and a search box that shows the
        whole catalog when you clear it looks broken.


        An empty `q` **with any filter set** returns that filtered set, ordered
        by recency. A traveller who taps Havelock and types nothing is not
        asking for everything, they are asking for Havelock, and answering that
        with a blank screen makes every chip look like a control that does
        nothing. Text and filters are independent; either alone is a real
        search, and together they intersect.


        Not paginated: a traveller who does not find it in twenty results
        changes the words rather than paging.
      operationId: searchExperiences
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: destinationKey
          in: query
          schema: { $ref: "#/components/schemas/DestinationKey" }
        - name: category
          in: query
          description: >-
            The closed browse vocabulary. **An unknown value is a `400`**, not
            an empty page — the two are indistinguishable to a client
            otherwise, and "no results" is the wrong thing to tell somebody
            whose filter was never going to match: they change the words
            instead of the spelling.
          schema: { $ref: "#/components/schemas/Category" }
        - name: activityType
          in: query
          description: >-
            What the thing actually is — `scuba`, not `adventure`. Matched
            exactly.


            **An unknown value is an empty page, not a `400`** — the opposite of
            `category`, and deliberately. This set grows by `INSERT`, so today's
            unknown value is tomorrow's real one and refusing it would make the
            API stale between deploys. Read the current set from
            `GET /catalog/vocabulary` rather than hardcoding it.
          schema: { type: string, maxLength: 60 }
        - name: bookableOn
          in: query
          schema: { type: string, format: date }
          description: Only what can actually be booked that day, in the market's timezone.
        - name: bookableFrom
          in: query
          schema: { type: string, format: date }
          description: >-
            With `bookableTo`, only what can actually be booked on at least one
            day from this one to `bookableTo`, both included, in the market's
            timezone: `bookableOn` over a range, by the same rule (open, not
            sold out, cutoff not passed). Send both or neither, at most 31 days
            apart, `bookableTo` not before this, and never with `bookableOn`;
            anything else is a `400`.


            With a range, each card's `nextAvailable` (and its seats) is its
            first departure **inside the range**, not the next one from today,
            and the 90-day look-ahead does not apply, so a stay further out
            still shows its date. Without a range, `nextAvailable` is
            unchanged.
        - name: bookableTo
          in: query
          schema: { type: string, format: date }
          description: >-
            The last day of the range, included. Only with `bookableFrom`.
      responses:
        "200":
          description: Matches, most relevant first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperiencePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /operator-applications:
    post:
      tags: [operators]
      summary: Apply to run experiences on Yuvoy
      description: >
        The old path of `submitHostApplication`, kept until the traveller cut-over (D-049).


        A business asking to join. Public and unauthenticated, because there is
        no account yet — that is the point.


        This creates an application, **not an operator**. An application is a
        claim somebody typed into a form; an operator is a business we have
        checked, whose credentials we hold and whose departures the catalog
        joins against. Nothing here can put an experience in front of a
        traveller.


        Deliberately forgiving about everything except the three fields needed
        to have a conversation — the business, a person, and a number that can
        be dialled. A form that rejects a boat owner for omitting a destination
        key loses supply in a market where supply is the constraint.


        The response carries no identifier: there is nothing a stranger could do
        with one, and handing out ids for rows in a review queue is one more
        authorization boundary to get right later.


        `next` points the applicant at self-service signup rather than promising
        a call. It used to say somebody would ring within two working days, and
        nothing kept that promise — the operators who submitted this form in
        August 2026 were still waiting a month later. `POST
        /operator/v1/auth/signup` is open to them right now, the account it
        creates is PROSPECT and cannot be booked, and document verification is
        still the gate — so both halves of the new sentence are things the
        system actually does.
      operationId: submitOperatorApplication
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, contactName, phone]
              properties:
                businessName: { type: string, minLength: 2, maxLength: 200 }
                contactName:  { type: string, minLength: 2, maxLength: 120 }
                phone:
                  type: string
                  description: E.164, with the country code.
                email:       { type: string }
                market:      { type: string }
                destination: { type: string }
                about:       { type: string, maxLength: 2000 }
                operations:  { type: string, maxLength: 1000 }
                source:      { type: string, description: Where they heard about us. }
                privacyAccepted:
                  type: boolean
                  description: >-
                    Send `true` and this call **also records the marketing lead
                    and its consent, in the same transaction as the
                    application**. One call, one unit of work: either both rows
                    exist and are linked, or neither does.


                    **Optional, and absent is not `false`.** Omitting it writes
                    the application alone and behaves exactly as this endpoint
                    always has, so a deployed form does not start failing
                    because we grew a field. Sending `false` is a person
                    declining, and is refused with `400` rather than filed —
                    recording a marketing contact for somebody who declined is
                    the one outcome this must not produce.


                    Until yuvoy-web sends this, the site calls `/leads`
                    separately. That works and is what it does today; it is
                    simply two independent writes that can half-succeed, and
                    the failure that matters is an application with no consent
                    row on a site whose privacy policy says we hold one.
                marketingOptIn:
                  type: boolean
                  description: >-
                    Only meaningful alongside `privacyAccepted`. Defaults false.
                utm:
                  allOf:
                    - $ref: "#/components/schemas/Utm"
                  description: >-
                    Campaign attribution for the lead. Ignored unless
                    `privacyAccepted` is sent, because without consent there is
                    no lead to attribute.
      responses:
        "202":
          description: Recorded. `next` tells them how to start without waiting for us.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  next:     { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /host-applications:
    post:
      tags: [hosts]
      summary: Apply to run experiences on Yuvoy
      description: >
        A business asking to join. Public and unauthenticated, because there is
        no account yet: that is the point.


        This creates an application, **not a host**. An application is a
        claim somebody typed into a form; a host is a business we have
        checked, whose credentials we hold and whose departures the catalog
        joins against. Nothing here can put an experience in front of a
        traveller.


        Deliberately forgiving about everything except the three fields needed
        to have a conversation: the business, a person, and a number that can
        be dialled. A form that rejects a boat owner for omitting a destination
        key loses supply in a market where supply is the constraint.


        The response carries no identifier: there is nothing a stranger could do
        with one, and handing out ids for rows in a review queue is one more
        authorization boundary to get right later.


        `next` points the applicant at self-service signup rather than promising
        a call. It used to say somebody would ring within two working days, and
        nothing kept that promise; the hosts who submitted this form in
        August 2026 were still waiting a month later. `POST
        /host/v1/auth/signup` is open to them right now, the account it
        creates is PROSPECT and cannot be booked, and document verification is
        still the gate, so both halves of the new sentence are things the
        system actually does.
      operationId: submitHostApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, contactName, phone]
              properties:
                businessName: { type: string, minLength: 2, maxLength: 200 }
                contactName:  { type: string, minLength: 2, maxLength: 120 }
                phone:
                  type: string
                  description: E.164, with the country code.
                email:       { type: string }
                market:      { type: string }
                destination: { type: string }
                about:       { type: string, maxLength: 2000 }
                operations:  { type: string, maxLength: 1000 }
                source:      { type: string, description: Where they heard about us. }
                privacyAccepted:
                  type: boolean
                  description: >-
                    Send `true` and this call **also records the marketing lead
                    and its consent, in the same transaction as the
                    application**. One call, one unit of work: either both rows
                    exist and are linked, or neither does.


                    **Optional, and absent is not `false`.** Omitting it writes
                    the application alone and behaves exactly as this endpoint
                    always has, so a deployed form does not start failing
                    because we grew a field. Sending `false` is a person
                    declining, and is refused with `400` rather than filed:
                    recording a marketing contact for somebody who declined is
                    the one outcome this must not produce.


                    Until yuvoy-web sends this, the site calls `/leads`
                    separately. That works and is what it does today; it is
                    simply two independent writes that can half-succeed, and
                    the failure that matters is an application with no consent
                    row on a site whose privacy policy says we hold one.
                marketingOptIn:
                  type: boolean
                  description: >-
                    Only meaningful alongside `privacyAccepted`. Defaults false.
                utm:
                  allOf:
                    - $ref: "#/components/schemas/Utm"
                  description: >-
                    Campaign attribution for the lead. Ignored unless
                    `privacyAccepted` is sent, because without consent there is
                    no lead to attribute.
      responses:
        "202":
          description: Recorded. `next` tells them how to start without waiting for us.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  next:     { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /app-config:
    get:
      operationId: getAppConfig
      tags: [me]
      summary: What the traveller app needs to know at launch
      description: >-
        Read at launch, before anybody signs in. Public and the same for every
        caller, so it is cached for a few minutes at the edge: a change to a
        setting reaches phones within that time. Every value is configuration,
        so changing one is a deploy of settings and never a release of the app.
      security: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }

  /waitlist:
    post:
      tags: [waitlist]
      summary: Join the launch waitlist
      operationId: joinWaitlist
      deprecated: true
      description: >-
        Retired. Superseded by POST /leads, which captures the same intent with
        audience, attribution and consent. Never implemented; returns 501.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitlistInput" }
      responses:
        "501":
          description: >-
            Not implemented, and deprecated. Declared rather than omitted: this
            is what the route actually answers, and a contract that promises a
            201 it never sends is worse than one that admits the stub.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "201":
          description: Added (idempotent on email)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /catalog/index:
    get:
      tags: [catalog]
      summary: Everything that has a public page, and when it last changed
      operationId: getCatalogIndex
      description: >-
        The data a sitemap is built from. **Not the sitemap** — the site's URL
        structure belongs to the site, and returning `/experiences/<slug>` here
        would mean a URL change needing a backend deploy, in the one repository
        nobody editing the site opens.


        The only catalog response that is genuinely edge-cacheable, because
        nothing in it moves without a person editing a listing. No seat counts,
        no prices, no availability beyond a boolean.


        `lastModified` is when the CONTENT changed, not when availability did. A
        crawler told a page changed every time a seat is booked learns to ignore
        the signal, which costs the pages that genuinely did change.


        For a destination or market it is the newest change among the published
        experiences on it: a destination page whose own row has not been touched
        since March is not unchanged if three listings appeared last week.


        Markets and destinations are the bookable ones: a market Yuvoy sells
        in, and a destination open to everybody. A place for finding things to
        do, or one still opening, has no page here.
      responses:
        "200":
          description: Every public page. Published experiences only.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogIndexEntry" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /catalog/vocabulary:
    get:
      tags: [catalog]
      summary: What the filter chips may offer
      operationId: getPublicVocabulary
      description: >-
        The words for `category`, `activityType` and `destinationKey` on
        `/search` and `/reels`: every category, the activity types, and the
        destinations that are open. No session. Build chips from this rather
        than from a hardcoded list, which disagrees with us the day a
        destination opens.


        **The active vocabulary, not the populated one.** A value with no
        published listing behind it today is still offered; filtering by it
        answers an empty page. Narrowing to populated values would make a chip
        vanish when its only listing pauses for a week and reappear when it
        comes back.


        `marketKey` narrows destinations and activity types to one market.
        Without it, destinations are those of every open market Yuvoy sells in
        and activity types are the whole list. A well-formed market we do not
        have, have not opened, or do not sell in (`mode` `discover` on
        `listPlaces`) answers categories and two empty lists rather than an
        error; a malformed one is a `400`. Either way a destination still
        opening, not yet open to everybody, is left out.


        Edge-cacheable: nothing here moves with a booking.
      parameters:
        - name: marketKey
          in: query
          schema: { $ref: "#/components/schemas/MarketKey" }
      responses:
        "200":
          description: The vocabulary.
          content:
            application/json:
              schema:
                type: object
                required: [categories, activityTypes, destinations]
                properties:
                  categories:
                    type: array
                    description: Every category, in the order chips should show them.
                    items: { $ref: "#/components/schemas/VocabularyTerm" }
                  activityTypes:
                    type: array
                    description: >-
                      Each with the category it belongs to, so chips can be
                      narrowed to the chosen category. Not an enum anywhere in
                      this contract: the set grows by INSERT.
                    items: { $ref: "#/components/schemas/ActivityTypeTerm" }
                  destinations:
                    type: array
                    description: >-
                      Open destinations, ordered by market and then as supply
                      wants them shown. `key` is `<market>/<destination>`.
                    items: { $ref: "#/components/schemas/VocabularyTerm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /places:
    get:
      tags: [catalog]
      summary: The places a traveller can pick
      operationId: listPlaces
      description: >-
        Markets (a state or region) and the destinations (towns and cities) inside them, with whether the market
        is for booking (`bookable`) or for finding things to do (`discover`), its time zone and currency, and
        whether each destination is somebody's home city (`local`) or a trip (`travel`). The same for everybody
        and cacheable at the edge for five minutes. A market with no destination open to everybody is left out.
        Discover markets appear when `explore` is `all` (`getAppConfig` `releases`). A signed-in traveller who may
        see releases early reads `listMyPlaces` instead.
        Name places from this list rather than from text in the app.
      responses:
        "200":
          description: Every place open to everybody, markets by name, destinations in display order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceList" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /events:
    get:
      tags: [catalog]
      summary: What was found for one discover place
      operationId: listEvents
      description: >-
        Found items for one discover place, for this caller. A place shows when
        the `explore` release stage and the place's audience include the caller;
        a caller with no credential sees places open to all. An unknown place, a
        bookable place and a place the caller may not see are the same `404`.
        In a `local` place only items a person checked show; elsewhere items
        that passed the automatic checks show too, labelled. Ordered by local
        day, checked before found within a day, then start time, then
        department; undated items come last. `when`, `free`, `q`, `asText`,
        `budget`, `timeOfDay`, `duration`, `setting`, `suits` and `difficulty`
        narrow and never reorder; while `checkedCities` is not open to the
        caller they are ignored without being checked and `understood` is
        empty. Once it is open, a value not in a filter's list is a `400`. Pass `nextCursor` back with the same filters: a
        cursor belongs to the filters it was minted under, `when`, `free` and `q`
        included. `complete: true` with no `nextCursor` is the end. Never
        cached: the answer depends on who asks.
      security: [{}, { travellerSession: [] }]
      parameters:
        - { name: destinationKey, in: query, required: true, schema: { $ref: "#/components/schemas/DestinationKey" } }
        - { name: category, in: query, description: "An unknown value is a `400`.", schema: { $ref: "#/components/schemas/Category" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 20 } }
        - { name: cursor, in: query, description: "From `nextCursor`, with the same filters. Opaque.", schema: { type: string, maxLength: 512 } }
        - name: when
          in: query
          description: >-
            `today` and `tomorrow` are the place's local dates; an item counts on every day it runs.
            `weekend` is Friday 17:00 to Sunday 24:00 local, this week's from Friday on, the coming one
            before; in a `local` place it leaves out cards not checked since that week's Monday once Friday
            has begun. Undated items never match. Ignored while `checkedCities` is not open to the caller.
          schema: { type: string, enum: [today, tomorrow, weekend] }
        - name: free
          in: query
          description: Only items whose source says they are free. A missing price never matches. `true` or `false`; anything else is a `400`.
          schema: { type: boolean }
        - name: q
          in: query
          description: >-
            Words, matched as prefixes and by spelling. Words the parse understands (a department, a
            day, free) become chips in `understood` and narrow as chips do. Narrows; does not reorder.
            Words with nothing searchable in them answer an empty, complete page.
          schema: { type: string, maxLength: 120 }
        - name: asText
          in: query
          description: Words of `q` to match as plain text and never as chips. At most 8, each at most 30 characters; a word not in `q` is ignored.
          style: form
          explode: true
          schema: { type: array, maxItems: 8, items: { type: string, maxLength: 30 } }
        - name: budget
          in: query
          description: >-
            Only items whose source states a price that fits, or says they are free. An item with no
            stated price never matches, except for `any`. `free=true` is the same as `budget=free`;
            `free=true` with `under_500` or `under_1500` is a `400`.
          schema: { type: string, enum: [free, under_500, under_1500, any] }
        - name: timeOfDay
          in: query
          description: >-
            Morning is before 12:00, afternoon 12:00 to 16:59, evening from 17:00, by the start time the
            source states. An item with no stated time never matches.
          schema: { type: string, enum: [morning, afternoon, evening] }
        - name: duration
          in: query
          description: >-
            From the stated start time to the stated end time on a one-day item; an item missing either
            time never matches. A multi-day item is `longer`. Under 2 hours is below 120 minutes, half a
            day 120 to 300, longer above 300. Ignored while `checkedCities` is closed.
          schema: { type: string, enum: [under_2h, half_day, longer] }
        - name: setting
          in: query
          description: >-
            `indoor` also matches an item stated as both, and so does `outdoor`. An item that states no
            setting never matches. Ignored while `checkedCities` is closed.
          schema: { type: string, enum: [indoor, outdoor] }
        - name: suits
          in: query
          description: >-
            Items whose source says they suit this group. An item that states none never matches.
            Ignored while `checkedCities` is closed.
          schema: { type: string, enum: [solo, couples, friends, families, kids] }
        - name: difficulty
          in: query
          description: >-
            Checked items only. An item that states none, and any unchecked item, never matches.
            Ignored while `checkedCities` is closed.
          schema: { type: string, enum: [easy, moderate, hard] }
      responses:
        "200": { description: One page., content: { application/json: { schema: { $ref: "#/components/schemas/FoundItemList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /events/index:
    get:
      tags: [catalog]
      summary: Found items a search engine may index
      operationId: getEventIndex
      description: >-
        Live items a person checked, in places open to all, while `explore` is
        at `all`; otherwise `entries` is empty. What the web app's sitemap is
        built from. At most 5,000 entries, latest change first.
      responses:
        "200": { description: The index., content: { application/json: { schema: { $ref: "#/components/schemas/FoundItemIndex" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /events/{id}:
    get:
      tags: [catalog]
      summary: One found item
      operationId: getEvent
      description: >-
        The same audience rule as `listEvents`. An item merged into another
        answers with the surviving item, so `id` may differ from the one asked
        for. An ended item answers `200` with `status: ended` while it is kept,
        if it was ever shown. Held and hidden items, and a malformed id, are `404`.
      security: [{}, { travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The item., content: { application/json: { schema: { $ref: "#/components/schemas/FoundItemDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /events/{id}/reports:
    post:
      tags: [catalog]
      summary: Tell Yuvoy a card is wrong
      operationId: reportEvent
      description: >-
        Anyone may report a card they can see. A report from a person with a
        booking or an account at least 7 days old, or a second report from a
        different signed-in person, takes a card nobody has checked out of view
        for everyone until a person at Yuvoy looks; any other signed-in report,
        and any report on a checked card, answers `hidden: you`. Signed out, it
        always answers `hidden: you`; hide the card on this device. No id of
        the device is sent, and a body that still carries `deviceId` is a
        `400`. Each report reaches Yuvoy's support queue. A signed-in
        reporter gets a `reference`, and the case shows in
        `listSupportRequests`, reading `resolved` once staff decide. The same
        person reporting the same card again is the same case. At most five
        reports a day on one card from one caller. Signed in, reports are
        counted per person, twenty a day; signed out, they are
        counted per caller address, and that count holds signed-out reports
        only. Past any of these day limits, `429` with `Retry-After` in
        seconds until that limit's day ends (midnight UTC). Reports sent too
        fast also answer `429`, with no `Retry-After`: wait a moment and send
        it again. A card the caller cannot see, and a malformed id, are
        `404`. Never cached.
      security: [{}, { travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventReport" } } }
      responses:
        "202": { description: Received., content: { application/json: { schema: { $ref: "#/components/schemas/EventReportReceipt" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: >-
            `rate_limited`. `Retry-After` is set only past a day limit, to the
            seconds until that day ends.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /events/{id}/videos:
    get:
      tags: [catalog]
      summary: Videos from people who went to an event
      operationId: listEventVideos
      description: >-
        As `listListingVideos`, for an event card. The card must be one the
        caller may see, as `getEvent` decides; otherwise `404`. A card merged
        into another lists the videos of the one kept. Never cached.
      security: [{}, { travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Newest first, at most 12.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ListingVideo" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /event-submissions:
    post:
      tags: [organisers]
      summary: Send Yuvoy an event
      operationId: submitEvent
      description: >-
        An organiser, venue or group sends one event in a discover place. It is
        stored unconfirmed and a 6-digit code goes to `email`; nothing reaches
        a person at Yuvoy until `verifyEventSubmission` succeeds, and nothing
        shows on Yuvoy until that person checks the event. The email is never
        shown on Yuvoy. The `202` is the same whether or not a letter could go
        out, so it does not promise one was delivered. Three a day per email
        and ten a day per caller address, then `429` with `Retry-After` in
        seconds; five codes an hour per email, and a daily ceiling on code
        letters across everyone, then `429` too. Requests sent too fast answer
        `429` with no `Retry-After`. A field the server refuses is a `400` with
        `details` keyed by that field: `officialUrl` for a link that is not
        http or https, has no host name, is an address literal or `localhost`,
        carries user information or is on a host the finder blocks;
        `priceFrom` or `priceTo` outside INR 1 to 1,00,000 rupees, a price on
        a free event, a paid event with no `priceFrom`, or `priceTo` below
        `priceFrom`; `startTime` or `endTime` from 24:00 on; `startsOn` before
        the place's local today or more than 365 days ahead; `endsOn` before
        `startsOn` or more than 30 days after it; `endTime` not after
        `startTime` on a one-day event; `destinationKey` not a discover place
        open to the caller; `department`, `email` and `consent`. `404` while
        `checkedCities` is not open to the caller; `503` while the form is
        switched off. Never cached.
      security: [{}, { travellerSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventSubmissionInput" } } }
      responses:
        "202": { description: Code sent., content: { application/json: { schema: { $ref: "#/components/schemas/EventSubmissionReceipt" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: >-
            `rate_limited`. `Retry-After` is set past a day limit and the daily
            letter ceiling, to the seconds until the sender may try again.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /event-submissions/{id}/code:
    post:
      tags: [organisers]
      summary: Send a new code
      operationId: resendEventSubmissionCode
      description: >-
        A new 6-digit code for a submission not yet confirmed, to the same
        email. No body. Five codes an hour per email and the daily ceiling on
        code letters, as `submitEvent`, then `429`. `409` once the event is
        already with our team. An unknown id, and a malformed one, are `404`;
        so is every request while `checkedCities` is not open to the caller.
        `503` while the form is switched off. Never cached.
      security: [{}, { travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, description: The submission's id from the receipt., schema: { type: string, format: uuid } }
      responses:
        "202": { description: Code sent., content: { application/json: { schema: { $ref: "#/components/schemas/EventSubmissionReceipt" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: this event is already with our team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: >-
            `rate_limited`. `Retry-After` is set past the daily letter ceiling,
            to the seconds until the sender may try again.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /event-submissions/{id}/verify:
    post:
      tags: [organisers]
      summary: Confirm the email; the event goes to our team
      operationId: verifyEventSubmission
      description: >-
        The code from the email. A right one moves the event to our team, where
        a person checks it before it shows. A wrong, expired or used code is
        `401`, and each try counts; ten tries an hour on one submission, then
        `429`. Each submission has its own code, so a second event from the
        same email does not spend the first one's. `409` once the event is
        already with our team, before any code is spent. An unknown id, and a
        malformed one, are `404`; so is every request while `checkedCities` is
        not open to the caller. `503` while the form is switched off. Never
        cached.
      security: [{}, { travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, description: The submission's id from the receipt., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventSubmissionVerifyInput" } } }
      responses:
        "200": { description: With our team., content: { application/json: { schema: { $ref: "#/components/schemas/EventSubmissionConfirmation" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: this event is already with our team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /tables:
    get:
      tags: [tables]
      operationId: listTables
      summary: Reviewed tables for a place, or around one event
      description: >-
        Tables the Yuvoy team opened for a place and a second person at Yuvoy
        reviewed, starting in the next 14 days and still taking requests,
        soonest first. A table around an event shows only while that event
        shows. Send `destinationKey`, or `eventId` for the tables around one
        event. A session is read when sent and never required; it adds
        `myRequest`. Outside the tables release the list is empty. A traveller
        can never open a table: there is no write route here. `503
        tables_unavailable` while tables are paused. Never cached.
      security: [{}, { travellerSession: [] }]
      parameters:
        - { name: destinationKey, in: query, schema: { type: string }, description: Required unless eventId is sent. }
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/TableList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/TablesUnavailable" }
  /tables/{id}:
    get:
      tags: [tables]
      operationId: getTable
      summary: One table; more of it for somebody with a request, the venue for an approved guest
      description: >-
        A table the list would show, or one the caller holds a live seat at
        (requested or approved) in any state, so a change by staff never turns
        a table somebody holds into a 404. `status` says where it stands.
        Anything else, a malformed id, and any table outside the tables
        release, is `404`. Never cached.
      security: [{}, { travellerSession: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: The table., content: { application/json: { schema: { $ref: "#/components/schemas/TableView" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/TablesUnavailable" }
  /tables/{id}/requests:
    post:
      tags: [tables]
      operationId: requestTableSeat
      summary: Ask to join. A person at Yuvoy approves each request.
      description: >-
        A sign-in session only, of a traveller who said they are 18 or over.
        Checked in this order: the caller's age, a ban, whether the table is
        listed for them (else `404`), whether it still takes requests (`409
        table_closed` past its close time, once started, or cancelled), a seat
        they already have on it (answered `200` with it, a declined or removed
        one too), the women-only tick, then the limits: three requests waiting
        or two seats coming up is `409 table_request_limit`, and ten requests
        a day is `429` with `Retry-After`. A table with every seat approved is
        `409 table_full`; there is no waitlist. It is also the answer when
        somebody the caller has a block with holds a live seat. A withdrawn request may be sent
        once more. `firstName` is needed only when the profile has no first
        name that can be shown (`400` with `details.firstName` `missing` or
        `not_a_first_name`). Requests sent too fast answer `429` with no
        `Retry-After`.
      security: [{ travellerSession: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/TableSeatRequest" } } } }
      responses:
        "201": { description: Requested., content: { application/json: { schema: { $ref: "#/components/schemas/TableView" } } } }
        "200": { description: "Already asked, or declined or removed: that seat.", content: { application/json: { schema: { $ref: "#/components/schemas/TableView" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required`, `table_banned` or `women_only`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`table_closed`, `table_full` or `table_request_limit`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429":
          description: >-
            `rate_limited`. `Retry-After` is set only past the day limit, to the
            seconds until it ends.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/TablesUnavailable" }
  /tables/{id}/requests/mine:
    delete:
      tags: [tables]
      operationId: withdrawTableSeat
      summary: Withdraw my request or give back my seat
      description: >-
        Any time before the start. A seat given back goes back to the table for
        somebody else. No live seat, and a table outside the tables release,
        is `404`; after the start, or on a cancelled table, `409
        table_closed`.
      security: [{ travellerSession: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: The table., content: { application/json: { schema: { $ref: "#/components/schemas/TableView" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`table_closed`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/TablesUnavailable" }
  /tables/{id}/reports:
    post:
      tags: [tables]
      operationId: reportTable
      summary: Report a table or somebody at it
      description: >-
        Anyone may report a table the list would show. A signed-in traveller
        who holds or held a seat at it may report it in any state until 90
        days after it ended, whatever the release or the pause. A person at
        Yuvoy reads every report within one working day. A report is never
        refused for being one too many: past five a day it is still stored and
        read. Reports sent too fast answer `429` with no `Retry-After`; send it
        again in a moment. Anything else is `404`.
      security: [{}, { travellerSession: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TableReport" } } } }
      responses:
        "202": { description: Received. A person reads it within one working day. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/tables:
    get:
      tags: [tables]
      operationId: listMyTables
      summary: Tables I asked to join, coming up and from the last 30 days
      description: >-
        Every table the caller asked to join that ends in the future or ended
        in the last 30 days, by start. Withdrawn requests are left out. Outside
        the tables release the list is empty. Never cached.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: Mine., content: { application/json: { schema: { $ref: "#/components/schemas/MyTables" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/TablesUnavailable" }

  /suppliers:
    get:
      tags: [directory]
      operationId: listSuppliers
      summary: Businesses in one place that are not on Yuvoy
      description: >-
        Businesses in one place that have not joined Yuvoy, by name. Only
        `listed` ones are in the list. A session is read when sent and never
        required; it only decides which release stage and place the caller
        sees. While the `supply` release is closed to the caller, while the
        `feature:directory` kill switch is engaged, and for a place that is
        unknown or not visible to the caller, the answer is the same `404`.
        Pass `nextCursor` back with the same filters; `complete: true` with no
        `nextCursor` is the end. Never cached.
      security: [{}, { travellerSession: [] }]
      parameters:
        - { name: destinationKey, in: query, required: true, schema: { $ref: "#/components/schemas/DestinationKey" } }
        - { name: category, in: query, description: "An unknown value is a `400`.", schema: { $ref: "#/components/schemas/Category" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, description: "From `nextCursor`, with the same filters. Opaque.", schema: { type: string, maxLength: 512 } }
      responses:
        "200": { description: One page., content: { application/json: { schema: { $ref: "#/components/schemas/SupplierListingList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /suppliers/{slug}:
    get:
      tags: [directory]
      operationId: getSupplier
      summary: One business not on Yuvoy
      description: >-
        One business by its slug, in any state, so a business that joined
        reads `joining` or `on_yuvoy` rather than vanishing. A removed one, an
        unknown slug, and the closed cases of `listSuppliers` are the same
        `404`. Never cached.
      security: [{}, { travellerSession: [] }]
      parameters: [ { name: slug, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: The business., content: { application/json: { schema: { $ref: "#/components/schemas/SupplierListing" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /suppliers/{slug}/removal:
    post:
      tags: [directory]
      operationId: removeSupplierListing
      summary: Take a business off the directory
      description: >-
        Anybody, signed in or not, removes the listing at once. It is not
        listed again unless the business joins Yuvoy or a person at Yuvoy
        lists it again. Only the reason is kept, with a hash of the name and
        website, never who asked. A claim waiting on the listing is withdrawn
        with it. A business already on Yuvoy is `409
        already_on_yuvoy`. Five removals a day from one caller address, then
        `429` with `Retry-After` in seconds until that day ends. Requests sent
        too fast also answer `429`, with no `Retry-After`. The closed cases of
        `listSuppliers` and an unknown slug are `404`. Never cached.
      security: [{}, { travellerSession: [] }]
      parameters: [ { name: slug, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SupplierRemoval" } } }
      responses:
        "204": { description: Removed. }
        "400":
          description: "`invalid_reason_code` for a reason outside the four, or `invalid_input`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "409":
          description: "`already_on_yuvoy`: the business has joined Yuvoy, so there is no listing to remove."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: >-
            `rate_limited`. `Retry-After` is set only past the day limit, to the
            seconds until it ends.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /organiser-check-ins:
    post:
      tags: [organisers]
      operationId: checkInAtTheDoor
      summary: Check somebody in at the door
      description: >-
        A member of an organiser types the code on a traveller's Going card
        (`checkIn` on listMyGoing), or opens its link, and the going is marked
        went with check-in proof. Idempotent: the same code again answers 200
        with `alreadyCheckedIn` and the first time. A code works on the
        event's first day and the day before it. A code that is unknown, for
        another organiser's event, for an organiser Yuvoy has not checked, or
        for a going taken back answers 404, the same for all of them. A sign-in
        session only (a recovery link is 401), then 404 while the `supply`
        release does not admit the caller, 403 `adult_confirmation_required`
        without the 18+ answer, and 503 `organisers_paused` while organiser
        pages are paused. 30 codes that match nothing in an hour, then every
        code answers 429 for the rest of that hour, a right one included;
        requests sent too fast answer 429 too. Never cached.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 8, maxLength: 12, description: "Eight characters; case, spaces and hyphens ignored." }
                via: { type: string, enum: [portal_link, typed], description: "How the code arrived: the card's link, or typed. typed when left out." }
      responses:
        "200":
          description: Checked in, now or earlier.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [firstName, eventTitle, checkedInAt, alreadyCheckedIn]
                properties:
                  firstName: { type: string, description: "The first word of the traveller's name; empty when they have not given one." }
                  eventTitle: { type: string }
                  checkedInAt: { type: string, format: date-time, description: The first time this code was used. }
                  alreadyCheckedIn: { type: boolean, description: True when the code had been used before this request. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdultsOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `own_code`: the code is the caller's own going, and somebody else
            at the door checks them in. `check_in_not_today`: the code is for
            another day, and details.validOn names it.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`organisers_paused`: organiser pages are paused, not broken. Say so and try again later."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /outcomes:
    post:
      tags: [catalog]
      summary: Report what people did with cards
      operationId: recordOutcomes
      security: [{}, { travellerSession: [] }]
      description: >-
        The apps report, in batches of 1 to 50, that a card was shown, opened, saved, shared, or that somebody
        followed its link out. Only with the person's analytics consent. Nothing about who sent it is stored
        and there is no field for it, with one exception from R4: a batch sent with a sign-in session of a
        traveller whose `analyticsConsent` (getMySettings) is `granted` is stored under that traveller, and one
        whose choice is `denied` is answered 202 with every event dropped as `consent_denied` and nothing
        stored. With no recorded choice, with a recovery link, or signed out, the rows name nobody. Signed-in
        batches are limited per session, signed-out ones per address. Each event carries an `eventId` minted once
        and kept until a call carrying it succeeds; the same id again is stored once and answered as accepted.
        Invalid events are dropped one by one and named in `droppedEvents`; only a body that is not a batch of
        1 to 50 is a 400. An event is dropped when `occurredAt` is more than 5 minutes ahead or 24 hours behind,
        or when its card is not one the app could have shown. For `subjectType` `event` that means a card held,
        hidden or merged away is dropped as `unknown_subject`, with one exception: `problem_reported` still
        counts on a held card, because a report may be what held it. Raw events are kept 180 days; daily totals are
        kept. A 429 means slow down, then send the same batch. 503 means nothing was stored: keep the batch and
        send it again later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/OutcomeEvent" } }
      responses:
        "202":
          description: >-
            The batch was read. `accepted` counts events stored by this call or by an earlier send of the same
            `eventId`; `dropped` counts the events refused, each named in `droppedEvents`.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, dropped, droppedEvents]
                properties:
                  accepted: { type: integer, minimum: 0, maximum: 50 }
                  dropped: { type: integer, minimum: 0, maximum: 50 }
                  droppedEvents: { type: array, items: { $ref: "#/components/schemas/DroppedOutcomeEvent" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { description: "`payload_too_large`: over 64 KB.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /scans:
    post:
      tags: [scans]
      summary: Record a scan of a printed code
      operationId: recordScan
      description: >-
        Somebody pointed a phone at a QR code on a boat, a card in a guesthouse,
        a sticker on a dive shop's door.


        **This endpoint sets no cookie and stores nothing identifying.** No
        device id, no IP, no user agent — the user agent is used to decide
        "person or crawler" and is then discarded in the same statement. That is
        the endpoint, not an omission: counting scans without an identifier is
        what keeps this an aggregate counter rather than personal data, and it
        is why there is no consent banner between a traveller and a QR code on a
        jetty. A client that adds its own identifier to the body defeats the
        design; there is no field for one.


        `target` is always populated, including for a code that resolves to
        nothing — an unknown or retired code lands on the market feed rather
        than an error page. Somebody standing on a pier holding a scuffed card
        did nothing wrong, and a 404 there is a dead end with no staff nearby.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[A-Za-z0-9-]{3,32}$"
                  description: >-
                    The code as printed. Short and human-readable because
                    somebody reads it aloud over a phone when a QR is scuffed.
                  example: HAVELOCK-DIVE-01
      responses:
        "200":
          description: >-
            Counted, and here is where to go. Always 200, including for an
            unknown code: the response is a destination, and the person holding
            the card needs one either way.
          content:
            application/json:
              schema:
                type: object
                required: [target, known]
                properties:
                  target:
                    type: string
                    description: Path to send the traveller to.
                    example: /e/scuba-discover-havelock
                  known:
                    type: boolean
                    description: >-
                      Whether the code resolved. `false` still carries a usable
                      target.
                  experienceId: { type: string, format: uuid }
                  marketKey: { type: string, example: andaman }
                  destinationKey:
                    allOf:
                      - $ref: "#/components/schemas/DestinationKey"
                    description: >-
                      Where the code is, when it is registered against a
                      destination rather than the market as a whole. A jetty
                      card in Havelock carries `andaman/havelock`.


                      **Absent when the code names no destination**, and absent
                      for an unknown code. It is not a filter the client has to
                      apply: it is what the client needs in order to open the
                      feed or search on the place the person is standing in,
                      rather than on the whole market.


                      This has always been on the `scan_codes` row and has
                      always been written to the analytics table. It was simply
                      not returned, so a jetty card in Havelock and a hotel card
                      in Port Blair sent two travellers to the identical
                      unfiltered feed.
                  kind:
                    type: string
                    enum: [printed, creator]
                    description: >-
                      `printed` for a card Yuvoy printed, `creator` for a
                      traveller's own link (R12-T2): arrive at `target` with
                      `src=creator` and the code, and send `source: creator`
                      and `scanCode` with checkout. Absent when the code
                      resolved to nothing.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /reels:
    get:
      tags: [catalog]
      summary: The feed
      description: >
        **Every published reel**, not one per listing. A listing may hold twenty
        clips; before this only its hero was visible without opening it, which
        made the product read as a catalogue with a picture on each row rather
        than as a feed.


        Each item carries the whole listing, so a card can offer the booking
        without a second request — a spinner over the price is a spinner over
        the one thing somebody stopped scrolling for.


        **Ordering interleaves operators, shuffled per visit.** Reels are
        numbered within each business and the feed is ordered by that number,
        so every operator's first reel precedes anybody's second. A business
        with twenty clips appears across twenty rounds rather than twenty times
        in a row. Which of a business's reels counts as its first, second and
        so on, and the order of businesses inside a round, are shuffled for
        each visit (since 2026-09-21; before that it was newest first). A
        request without `cursor` starts a new visit and gets a new order; the
        cursor carries the visit, so paging through one visit returns every
        reel exactly once, in one order. The ordering is blind to which
        operator: it rotates them, and cannot express a preference for one.


        **Paged, and it says whether it ended.** Pass `nextCursor` back to
        continue; its absence, with `complete: true`, is the end. Do not infer
        the end from a short page — a page that happens to come back exactly
        full would stop the scroll early, and an infinite scroll that has
        silently stopped looks identical to one with nothing more to show, so
        nobody reports it.


        The cursor resumes inside the rotation of its own visit, which is why a
        client must not attempt to page this ordering itself: restart the
        rotation and one business's second reel arrives before another's
        first, and the ordering stops being blind to which operator. A cursor
        minted before 2026-09-21 cannot be resumed in the shuffled order and is
        a `400`; start again from the first page.


        **Filters.** `q`, `destinationKey`, `category`, `activityType` and
        `bookableOn` narrow the feed with the same meaning and the same
        validation as `GET /search`: an unknown `category` is a `400`, an
        unknown `activityType` is an empty page, and a `q` with nothing
        searchable in it (only punctuation, or only exclusions) is an empty
        page rather than the words being ignored. Omit all of them and this is
        the unfiltered feed, unchanged.


        **Ranges** (since 2026-09-21). `minDurationMinutes`,
        `maxDurationMinutes`, `minPriceMinor` and `maxPriceMinor` are optional
        whole numbers, each bound inclusive, and combine with the filters
        above and with each other. Duration is the listing's
        `durationMinutes`. Price is in minor units (paise) and is compared with
        the same amount `fromPrice` shows. A negative number, a value that is
        not a whole number, or a minimum above its maximum is a `400` whose
        message and `details` name the parameter. **When any price bound is
        set, listings priced `per_group` are left out**, because a price for
        the whole group is not comparable with a price for one person.
        Duration bounds do not leave them out. These four are on this feed
        only; `/search` does not take them.


        Filters **narrow, they never rank**. The order is still the rotation,
        counted within the filtered set, so under "scuba at Havelock" every
        business's first matching reel still comes before anybody's second.
        There is no relevance ordering here; that is what `/search` is for.


        **A cursor belongs to the filters it was minted under**, the ranges
        included. Sending it with any different filter set is a `400`, because the rotation is
        counted within the filters and the same position means a different
        card under different ones. When the chips change, drop the cursor and
        start from the first page. The same words typed with different case or
        spacing are the same filter set.


        The order is stable within a visit, so a grid can open a reel and
        swipe on through the same sequence by paging with the cursor and the
        same filters. A first page asked for again, without a cursor, is a new
        visit and comes back in a different order.
        As with the unfiltered feed, a listing published, withdrawn or sold out
        (under `bookableOn`) between two pages can move later cards by a place.
      operationId: listReels
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 30 }
        - name: cursor
          in: query
          description: >-
            From a previous response's `nextCursor`, sent with exactly the same
            filters as that request. Opaque; do not construct one.
          schema: { type: string }
        - name: q
          in: query
          description: Free text, as on `/search`. Narrows; does not reorder.
          schema: { type: string, maxLength: 120 }
        - name: destinationKey
          in: query
          schema: { $ref: "#/components/schemas/DestinationKey" }
        - name: category
          in: query
          description: As on `/search`. **An unknown value is a `400`.**
          schema: { $ref: "#/components/schemas/Category" }
        - name: activityType
          in: query
          description: >-
            As on `/search`. Matched exactly; an unknown value is an empty page,
            not a `400`. The current set is in `GET /catalog/vocabulary`.
          schema: { type: string, maxLength: 60 }
        - name: bookableOn
          in: query
          schema: { type: string, format: date }
          description: >-
            Only reels of listings that can actually be booked that day, in the
            market's timezone.
        - name: bookableFrom
          in: query
          schema: { type: string, format: date }
          description: >-
            With `bookableTo`, only reels of listings that can actually be
            booked on at least one day from this one to `bookableTo`, both
            included, in the market's timezone: `bookableOn` over a range, by the same rule (open, not
            sold out, cutoff not passed). Send both or neither, at most 31 days
            apart, `bookableTo` not before this, and never with `bookableOn`;
            anything else is a `400`.


            With a range, each card's `nextAvailable` (and its seats) is its
            first departure **inside the range**, not the next one from today,
            and the 90-day look-ahead does not apply, so a stay further out
            still shows its date. Without a range, `nextAvailable` is
            unchanged.
        - name: bookableTo
          in: query
          schema: { type: string, format: date }
          description: >-
            The last day of the range, included. Only with `bookableFrom`.
        - name: minDurationMinutes
          in: query
          description: >-
            Only listings lasting at least this many minutes. Inclusive. Does
            not leave out `per_group` listings.
          schema: { type: integer, minimum: 0 }
        - name: maxDurationMinutes
          in: query
          description: >-
            Only listings lasting at most this many minutes. Inclusive. Not
            below `minDurationMinutes`.
          schema: { type: integer, minimum: 0 }
        - name: minPriceMinor
          in: query
          description: >-
            Only listings whose `fromPrice.amountMinor` is at least this, in minor
            units. Inclusive. Setting it leaves out `per_group` listings.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxPriceMinor
          in: query
          description: >-
            Only listings whose `fromPrice.amountMinor` is at most this, in minor
            units. Inclusive, not below `minPriceMinor`. Setting it leaves out
            `per_group` listings.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Reels, each with the listing it sells.
          content:
            application/json:
              schema:
                type: object
                required: [items, complete]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReelListItem" }
                  complete:
                    type: boolean
                    description: >-
                      Told rather than inferred. `false` with no `nextCursor`
                      means the server stopped, which is a different thing from
                      the feed having ended.
                  nextCursor:
                    type: string
                    description: Absent when there is nothing after this page.
        "400": { $ref: "#/components/responses/BadRequest" }

  /reels/{id}:
    get:
      tags: [catalog]
      summary: One reel, by its own link
      description: >
        A shared reel opens the reel, not the listing it belongs to.


        `id` is the `media.id` every feed card already carries, so a client
        builds the link from data it has. The response is the same item the
        feed returns, `{ media, experience }`, so the card renders with the
        same component.


        **Only reels the feed would show.** The same visibility rule as
        `GET /reels`: the clip is published and ready, the provider has made it
        public, and its listing can be sold today. Anything else is a `404`,
        and a reel that was hidden and one that never existed are
        deliberately the same answer, as for a draft listing. A malformed id is
        also a `404`: it is usually a link that was cut short.


        This returns the reel alone. To swipe on from it, page `GET /reels`
        as usual.
      operationId: getReel
      parameters:
        - name: id
          in: path
          required: true
          description: The feed card's `media.id`.
          schema: { type: string }
      responses:
        "200":
          description: The reel, with the listing it sells.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelItem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /reel-views:
    post:
      tags: [catalog]
      summary: Report reel views and watch time
      description: >
        The apps report which reels were watched, for how long, and whether to
        the end, in batches of 1 to 50. Collected so a ranking can later be
        built from real data. Nothing ranks on it yet, and nothing about a view
        changes what the feed shows.


        **Whose view it is.** The account's analytics choice decides, as it
        does for `recordOutcomes`. A batch sent with a sign-in session
        (`Authorization: Bearer <sessionToken>`) is read against that
        traveller's `analyticsConsent` (getMySettings). `granted`: the views
        are recorded against the traveller, with their number when they have
        one, so a traveller who signed in by email or Google is counted the
        same way. `denied`: the batch is answered `202` with every event
        dropped as `consent_denied` and nothing stored. No choice yet: the
        views are recorded with no identity, exactly as a signed-out view is.
        A session is read when one is sent and never required: no header, an
        unknown or expired token, or a booking link's status token all record
        the views with no identity, and none of them is a `401`. No device
        id, cookie or IP address is stored with a view, and there is no field
        for one. A `503` while the choice is read means nothing was stored:
        keep the batch and send it again later.


        **Retries.** Each event carries an `eventId`, a UUID the app mints once
        per view and keeps with it until the call succeeds. Sending the same
        `eventId` again, in a retry of the whole batch or twice in one batch,
        stores the view once and is answered as accepted, so a retry after a
        timeout is always safe.


        **Invalid events are dropped one by one.** The rest of the batch is
        kept. `droppedEvents` names each dropped event by its position in the
        `events` list and says why, so the app can discard it rather than send
        it again. Only a body that is not a batch of 1 to 50 events is a `400`.


        An event is dropped when its `eventId` is not a UUID; when `reelId`
        is not a reel the feed would show today (never published, withdrawn,
        or not on the `experienceId` named); when `watchedMs` is below 0 or
        above 600000 (ten minutes, ten loops of the longest reel); or when
        `viewedAt` is more than 5 minutes in the future or more than 24 hours
        in the past.


        Raw views are kept for 180 days and then deleted. Daily totals per
        reel are kept.


        **Body size.** Up to 256 KB, where every other route takes 64 KB. A
        full batch of 50 well-formed events is about 13 KB, so this is 50
        events of up to about 5 KB each: an app sending what it kept while
        offline counts events, not bytes, and a field added to an event later
        does not push a full batch over. A larger body is a `413` with
        `payload_too_large`, whether or not the request stated its length. Send
        fewer events per call; the same body sent again fails the same way.
      operationId: recordReelViews
      security: [{}, { travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: "#/components/schemas/ReelViewEvent" }
      responses:
        "202":
          description: >-
            The batch was read. `accepted` counts views stored by this call or
            by an earlier send of the same `eventId`; `dropped` counts the
            events refused, each named in `droppedEvents`.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, dropped, droppedEvents]
                properties:
                  accepted: { type: integer, minimum: 0, maximum: 50 }
                  dropped: { type: integer, minimum: 0, maximum: 50 }
                  droppedEvents:
                    type: array
                    description: In the order the events were sent. Empty when nothing was dropped.
                    items: { $ref: "#/components/schemas/DroppedReelViewEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413":
          description: >-
            `payload_too_large`: the body is over 256 KB. Send fewer events per
            call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /experiences:
    get:
      tags: [experiences]
      summary: List published experiences
      description: >-
        The browse surface, ordered by recency and cursor-paged. Use `/search`
        to find something; this is for looking.


        **`mode` and `q` used to be documented here and were never
        implemented** — the handler has never read either, so a client sending
        them got them silently ignored, and one sending `q` got an unfiltered
        list back believing it had searched. They are removed rather than
        implemented: relevance ordering belongs on `/search`, and one endpoint
        doing both means one of the two orderings is always wrong and the
        client cannot tell which it got.


        `destinationKey` and `bookableOn` are the reverse — implemented from
        the beginning and never documented, so a client built from this file
        could not know they existed. Now written down.
      operationId: listExperiences
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: destinationKey
          in: query
          schema: { $ref: "#/components/schemas/DestinationKey" }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: bookableOn
          in: query
          description: Only what can actually be booked that day, in the market's timezone.
          schema: { type: string, format: date }
      responses:
        "200":
          description: A page of experience summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperiencePage" }

  /experiences/{slug}:
    get:
      tags: [experiences]
      summary: Get a single experience by slug
      operationId: getExperience
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The experience
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experience" }
        "404": { $ref: "#/components/responses/NotFound" }

  /experiences/{slug}/videos:
    get:
      tags: [experiences]
      summary: Videos from people who went
      operationId: listListingVideos
      description: >-
        Published videos by travellers who went on this experience, newest
        first, at most 12. A signed-in viewer does not see a video they
        reported, or one by somebody they blocked or who blocked them. Outside
        the creator release the list is empty. Never cached.
      security: [{}, { travellerSession: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Newest first, at most 12.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ListingVideo" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /experiences/{slug}/availability:
    get:
      tags: [experiences]
      summary: Bookable slots within a date range
      operationId: getAvailability
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          description: >-
            Market-local date, inclusive. Interpreted in the experience's market
            timezone, not the caller's and not UTC — "the 9th" means the 9th
            where the boat leaves from.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Market-local date, inclusive.
          schema: { type: string, format: date }
      responses:
        "200":
          description: >-
            Slots in the requested local-date range, with the freshness of the
            answer. Stale slots are counted rather than silently omitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reservations:
    post:
      tags: [bookings]
      summary: Hold seats, or ask the operator for them
      description: >
        Checkout. Unauthenticated by design — the traveller is a stranger with a
        phone, and a login wall here is the largest drop-off available in the
        flow.


        Two behaviours, decided by the slot's `bookingMode`. An `allotment` slot
        holds seats immediately and returns `state: active` with a
        `holdExpiresAt`. A `request` slot creates `state: pending_request` with a
        `requestExpiresAt` and holds no seat at all — Yuvoy has no inventory on
        it until the operator accepts.


        A request is taken at any hour and however many are already waiting on
        the departure. It stays open until the operator answers or booking for
        the departure closes, so `requestExpiresAt` is the departure's booking
        cutoff, not a short answer clock. Capacity is checked when the operator
        accepts, not here.


        `Idempotency-Key` is required. A retry with the same key returns the
        original reservation with `201` and `Idempotent-Replay: true`. The
        status code is part of the stored response, so a client that retried
        after a dropped connection cannot tell its request was a repeat. The same
        key with a *different* body is refused: replaying it would hand back a
        reservation the caller never asked for. A key is remembered for 7 days,
        or 30 if its first request never finished; after that the same key is a
        new checkout.


        `statusToken` is returned once per answer. Only its hash is stored, so
        it cannot be recovered afterwards, including by us, and a retry cannot
        be handed the one the first answer carried. A retry gets a freshly
        minted `statusToken` for the same booking instead (since 2026-10-07,
        yuvoy-api#287), and the first one keeps working: keep whichever reached
        you. The fresh one expires when the first does. If the booking's links
        were revoked since (recovery revokes them) or have expired, or 20 of
        them are already live, a retry's `statusToken` is an empty string, and
        the booking is reached through recovery or the signed-in trip list. It belongs in a URL fragment,
        never a path or query.


        **Signed in (optional, since 2026-09-13).** Send `Authorization: Bearer
        <travellerSession>` (a recovery token also counts in its first 72 hours;
        a `statusToken` does not) and the checkout is the traveller's own:

          - `contact.whatsapp` may be left out, and is **ignored if sent**. The
            booking goes on the number the session proved. A typed number would
            put the booking on a number nobody proved, and it would appear in
            that number's account.
          - `contact.name` may be left out. The profile name is used, else the
            name on the newest booking made with the number. With neither, `400`
            with `details["contact.name"]`.
          - `contact.email` stays optional; left out, the profile email is used
            when there is one.
          - Anything sent in `name` or `email` is used as sent.

        A Bearer credential that is not a live sign-in (expired, signed out,
        unknown, or a booking's status token) is `401 unauthorized`, never a
        guest checkout: sign in again, or retry without the header. With no
        `Authorization` header, checkout is exactly the guest checkout above.


        **By invitation (yuvoy-api#195).** While the server's invite gate is
        on, creating a reservation needs a signed-in traveller whose number is
        admitted (`GET /me` says `admitted: true`; see `redeemInviteCode`).
        Anybody else, including a guest checkout with no `Authorization`
        header and a request to book, is `403 invite_required`, before
        anything is checked or held. While the gate is off, nothing here
        changes. Browsing, booking links, shared trips and everything about a
        booking that already exists are never gated.
      operationId: createReservation
      security: [{}, { travellerSession: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated, 16-128 chars of `A-Za-z0-9_.:-`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationInput" }
      responses:
        "201":
          description: Seats held, or the request lodged with the operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >
            A Bearer credential was sent and is not a live sign-in. Only ever
            answered to a request that sent `Authorization`; a guest checkout
            never sees it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Could not proceed, and the code says why: `capacity_unavailable`,
            `cutoff_passed`, `idempotency_key_reuse`, `idempotency_in_progress`.
            `request_quota_exhausted` and `request_window_closed` are no longer
            returned (since 2026-09-13): every request is taken.


            `answers_required`: the body sent `answers`, even an empty list, and
            a question the listing asks now with `required: true` has no answer
            in it that fits. `details.questions` names each such question as an
            object with `questionId` and `text`, in the listing's order, and
            `reason` when an answer was sent for it that did not fit (for a
            choice, "that choice is no longer offered, pick again"). Nothing
            was held, and the same `Idempotency-Key` can be sent again with the
            answers. A body without `answers` is never refused this way.


            Also `answers_required` when an answer, to any question, holds a
            phone number, an email address or a link. Then each object in
            `details.questions` also carries `reason`, a sentence to show beside
            the question that never repeats the answer, and `contactDetail`,
            `phone`, `email` or `link`. Such an answer is refused, never dropped,
            so the traveller learns why rather than being asked again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: >
            `invite_required`: booking is by invitation and the caller is not a
            signed-in, admitted traveller. The message says what to do next:
            sign in, then enter an invite code. Only answered while the invite
            gate is on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            Deliberately stopped, not broken — `booking_disabled` or
            `operator_not_bookable`. Distinct from an outage so the client can
            say something true.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reservations/{id}/release:
    post:
      tags: [bookings]
      summary: Give up a held reservation
      description: >
        Idempotent: releasing an already-released hold is not an error.


        Send the reservation's booking link (the `statusToken` from
        `createReservation`) or the owning traveller's session as
        `Authorization: Bearer`. A call without one still works for now and
        will be refused later (S-06, yuvoy-api#369).
      operationId: releaseReservation
      security: [{}, { statusToken: [] }, { travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: "Released, or already was." }
        "404": { $ref: "#/components/responses/NotFound" }

  /reservations/{id}/payment-order:
    post:
      tags: [bookings]
      summary: Open checkout for a held reservation
      description: >
        Returns the payment order to hand to the provider's checkout.


        **No `Idempotency-Key`, and that is not an omission.** One reservation
        has at most one payment order by construction, so asking twice returns
        the same order — stronger than a key the client has to remember to send,
        and it matters more here than anywhere else: two orders for one
        reservation is a traveller who can pay twice for the same seats.


        Only a live hold can be paid for. A lapsed hold, a released reservation
        and an experience with no contracted price all answer
        `reservation_not_payable`: they differ to us and not to the traveller,
        whose next step is the same in every case.


        Send the reservation's booking link (the `statusToken` from
        `createReservation`) or the owning traveller's session as
        `Authorization: Bearer`. A call without one still works for now and
        will be refused later (S-06, yuvoy-api#369).
      operationId: createPaymentOrder
      security: [{}, { statusToken: [] }, { travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            **Payment is not open yet** (D-021 — no processor chosen). A
            deliberate product state, not a failure: the hold is real and still
            running, so keep showing the countdown. Render `message` and do not
            treat this as an error.
          content:
            application/json:
              schema:
                type: object
                required: [state, message]
                properties:
                  state: { type: string, enum: [coming_soon] }
                  message: { type: string }
                  holdStillActive: { type: boolean }
                  payAtCounter:
                    description: >-
                      Where to finish instead. While no card processor is live
                      this is the ONLY way a booking can be completed, so a
                      client that renders `message` and stops leaves the
                      traveller unable to book at all.
                    type: object
                    required: [available, confirmAt]
                    properties:
                      available: { type: boolean }
                      confirmAt:
                        type: string
                        description: >-
                          Path to POST to, relative to the API base — the same
                          path as `POST /reservations/{id}/cash-booking`, so it
                          carries no `/v1` of its own.
        "201":
          description: The order to pay against.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The hold has ended; this reservation can no longer be paid for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /operators/{slug}:
    get:
      tags: [catalog]
      summary: A business, everything it sells, and its reels
      description: >
        The old path of `getHost`, kept until the traveller cut-over (D-049).


        The page behind the name on a reel. Tapping a reel opens its listing;
        tapping the operator on that listing had nowhere to go, so every
        business in the catalog was a name and a logo, and the other clips they
        had shot were reachable only by scrolling the whole feed until one came
        round again.


        **One request for the whole first paint** — who they are, what they
        sell, and the first screen of reels. Page the grid beyond that with
        `/operators/{slug}/reels`.


        **There are no followers and no rating.** Reviews do not exist until
        real completed bookings produce them, and a number nobody earned is a
        fabricated claim. Nothing here counts anything a person could inflate.


        **`bookable` is per listing as well as for the business**, and the page
        answers for a business that has paused rather than 404-ing — somebody
        was sent this link an hour ago and is looking for a specific thing they
        saw. A business that has never published anything has no page.
      operationId: getOperator
      deprecated: true
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The business.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorProfile" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hosts/{slug}:
    get:
      tags: [catalog]
      summary: A business, everything it sells, and its reels
      description: >
        The page behind the name on a reel. Tapping a reel opens its listing;
        tapping the host on that listing had nowhere to go, so every
        business in the catalog was a name and a logo, and the other clips they
        had shot were reachable only by scrolling the whole feed until one came
        round again.


        **One request for the whole first paint**: who they are, what they
        sell, and the first screen of reels. Page the grid beyond that with
        `/hosts/{slug}/reels`.


        **There are no followers and no rating.** Reviews do not exist until
        real completed bookings produce them, and a number nobody earned is a
        fabricated claim. Nothing here counts anything a person could inflate.


        **`bookable` is per listing as well as for the business**, and the page
        answers for a business that has paused rather than 404-ing; somebody
        was sent this link an hour ago and is looking for a specific thing they
        saw. A business that has never published anything has no page.
      operationId: getHost
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The business.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
  /operators/{slug}/reels:
    get:
      tags: [catalog]
      summary: The rest of a business's reels
      description: >
        The old path of `listHostReels`, kept until the traveller cut-over (D-049).


        Newest first, which is **not** the main feed's ordering. The feed
        rotates operators so no business owns the scroll; on one business's own
        page that rotation has a single member and means nothing, and what
        somebody opening a portfolio wants is the most recent work first.


        Paged, and it says whether it ended. Pass `nextCursor` back; its absence
        with `complete: true` is the end. Do not infer the end from a short
        page.
      operationId: listOperatorReels
      deprecated: true
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 30 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of the grid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hosts/{slug}/reels:
    get:
      tags: [catalog]
      summary: The rest of a business's reels
      description: >
        Newest first, which is **not** the main feed's ordering. The feed
        rotates hosts so no business owns the scroll; on one business's own
        page that rotation has a single member and means nothing, and what
        somebody opening a portfolio wants is the most recent work first.


        Paged, and it says whether it ended. Pass `nextCursor` back; its absence
        with `complete: true` is the end. Do not infer the end from a short
        page.
      operationId: listHostReels
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 30 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of the grid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reservations/{id}/cash-booking:
    post:
      tags: [bookings]
      summary: Confirm a held reservation, to be paid in cash on the day
      description: >
        The traveller commits now and pays the operator at the counter. The
        booking is real from this moment — it holds the seat, appears on the
        operator's manifest and can be cancelled like any other. The only thing
        not yet true is that anybody has been paid.


        **Cash is not a synthetic payment.** We never touch the money, so
        `capturedAmountPaise` on this booking stays `0` for its whole life and
        the commission becomes something the operator owes us, settled outside
        the payout run. Nothing about this booking claims we hold funds.


        **No `Idempotency-Key`, and that is not an omission.** One reservation
        has at most one booking by construction, so asking twice returns the
        booking the first ask made — with `200` rather than `201`, because
        nothing was created the second time. This matters more here than
        anywhere: two bookings for one reservation is one seat sold twice.


        The price is the one agreed at checkout, never a fresh read of the
        listing: an operator editing their price this afternoon must not change
        what somebody agreed to this morning.


        Send the reservation's booking link (the `statusToken` from
        `createReservation`) or the owning traveller's session as
        `Authorization: Bearer`. A call without one still works for now and
        will be refused later (S-06, yuvoy-api#369).
      operationId: confirmCashBooking
      security: [{}, { statusToken: [] }, { travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: The booking. Show the reference and what to bring.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashBooking" }
        "200":
          description: >-
            This reservation was already confirmed — the second tap on bad
            signal. The same booking, not a new one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashBooking" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The seats are no longer held, or a card payment is already open for
            them. Either way the traveller starts again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: We have stopped selling this operator's departures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /bookings/recovery/request:
    post:
      tags: [bookings]
      summary: Ask for a new booking link
      description: >
        For a traveller who lost their link. A phone number is not a secret — it
        is on the operator's manifest, in a WhatsApp group, often on the
        traveller's own social media — so this endpoint **answers identically
        whether or not the number has a booking**, including when throttled. An
        endpoint that differs is a way to find out who booked what.


        The code goes where `requestTravellerSignIn` sends one: the email on
        the newest booking made signed in as this number, or else the
        Account tab's. Never an email typed at a guest checkout
        (yuvoy-api#303).


        Clients must not branch on the response: there is exactly one body.
      operationId: requestBookingRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: "E.164, e.g. +919000000000" }
      responses:
        "202":
          description: Always this, for every number.
          content:
            application/json:
              schema:
                type: object
                required: [sent, message]
                properties:
                  devCode:
                    type: string
                    description: >-
                      **Development only.** Present when the service runs
                      outside production so the flow can be exercised without an
                      SMS account. Never present in production; a client must
                      never depend on it. Documented rather than hidden — an
                      undocumented field that appears in some environments is
                      one a client accidentally comes to rely on.
                  sent: { type: boolean }
                  message:
                    type: string
                    description: >-
                      The sentence `requestTravellerSignIn` answers a number
                      with, word for word, since the code goes where a sign-in
                      code goes (yuvoy-api#303): "If you gave us an email for
                      this number while signed in, or with your invitation, a
                      code is on its way to that email." True for every number,
                      and it reveals nothing.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /bookings/recovery/verify:
    post:
      tags: [bookings]
      summary: Exchange a recovery code for a new booking link
      description: >
        Returns a **new** status token and revokes the previous one. Token
        rotation is contractual, not incidental: recovery is most often used
        because a phone was lost or a message was seen by somebody else, so any
        link already in circulation must stop working.


        Wrong, expired, used and over-attempted codes all answer `401` with one
        message — telling a caller which it was tells somebody enumerating
        numbers whether the number exists.


        The new link lives as a checkout link does: until 7 days after its
        departure ends, never less than 72 hours (yuvoy-api#305). It reaches the
        number's other trips through `/me` and `/me/bookings` only in its first
        72 hours.
      operationId: verifyBookingRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: A fresh status token. The previous link no longer works.
          content:
            application/json:
              schema:
                type: object
                required: [statusToken]
                properties:
                  statusToken: { type: string }
                  note: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountDeletionPending" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /bookings/cancellation:
    post:
      tags: [bookings]
      summary: Cancel a booking
      operationId: commitCancellation
      description: >-
        The other half of the quote, and deliberately narrower than it.


        `expectedRefundPaise` is required and must equal what the quote just
        showed. Not a confirmation checkbox — a checkbox records that somebody
        tapped, this records **what they were told**. Between reading a quote
        and pressing the button a traveller can cross a tier boundary; the
        24-hour line falls in the middle of the night and people do sit on this
        decision. If the figure has moved, this answers `409 refund_quote_moved`
        and the client re-quotes, rather than cancelling at a worse number than
        the traveller agreed to.


        **A partial refund of money paid online is not self-service.** It
        answers `409 refund_requires_finance` and nothing is destroyed, because
        cancelling is irreversible and the seat returns to sale immediately, so
        self-serving a partial refund would take the trip away now and leave the
        money in an approval queue for days. Routing the traveller to a person
        BEFORE anything is lost is the kinder order. A partial tier with nothing
        to refund, which is where a booking with nothing paid online lands,
        needs nobody and cancels here with `refundPaise` 0. `selfService` on the
        quote tells the client whether to show the button at all.


        **A departure that moved after this booking was made** cancels with
        everything paid online refunded, whatever the tier, recorded as
        `OPERATOR_MOVED_IT` (D-032.3). The quote says so first, in `note`.
      security: [{ statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRefundPaise]
              additionalProperties: false
              properties:
                expectedRefundPaise:
                  type: integer
                  description: Echo the quote's `refundPaise` back, unchanged.
      responses:
        "200":
          description: Cancelled. The seat is back on sale and the refund is raised.
          content:
            application/json:
              schema:
                type: object
                required: [bookingReference, state, refundPaise]
                properties:
                  bookingReference: { type: string }
                  state: { type: string, enum: [cancelled] }
                  refundPaise: { type: integer }
                  refundTier: { type: string }
                  seatsReleased: { type: integer }
                  refundNote:
                    type: string
                    description: >-
                      A phrase about the money. When nothing comes back it says
                      why: nothing was paid online for the booking, or no refund
                      is due under its cancellation policy.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >-
            `refund_quote_moved` — re-quote and show the new figure.
            `refund_requires_finance`: a partial refund of money paid online; route them to support.
            `conflict` — not in a cancellable state.
            `stale_availability`: the booking moved to another departure while
            this was sent; nothing was cancelled, so quote it again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/move:
    post:
      tags: [bookings]
      summary: Move a booking to another departure
      operationId: moveBooking
      description: >-
        Moves the traveller's own cash booking to another departure of the same
        experience, in place: the reference, the booking's links, the price and
        the cancellation policy stay as they are. The move is checked as
        checkout checks a new booking, inside the departure's lock.


        With a session, `reference` names one of the traveller's own bookings;
        with the booking's status token it is ignored. A booking the caller does
        not hold is 404, like one that does not exist.


        Answered 404 to everybody until the trigo_actions release is open to
        the caller; a status token alone has no cohort, so it waits until the
        release reaches everybody. Until then `trigoActionId` is required and
        must name the Trigo card the traveller confirmed for this move.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated, 16-128 chars of `A-Za-z0-9_.:-`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingMove" }
      responses:
        "200":
          description: Moved. A replay carries `Idempotent-Replay` true.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `booking_not_changeable`, `booking_departed`, `change_needs_a_person`
            (`details.reason`), `capacity_unavailable`, `cutoff_passed`,
            `stale_availability`, `action_changed`, `idempotency_key_reuse`,
            `idempotency_in_progress`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/add-person:
    post:
      tags: [bookings]
      summary: Add people to a booking
      operationId: addPersonToBooking
      description: >-
        Adds 1 to 10 people to the traveller's own cash booking, up to 20 and
        the departure's largest party. They pay the price agreed at checkout for
        each person; a booking priced per group keeps its total. The listing's
        safety questions are asked for the added people as checkout asks them.
        `reference`, the release and `trigoActionId` as for moveBooking.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated, 16-128 chars of `A-Za-z0-9_.:-`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingAddPerson" }
      responses:
        "200":
          description: Added. A replay carries `Idempotent-Replay` true.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingChange" }
        "400":
          description: >-
            `invalid_input`, or `screening_required` when the listing asks a
            health declaration and none was sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The codes of moveBooking, plus `price_moved`,
            `screening_needs_a_doctor` and `under_minimum_age`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/saved:
    get:
      tags: [me]
      operationId: listSavedExperiences
      summary: The traveller's private saved experiences
      description: >-
        Newest saves first. Unpublished experiences stay in this list with
        bookable false and their summary when saved. No save counts or
        caller-specific fields are added to the public catalog. Cursor is
        opaque; pass nextCursor back unchanged. Responses are private and
        must not be cached by shared caches.
      security: [{ travellerSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Saved experiences, including unavailable ones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [me]
      operationId: saveExperience
      summary: Save an experience privately
      description: >-
        Idempotent. Repeating a save does not change its position in the list.
        Only public or withdrawn listings may be newly saved. Existing saves
        survive unpublication. A recovery credential is not a travellerSession.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experienceId]
              additionalProperties: false
              properties:
                experienceId: { type: string, format: uuid }
      responses:
        "204": { description: Saved already or now saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/saved/ids:
    get:
      tags: [me]
      operationId: listSavedExperienceIds
      summary: All ids in this traveller's private saved set
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: All saved ids, including unpublished experiences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedIds" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/saved/adopt:
    post:
      tags: [me]
      operationId: adoptSavedExperiences
      summary: Union device saves into the account and return the full set
      description: >-
        Atomic union, never replace. Idempotent; duplicates are ignored. At most
        200 ids per request. An invalid, unknown or never-public id refuses the
        entire request without changing the set. An existing saved id remains
        valid after unpublication. Adopt in batches when more than 200 device
        saves exist. Remove only through DELETE; adoption never removes saves.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experienceIds]
              additionalProperties: false
              properties:
                experienceIds:
                  type: array
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The resulting full saved set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedIds" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/saved/{experienceId}:
    delete:
      tags: [me]
      operationId: removeSavedExperience
      summary: Remove one private save
      description: Idempotent. Removing an absent save also answers 204.
      security: [{ travellerSession: [] }]
      parameters:
        - name: experienceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: No longer saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/saved/events:
    get:
      tags: [me]
      operationId: listSavedEvents
      summary: The events you saved
      description: >-
        Private to the caller; nobody else sees a save, and no card or count
        shows one. Newest saves first. A save made before two cards were merged
        answers with the card kept, and a card kept that two saves reach is
        listed once, at the newer save. Cursor is opaque; pass nextCursor back
        unchanged. Not held to the going release, so a traveller can always
        read what they saved. Responses must not be cached by shared caches.
      security: [{ travellerSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of saved events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/saved/events/{eventId}:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [me]
      operationId: saveEvent
      summary: Save an event privately
      description: >-
        Idempotent; a repeat keeps its place in the list. A merged card is
        saved on the card kept. An event that has ended can still be saved, as
        getEvent still shows it. 404 when the event is not shown to you (as
        getEvent decides) or the going release is not open to you. A signed-out
        visitor signs in first, then saves.
      security: [{ travellerSession: [] }]
      responses:
        "204": { description: Saved already or now saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [me]
      operationId: unsaveEvent
      summary: Remove one saved event
      description: >-
        Idempotent; an id that names nothing is 204 too. The id of the card
        kept also removes a save made on a card merged into it. Not held to the
        going release.
      security: [{ travellerSession: [] }]
      responses:
        "204": { description: No longer saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/going:
    get:
      tags: [me]
      operationId: listMyGoing
      summary: What you said you are going to
      description: >-
        The caller's own goings. Only friends see a going, and only one whose
        visibility is friends (listFriendsGoing); no card or count shows one.
        when=upcoming (the default) lists goings whose event has not
        ended, soonest first, moved and postponed ones included. when=past lists
        goings whose event ended or was cancelled in the last 12 months, newest
        first. Removed goings are not listed. Cursor is opaque; pass nextCursor
        back unchanged with the same when. Not held to the going release, so a
        traveller can always read the goings they have.
      security: [{ travellerSession: [] }]
      parameters:
        - name: when
          in: query
          schema: { type: string, enum: [upcoming, past], default: upcoming }
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of goings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [goings, complete]
                properties:
                  goings: { type: array, items: { $ref: "#/components/schemas/Going" } }
                  complete: { type: boolean }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/going/{eventId}:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [me]
      operationId: getMyGoing
      summary: One going, for the Did you go page
      description: >-
        Private to the caller. An id from before two cards were merged finds
        the going on the card kept, and answers with that card's id. A removed
        going, and one that is not yours, are 404.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: The going., content: { application/json: { schema: { $ref: "#/components/schemas/Going" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [me]
      operationId: setMyGoing
      summary: Say you are going
      description: >-
        Idempotent. On a removed or cancelled going it makes it going again,
        and that counts as a new one. On a moved one it is the "Yes, still
        going" answer: stillGoingAsked goes back to false and the reminder
        chosen for the new time stands. At most 20 a day, counted in the place's
        day; the 21st is 429 rate_limited. Never books, holds or pays anything.
        A date with no time can be added until midnight at the end of its first
        day; a timed one until it starts. Postponed and sold out items can be
        added; a postponed one has no reminder and no askWentAt. A merged card
        stores the going on the card kept, and eventId in the answer is that
        card's id. 404 when the item is not shown to you (as getEvent decides,
        so one no longer listed too) or the going release is not open to you.
        visibility says who may see the going (ItemVisibility). Omitted on a
        new going (or one removed before), it is friends when the caller's
        People sharing is friends and only_me otherwise; omitted on a going
        already marked, it stays as it was.
      security: [{ travellerSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                surface: { type: string, enum: [card, detail, tickets_prompt, saved, trips, other] }
                visibility: { $ref: "#/components/schemas/ItemVisibility" }
      responses:
        "200": { description: Going., content: { application/json: { schema: { $ref: "#/components/schemas/Going" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`event_not_open`: it has started, has no date, or is cancelled."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`rate_limited`: too many requests, or the 21st going in the place's day."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [me]
      operationId: removeMyGoing
      summary: Say you are not going after all
      description: >-
        Idempotent; an id that names nothing is 204 too. No reminder or Did you
        go is sent for it afterwards. A cancelled going can be removed, which
        takes it off the past list. Not held to the going release.
      security: [{ travellerSession: [] }]
      responses:
        "204": { description: Not going. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/event-ids:
    get:
      tags: [me]
      operationId: listMyEventIds
      summary: Ids to mark on cards (going and saved)
      description: >-
        Private and small, so card lists carry no per-person state (CAL-85).
        going holds postponed goings too. saved holds the traveller's saved
        found items (R4-T4, CAL-83) as listSavedEvents names them: the card
        kept after a merge, once, and only items whose card that list shows.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: The ids.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [going, saved]
                properties:
                  going: { type: array, items: { type: string, format: uuid } }
                  saved: { type: array, items: { type: string, format: uuid } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/went/{eventId}:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [me]
      operationId: answerDidYouGo
      summary: Say whether you went, and how it was
      description: >-
        Needs a going on this event (getMyGoing finds it). Open from the start
        the traveller was last told until 30 days after its end, and the answer
        can be changed until then; each answer replaces the one before. A
        postponed going cannot be answered yet. A rating and tags only with went
        true. via omitted is event_page; push means a tap on the app's own
        notification. An id from before two cards were merged answers the going
        on the card kept. Nobody else sees a rating or tags, and no event read,
        card or count carries a rating (REQ-R4-20). Friends see only that you
        went, and only when visibility is friends (listFriendActivity).
        visibility omitted on a first answer is friends when the caller's
        People sharing is friends and only_me otherwise; omitted on a changed
        answer, it stays as it was. updateMyWentVisibility changes it later.
        404 when you have no going on it or the going release is not open to
        you. Shares the going routes' rate limit.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [went]
              properties:
                went: { type: boolean }
                rating: { type: integer, minimum: 1, maximum: 5 }
                tags:
                  type: array
                  maxItems: 6
                  uniqueItems: true
                  items: { type: string, enum: [people, venue, organisation, value, atmosphere, would_go_again] }
                via: { type: string, enum: [trips_card, event_page, email_link, push] }
                visibility: { $ref: "#/components/schemas/ItemVisibility" }
      responses:
        "200": { description: Recorded., content: { application/json: { schema: { $ref: "#/components/schemas/WentAnswer" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_reviewable_yet` before the start or while postponed; `review_window_closed` 30 days after the end."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [people]
      summary: Who may see a went answer
      operationId: updateMyWentVisibility
      description: >-
        The one way to change who sees a went answer after it is given. friends shows it to friends only
        while the caller's People sharing is friends too, and never shows the rating or tags. It can be
        changed at any time, also after the 30 days in which the answer itself can change, and it changes
        nothing else. 404 when there is no went answer for this event,
        or while the `people` release is closed to the caller. A session only.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [visibility]
              properties:
                visibility: { $ref: "#/components/schemas/ItemVisibility" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [eventId, visibility]
                properties:
                  eventId: { type: string, format: uuid }
                  visibility: { $ref: "#/components/schemas/ItemVisibility" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "No went answer for this event, or the `people` release is closed to the caller.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me/bookings:
    get:
      tags: [me]
      summary: Every trip this phone number has booked
      operationId: listMyBookings
      description: >-
        **This is the whole of "traveller accounts".** There is no signup, no
        password and no new secret: signing in is the same OTP that already
        recovers a booking, and this is what it unlocks. An account here is a
        projection over a phone number somebody has proved they control.


        A traveller who never signs in loses nothing — none of this appears in
        the checkout path, and the founding claim is that a stranger pays in
        about a minute with no account.


        The phone comes from the verified token and is never a parameter. A
        `?phone=` here would let anyone read a stranger's itinerary by typing
        their number, which on a small island is a disclosure about where
        somebody will be and when.


        Since 2026-09-13 the credential is a `travellerSession` from
        `verifyTravellerSignIn`. A recovery token (`verifyBookingRecovery`) is
        still accepted in its first 72 hours, and answers `401` here after that
        while it keeps opening its own booking (yuvoy-api#305). Requests still waiting on the operator are listed, with
        `state: pending_request` and no `reference` yet. A request the operator
        accepted is listed from the moment of the accept until its hold lapses,
        with `state: holding`, `holdExpiresAt` and no `reference` yet
        (yuvoy-api#270). An unpaid checkout hold is not listed.


        **Tabs** (since 2026-09-13). `cancelled` is decided first and wins over
        the date: a trip whose `state` is `cancelled` (by the traveller, the
        operator or us, including a departure called off for weather) or
        `declined` (a booking or a request the operator refused). A `no_show`
        is **not** cancelled: the boat went, so it is a past trip. Of the rest,
        `upcoming` is a departure still ahead, including a request nobody has
        answered yet and an accepted one waiting on payment, and `past` is a
        departure that has left. The three tabs
        never overlap and together they are the whole list.


        **Paging.** A request with none of `tab`, `from`, `to`, `limit` or
        `cursor` returns every trip in one page with `nextCursor: null`, which
        is what apps deployed before paging existed rely on. Any one of them
        opts in to paging, and `limit` then defaults to 20. Pass `nextCursor`
        back as `cursor` with the same `tab`, `from` and `to`; a cursor from
        a different query is refused with `invalid_input`. A cursor also fixes
        the moment "upcoming" and "past" are split at, so a trip departing
        while somebody scrolls is never shown twice or skipped.


        Each returned row carries a freshly minted `statusToken`, so asking for
        a page rather than the whole history also mints fewer links.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      parameters:
        - name: tab
          in: query
          required: false
          description: >-
            `upcoming`, `past` or `cancelled`, as defined above. Omitted means
            every trip.
          schema: { type: string, enum: [upcoming, past, cancelled] }
        - name: from
          in: query
          required: false
          description: >-
            The first trip date to include, `YYYY-MM-DD`, inclusive. Compared
            with the trip's own date in its market's timezone.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: The last trip date to include, `YYYY-MM-DD`, inclusive. Not before `from`.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: >-
            Trips still to come first, soonest first; then past ones, most
            recent first. Somebody opening this on the morning of a dive wants
            the dive, not the thing they did in March. The `upcoming` tab is
            soonest first, and the `past` and `cancelled` tabs are most recent
            trip date first. (Before 2026-09-13 past trips came back oldest
            first, contrary to this description.)
          content:
            application/json:
              schema:
                type: object
                required: [bookings, nextCursor]
                properties:
                  nextCursor:
                    type: [string, "null"]
                    description: >-
                      Pass back as `cursor` for the next page. `null` when there
                      is nothing more, and always `null` on an unpaged request.
                  bookings:
                    type: array
                    items: { $ref: "#/components/schemas/MyBookingListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/sign-in/request:
    post:
      tags: [me]
      summary: Ask for a sign-in code for a number or an email address
      operationId: requestTravellerSignIn
      description: >-
        Send exactly one of `phone` or `email`. Both, or neither, is `400
        invalid_input`.


        **By email** (yuvoy-api#304). The code goes to the address given, and
        nowhere else, because receiving it is the proof that the address is
        theirs. Any address may ask; a first correct code opens an account,
        and a later one signs in to it. The answer is the same `202` whether or
        not the address already has an account. Open only while
        `features.signIn.email` is true in `getAppConfig`; otherwise `503
        sign_in_unavailable`, before anything is recorded or sent. Throttled
        per address as well as per caller.


        **By number.** Any number may ask, and a code is recorded for every one. Until there is
        a WhatsApp sender (yuvoy-api#68) the code is delivered by email, to the
        address on the **latest** booking made signed in as this number, or
        else the address on its Account tab (the rule `requestBookingRecovery`
        uses). Never to an address the caller supplies, never to one typed at
        a guest checkout, which anybody can type against any number
        (yuvoy-api#303), and never to an address from an older signed-in
        booking.


        When the number has never booked and staff issued an invite code for
        it, the code goes to the email staff entered with it (yuvoy-api#195),
        so a new invitee can sign in and then redeem. Once the number has a
        booking in any state, it goes there only if that invite code is the one
        that admitted the number and the latest booking gave no email. Once a number is admitted, only the code
        that admitted it counts, and a revoked code or an expired unused one
        sends nothing. That address comes from staff, not from the caller.


        A number with neither gets no message. The answer is identical in every
        case, so it does not reveal whether a number has booked or been
        invited: a client must not tell the traveller a code was sent, only
        that one is on its way **if** we hold an email for the number. The demo
        numbers still sign in with the fixed code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of `phone` or `email`.
              properties:
                phone: { type: string, description: "E.164, e.g. +919000000000" }
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: >-
                    Where the code goes (yuvoy-api#304). Compared without
                    regard to case and surrounding spaces.
      responses:
        "202":
          description: >-
            Always this, for every number and every address. It does not say
            whether a message went out or whether an account exists.
          content:
            application/json:
              schema:
                type: object
                required: [sent, message]
                properties:
                  sent:
                    type: boolean
                    description: >-
                      Always `true`. It means the request was taken, not that a
                      message was delivered.
                  message:
                    type: string
                    description: >-
                      One sentence, the same for every number, true whether or
                      not a code was sent: "If you gave us an email for this
                      number while signed in, or with your invitation, a code
                      is on its way to that email." For an email request it is
                      the same for every address: "A code is on its way to
                      that address."
                  devCode:
                    type: string
                    description: >-
                      **Development only**, as on `requestBookingRecovery`.
                      Never present in production.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/SignInUnavailable" }

  /me/sign-in/verify:
    post:
      tags: [me]
      summary: Exchange a sign-in code for a session
      operationId: verifyTravellerSignIn
      description: >-
        Returns a session that lasts 14 days since it was last used: every
        request it authenticates moves `expiresAt` to 14 days from then, so
        only a traveller away for 14 days is signed out. `expiresAt` here is
        the end as of signing in; `getMyAccount` answers the current one in
        `session.expiresAt`. **Revokes nothing**: every booking
        link saved on this phone, and any other phone this traveller is signed
        in on, keeps working. That is the difference from
        `verifyBookingRecovery`, which exists for a lost link and rotates it.


        Wrong, expired, used and over-attempted codes all answer `401` with one
        message.


        Send the same one of `phone` or `email` the code was asked for with
        (yuvoy-api#304); both, or neither, is `400 invalid_input`. The answers
        are the same for both. A first correct code for an email address opens
        an account for it once `birthYear` says the person is 18 or over
        (R4-T1); a new number is asked the year the same way only while the
        phone door asks it, which is off until the apps that ask are released.


        **Adding a way in** (yuvoy-api#304, owner decision MD-110). Send the
        traveller's session as `Authorization: Bearer` and the code instead
        adds that number or address to the signed-in traveller, answering
        `201 { linked: true }` and starting no new session. Saves, trips and
        invitations then follow the one traveller through either door. If the
        number or address already signs in to another traveller, the answer
        is `409 identity_taken` and nothing changes: two accounts are never
        merged. A traveller holds one number and one address (owner decision
        MD-111): adding a second of either is `409 identity_kind_taken`. A
        session or recovery link from before 16 Oct 2026 17:21 IST answers
        `401 fresh_sign_in_required`; sign in again, then add. A bearer that
        is not a live session or recovery link is `401` as well. Adding a way
        in opens with the email door: while `features.signIn.email` is false,
        a request with a bearer is `503 sign_in_unavailable`.
      security: [{}, { travellerSession: [] }, { statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`code`, and exactly one of `phone` or `email`."
              required: [code]
              properties:
                phone: { type: string }
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: The address the code was asked for with (yuvoy-api#304).
                code: { type: string }
                device:
                  type: string
                  description: >-
                    Optional. What this phone is, in words its owner would
                    recognise, e.g. "iPhone 15, iOS 18". Shown back in
                    `listMySessions` so a traveller can tell their phones apart.
                    Cleaned of control and formatting characters: a control
                    character or line break becomes a space, other formatting
                    characters are removed (the zero-width joiner and non-joiner
                    stay), runs of spaces become one, and the result is trimmed
                    and cut to 100 characters. Never refused, because a sign-in
                    must not fail over a device name: a value that is not a
                    string is ignored. Empty after that, or absent, means none.
                birthYear:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                  description: >-
                    Needed only when the code is the first for a person no
                    account holds (R4-T1): an email address always, a number
                    only while the phone door asks the year. Without it that
                    verify answers 400 invalid_input with details.birthYear
                    and the code stays usable. An under-18 year answers 403
                    under_age_sign_up, spends the code and creates nothing. A
                    returning person is not asked, and a year sent is ignored.
                birthdayPassed:
                  type: boolean
                  description: >-
                    Needed only when birthYear is this year minus 18 (in
                    India). Without it that verify answers 400 invalid_input
                    with details.birthdayPassed, and the code stays usable.
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [sessionToken, expiresAt]
                properties:
                  sessionToken:
                    type: string
                    description: "Send as an `Authorization: Bearer` header to `/me/bookings`."
                  expiresAt:
                    type: string
                    format: date-time
                    description: 14 days from now. Each use of the session moves it on.
        "201":
          description: >-
            Added to the signed-in traveller, when a session was sent. No new
            session.
          content:
            application/json:
              schema:
                type: object
                required: [linked]
                properties:
                  linked: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            `account_deletion_pending`: the code was right, but this account
            was closed and the request to erase it is still open, so it cannot
            sign in; render the message. Or `under_age_sign_up` (R4-T1): the
            year given is under 18, and nothing was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            With a session. `identity_taken`: the number or address already
            signs in to another traveller. `identity_kind_taken`: this
            traveller already has a number (or an address), and holds one of
            each. Nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/SignInUnavailable" }

  /me/sign-in/google:
    post:
      tags: [me]
      summary: Sign in with Google
      operationId: signInWithGoogle
      description: >-
        Exchanges the ID token Google Sign-In returned on the phone for the same
        session `verifyTravellerSignIn` returns (yuvoy-api#304). The token is
        checked against Google's published keys: signature, issuer, expiry, an
        audience that is one of ours, and an email Google has verified. On
        Android the audience is the traveller Web client id the app passes as
        `webClientId` (the Android client id appears only as `azp`); on iPhone
        it is the iOS client id. Never send an access token. A token that fails
        any check is `401` with one message, whichever check it failed.


        The Google account is the way in, keyed on its subject, so a change of
        address at Google does not change who signs in. Its address counts
        only where Google runs the mailbox: an `@gmail.com` address, or a
        Workspace account whose domain is the address's. Then, if the address
        already signs in to a traveller, the Google account joins that
        traveller, and a new one gets both. Any other address is ignored: the
        Google account signs in to its own traveller, and the person can add
        the address with an email code (`verifyTravellerSignIn` with a
        session). A traveller holds one Google account (MD-111): an address
        whose traveller already has a different one is `409
        identity_kind_taken`.


        Open only while `features.signIn.google` is true in `getAppConfig`;
        otherwise `503 sign_in_unavailable`. A `503 unavailable` means Google's
        keys could not be fetched just now; try again later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: The ID token (a JWT) from Google Sign-In on the phone.
                device:
                  type: string
                  description: >-
                    Optional, and cleaned exactly as `device` on
                    `verifyTravellerSignIn` is.
                birthYear:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                  description: >-
                    Needed only when this Google account would make a new
                    traveller (R4-T1); one that joins a traveller by address
                    is not asked. Without it the answer is 400 invalid_input
                    with details.birthYear and nothing is made: send the same
                    token again with the year, inside its lifetime. An under-18
                    year answers 403 under_age_sign_up and creates nothing.
                birthdayPassed:
                  type: boolean
                  description: As on `verifyTravellerSignIn`.
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [sessionToken, expiresAt]
                properties:
                  sessionToken:
                    type: string
                    description: "Send as an `Authorization: Bearer` header to `/me/bookings`."
                  expiresAt:
                    type: string
                    format: date-time
                    description: 14 days from now. Each use of the session moves it on.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            `account_deletion_pending`: this account
            was closed and the request to erase it is still open, so it cannot
            sign in; render the message. Or `under_age_sign_up` (R4-T1): the
            year given is under 18, and nothing was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            `identity_kind_taken`: the address's traveller already signs in
            with a different Google account. Nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: >-
            `sign_in_unavailable`: the Google door is switched off. Or
            `unavailable`: Google's keys could not be fetched just now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/session:
    delete:
      tags: [me]
      summary: Sign out on this phone
      operationId: signOutTraveller
      description: >-
        Ends this session only. `204` whatever the token was, including one
        already ended. Every phone this session registered with
        `registerTravellerDevice` stops getting pushes at the same moment, so
        an app does not need to unregister first (it may).
      security: [{ travellerSession: [] }]
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions:
    get:
      tags: [me]
      summary: The phones this number is signed in on
      operationId: listMySessions
      description: >-
        Every live session of the signed-in number: not signed out, not ended
        from here, and not past its 14 days since last use. The session making
        this request comes first with `current: true`, then the rest, most
        recently used first.


        **Not paged.** A number holds one session per phone it signed in on, so
        the list is short; it stops at the 50 most recently used, and the
        current session is always among them.


        **A session only.** A recovery token (`statusToken`) answers `401`: it
        is not a session, so it has none to list.


        `device` is what the app said when it signed in, and null when it said
        nothing. It is a label, not proof of which phone it is.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: The live sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    maxItems: 50
                    items: { $ref: "#/components/schemas/TravellerSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/sessions/{id}:
    delete:
      tags: [me]
      summary: Sign out on one phone
      operationId: endMySession
      description: >-
        Ends one live session of the signed-in number, from any phone signed in
        on it. Its token stops working on its next request. Ending the current
        session is allowed and is signing out (`signOutTraveller`).


        `404` for an id that is not a live session of this number: another
        number's, one already ended or expired, an unknown one and one that is
        not an id at all are the same answer, so nothing can be learnt by
        trying ids.


        **A session only**, as `listMySessions`.
      security: [{ travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: A session `id` from `listMySessions`.
          schema: { type: string }
      responses:
        "204": { description: Ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/devices:
    post:
      tags: [me]
      summary: Get pushes on this phone
      operationId: registerTravellerDevice
      description: >-
        Registers the push token `expo-notifications` gave this app, after
        sign-in. Sending the same token again refreshes it and is not an error,
        so an app may register on every launch. A token somebody else
        registered moves to this traveller: on a shared phone the pushes
        follow whoever signed in last.


        **Only a sign-in session** (`verifyTravellerSignIn`) registers a phone,
        whichever way the traveller signed in: by number, by email or with
        Google. A traveller with no number registers the same way, and a push
        meant for them reaches the phone. A booking link proves a booking, not
        who holds the phone, and answers `401`; a guest registers for one
        booking through `registerBookingDevice` instead.


        **A phone gets pushes only while the session that registered it is
        alive.** Signing out (`signOutTraveller`), or the session running out
        after 14 days unused, stops them; signing in again and registering
        again starts them.


        **What a push carries.** A generic title and sentence with no name,
        number, business, listing, amount, date or reference in it, and
        `data: { type, id }`. `type` is `booking` or `message` and `id` is the
        trip's `reservationId` as `listMyBookings` returns it; open the trip
        over the session to show anything more. Pushed today: booking
        confirmed, a request accepted or declined, a booking not accepted, a
        message from the business, a cancellation and the day-before trip
        reminder. An accepted request opens the trip `listMyBookings` lists
        as `holding` while its hold runs. A push about a traveller's own
        video has `type` `upload` and `id` the upload's id, which
        `getMyUpload` reads: it is live, not accepted, on hold, or taken off
        a listing. A push about a date alert, when a listing the traveller
        asked Trigo about gets a date, is `data: { type: date_alert, id }`
        with `id` the alert's id as `listMyDateAlerts` returns it; the app
        opens that alert's listing. Each push is sent beside the message on WhatsApp or email,
        never instead of it.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "204": { description: "Registered, or refreshed." }
        "400":
          description: >-
            `invalid_push_token` for a token that is not an Expo push token;
            `invalid_input` for anything else, with `details` keyed by field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [me]
      summary: Stop pushes on this phone
      operationId: unregisterTravellerDevice
      description: >-
        Stops pushes to one token of this traveller's, whether it was
        registered by a session with a number or without one. The token is in
        the body, not the query, because a URL is written to request logs.
        `204` whether or not the token was registered to this traveller, so
        the answer says nothing about whose a token is.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceToken" }
      responses:
        "204": { description: "Stopped, or was never registered here." }
        "400":
          description: As for `registerTravellerDevice`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me:
    get:
      tags: [me]
      summary: The Account tab
      operationId: getMyAccount
      description: >-
        Who the signed-in traveller is, a summary of their trips, and how to
        reach a person. Reads only: a number with no profile answers
        `onboardingRequired: true` with `name`, `email` and `memberSince` null.


        `onboardingRequired` is true until the first-sign-in screen has been
        completed or skipped (`updateMyAccount`). **It is never a gate.** Show
        the screen, let it be dismissed, and never put it in front of a booking
        in progress.


        `trips` counts exactly the rows `listMyBookings` returns: `total` is
        its length, `upcoming` is trips still ahead that are confirmed, waiting
        on the operator, or accepted and waiting on payment (`holding`; a
        declined or cancelled trip is not upcoming), and `completed` is trips
        that happened.


        `support.whatsappE164` is null until Yuvoy has a support number. Hide
        "Chat with us" while it is null. When present, open
        `https://wa.me/<number without +>?text=<message>` with the booking
        reference in the message; the traveller starts the chat, so nothing is
        sent on their behalf.


        `session` is present only when a traveller session signed the request
        in, and absent for a recovery token. `session.expiresAt` is when that
        session now ends, 14 days since this use. Keep a cookie or any stored
        expiry in step with it rather than with the value sign-in returned.


        `admitted` is whether the number may book when booking is by
        invitation. False means show the invite code screen
        (`redeemInviteCode`).
      security: [{ travellerSession: [] }, { statusToken: [] }]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TravellerAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [me]
      summary: Answer the first-sign-in screen, or edit the profile
      operationId: updateMyAccount
      description: >-
        Creates the profile on first save and updates it after. Send only the
        fields that change: an absent field is left alone, `email: null` or
        `email: ""` removes the email, and `interests: []` clears the
        interests.


        **The skip button is `{"onboarded": true}` on its own.** Any other
        first save needs a `name`. Saving a name also marks the screen
        answered, so the screen does not come back if `onboarded` is forgotten.


        `interests` are keys from `listInterestOptions`, or any category or
        activity-type key from `getPublicVocabulary`. At most 8 after
        duplicates are removed. Anything else is a `400`.


        Validation problems are a `400` with one plain sentence per field in
        `error.details`, keyed `name`, `email`, `interests`, `onboarded` or
        `creatorToolsOn`.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Trimmed before it is checked and stored.
                email:
                  type: [string, "null"]
                  maxLength: 254
                interests:
                  type: array
                  maxItems: 8
                  items: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
                onboarded:
                  type: boolean
                  enum: [true]
                  description: The first-sign-in screen was completed or skipped.
                creatorToolsOn:
                  type: boolean
                  description: >-
                    Shows or hides the tools for adding a video of something
                    the traveller went on (R12-T1). Needs no profile and no
                    name when sent on its own.
      responses:
        "200":
          description: The account after the change, the same shape as `getMyAccount`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TravellerAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [me]
      summary: Close my account
      operationId: deleteMyAccount
      description: >-
        Closes the signed-in traveller's account (D13: request now, erase
        later). In one step it records a request to erase this number's
        personal data, due within 30 days, signs the traveller out on every
        phone, and stops this number signing in again (`verifyTravellerSignIn`
        and `verifyBookingRecovery` answer `403 account_deletion_pending`)
        until our staff complete or refuse the request. Nothing is erased by
        this call.


        **What stops working.** Every session for this number, every link
        `verifyBookingRecovery` handed out, and every link `listMyBookings`
        handed out. Each of those can open the number's history or was minted
        because a session existed. While the request is open no session or
        recovery link for this number is accepted anywhere, even one somehow
        written after this call, and a trip list that was already on its way
        when the account closed answers `401` and hands out no links.


        **What keeps working.** The booking link a checkout handed out opens
        its own booking as before. Bookings are **not cancelled**: a trip still
        ahead goes ahead, the operator's manifest is unchanged, and the money
        records behind every booking (payments, cash, refunds, settlements)
        are kept. The later erase step removes the personal details from them
        and keeps the records.


        A session only. A booking link or a recovery link answers `401`: a
        link that opens one booking must not close an account. A second call
        has no session left and answers `401` too. Two calls racing each other
        from two phones leave one request: both answer `202` with the same
        `erasureDueBy`.
      security: [{ travellerSession: [] }]
      responses:
        "202":
          description: The account is closed and the erasure request is recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/places:
    get:
      tags: [me]
      summary: The places this traveller can pick
      operationId: listMyPlaces
      description: >-
        `listPlaces` plus the places still opening that this traveller may see, and discover markets once `explore`
        is open to them (`cohort` on getMyAccount, `releases` on getAppConfig). A recovery link reads only the
        public list, the same as `listPlaces`. Private to the caller: no shared cache may hold it.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      responses:
        "200":
          description: Every place this traveller may see, markets by name, destinations in display order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /me/settings:
    get:
      tags: [me]
      operationId: getMySettings
      summary: The account's analytics choice and email switches
      description: >-
        No recorded choice reads `analyticsConsent` null and both emails on, `languages` empty and
        `showWomenOnlyTables` true. A session only: a recovery link
        answers 401 "Sign in to change your settings." (CAL-29). Private to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/MySettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMySettings
      summary: Change one or more settings
      description: >-
        Send only what changes. analyticsConsent needs analyticsNotice, the
        version of the notice the person was shown, which must be a published
        consent_notices row for analytics (else 400 invalid_input), and surface,
        where the person chose (web, ios or android; else 400 invalid_input).
        Each change of choice is kept as evidence (R4-T2); the same choice on
        the same notice sent again is not a new one. surface is not read back.
        The three taste quiz answers (R4-T1) are optional: null clears one, and
        a value outside its list is 400 invalid_input.
        languages replaces the whole list; an unknown code, a repeat or more
        than four is 400 invalid_input with details.languages (R10-T1).
        A session only: a recovery link answers 401 "Sign in to change your
        settings." on GET and PATCH (CAL-29).
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                analyticsConsent: { type: string, enum: [granted, denied] }
                analyticsNotice: { type: string, maxLength: 40 }
                surface: { type: string, enum: [web, ios, android] }
                reminderEmails: { type: boolean }
                didYouGoEmails: { type: boolean }
                goesWith: { type: [string, "null"], enum: [solo, partner, friends, family, null] }
                daySpend: { type: [string, "null"], enum: [under_500, 500_to_1500, over_1500, null] }
                cityTime: { type: [string, "null"], enum: [visiting, under_a_year, longer, null] }
                languages: { type: array, maxItems: 4, uniqueItems: true, items: { type: string, enum: [en, hi, te, kn] } }
                showWomenOnlyTables: { type: boolean }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/MySettings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/age:
    put:
      tags: [me]
      operationId: confirmMyAge
      summary: Say the year you were born, once
      description: >-
        For a traveller who signed up before the year was asked (R4-T1). The
        first adult answer is kept and later calls answer 200 with no change.
        An under-18 answer stores nothing and closes the account: the server
        opens its erasure as `deleteMyAccount` does and ends its sessions, and
        an email goes to the address the traveller proved. A session only: a
        recovery link answers 401 "Sign in to add your birth year." (CAL-29).
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [birthYear]
              properties:
                birthYear: { type: integer, minimum: 1900, maximum: 2100 }
                birthdayPassed:
                  type: boolean
                  description: >-
                    Needed only when birthYear is this year minus 18 (in
                    India); without it the answer is 400 invalid_input with
                    details.birthdayPassed.
      responses:
        "200":
          description: Recorded, or already recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ageConfirmed]
                properties:
                  ageConfirmed: { type: boolean, description: "Always true." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            `under_age_sign_up`: nothing is stored, and the account is closed:
            its erasure is open and its sessions have ended. Render the
            message and sign the person out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            `age_locked`: the age answer is locked, because the Yuvoy team
            upheld a report that this person is under 18, and only the team
            can change it. Nothing is stored. The message is "Your age can only
            be changed by the Yuvoy team. Write to us from Help."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/export:
    get:
      tags: [me]
      operationId: exportMyData
      summary: Download everything Yuvoy keeps about the caller
      description: >-
        One JSON file holding the caller's account, trips, saves, plans and
        what they have shared: the same sections staff send for a data
        request, read for the signed-in traveller's own id, proven numbers and
        addresses. Other people appear only by first name, or by the last four
        digits of a number the caller typed (an invited guest's); never by a
        full number or an email. A session only: a recovery link answers 401
        "Sign in to download your data.". Three files a day, counted only when
        one is made, so the fourth in 24 hours is 429 rate_limited. Built
        within 6 seconds; past that, or on any failure, 503 unavailable "We
        couldn't make your file. Try again in a minute." and the attempt does
        not count. Never cached. Each section is described in
        docs/data-export.md.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: >-
            The file. Content-Disposition names it
            `yuvoy-my-data-<YYYY-MM-DD>.json`, the day in UTC.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TravellerExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/uploads:
    get:
      tags: [me]
      summary: My videos and photos
      operationId: listMyUploads
      description: >-
        The caller's own uploads, newest first, in any state but deleted. A
        session only: a recovery link is `401`. Outside the creator release
        (`releases.creator` in `getAppConfig`) every `/me/uploads` route is
        `404`. `organiser_image` lists the pictures the caller added to their
        organisers' events; a picture another member added is not here, it is
        on the event (`OrganiserEvent.picture`). Never cached.
      security: [{ travellerSession: [] }]
      parameters:
        - name: purpose
          in: query
          required: false
          schema: { type: string, enum: [listing_video, went_photo, organiser_image] }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CreatorUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [me]
      summary: Start adding a video or a photo of something I went on, or a picture to my organiser's event
      operationId: startMyUpload
      description: >-
        Checks that the caller went on the experience or the event, and that
        it is over, then returns where to send the file: a tus upload URL for
        a video, or a signed PUT for a photo. Either is returned once and
        never stored. The same call for the same target and size (and, for a
        photo, the same `contentType`) while that upload is still being sent
        resumes it and does not count again.


        `organiser_image` is a member's picture for one of their organiser's
        live events (R11-T2): `eventId` names the card, and the organiser is
        the card's own, so no organiser is sent. Any member may add it. It
        needs the supply release open to the caller as well as the creator
        release (`404` when either is closed), and is paused by either switch: `503
        uploads_paused` or `503 organisers_paused`. The body is `purpose`,
        `eventId`, `sizeBytes` (1 to 5242880), the picture statement
        (`statement.kind` `organiser_image`) and `peopleConsentConfirmed`;
        `experienceId`, `caption` and `contentType` are refused with `400
        invalid_input`, `details` naming the field. An event has at most one
        picture: a new start replaces the one there, uploading, in review or
        published, at once. It shares the five starts a day with videos. The
        answer's `protocol` is `post`: send the image to `url` as one
        multipart form-data POST with the field name `file`, then call
        `completeMyUpload`. Staff look before it shows on the card. A start
        is never resumed.


        For a video or a picture, show the statement the person agrees to
        before this call, and send its `version` and `sha256`.
        `peopleConsentConfirmed` must be `true`: they confirm everybody they
        can recognise in it agreed to be shown. A photo (`went_photo`) is
        private: only its owner ever sees it, nobody reviews it, and it sends
        no statement. Send its `contentType`; at most 3 photos of one trip or
        event (`409 photo_limit_reached`). A caption has at most 140
        characters and no phone number, email address or link (`400
        caption_has_contact`, `details.caption` says which; it is refused,
        never stripped).


        Five video or picture starts a day between them and ten photo starts
        a day, given back when a start is refused, then `429 rate_limited`.
        `503 uploads_paused` while adding videos, photos and pictures is
        paused (what is already up stays up); `503 photos_unavailable` for a
        photo when this service has no photo store; `503 media_unavailable`
        when the video provider, or for a picture the image host, is not set
        up. A session only. Never cached.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreatorUploadStart" } } }
      responses:
        "201":
          description: >-
            A video: send the file to `url` with tus, in chunks of
            `chunkBytes`. A photo: send it to `url` with one PUT and exactly
            `headers`. A picture: one multipart form-data POST to `url` with
            the field name `file`.
          content:
            application/json:
              schema:
                type: object
                required: [upload, protocol, url, expiresAt, maxBytes]
                properties:
                  upload: { $ref: "#/components/schemas/CreatorUpload" }
                  protocol:
                    type: string
                    enum: [tus, put, post]
                    description: "`tus` for a video; `put` for a photo; `post` for an organiser's picture."
                  url:
                    type: string
                    format: uri
                    description: >-
                      The tus upload URL of a video, the signed PUT of a
                      photo, or the POST URL of a picture. Returned once and
                      never stored. Do not log it or send it anywhere else.
                  headers:
                    type: object
                    additionalProperties: { type: string }
                    description: "For put: send exactly these headers with the file."
                  chunkBytes: { type: integer, description: Videos only. }
                  maxBytes: { type: integer, description: "5242880 for a photo or a picture." }
                  maxSeconds: { type: integer, description: Videos only. }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            `not_went`: the caller did not go on it, or their trip is still
            to come. `not_open_yet`: a card the caller said they went to
            whose event has not ended; they can add one once it is over.
            `adult_confirmation_required`: confirm the age first
            (`confirmMyAge`). `not_a_member`: a picture for an event of an
            organiser the caller is not a member of, or of a card with no
            organiser.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `video_already_posted`: the caller already has a video here;
            delete it first. `photo_limit_reached`: the caller already has 3
            photos of this; delete one first. `upload_in_progress`: finish
            sending the one already started; for a picture, another member
            started one at the same moment. A picture only: `event_has_ended`:
            the event is over. `conflict` with `details.reason` `not_live`:
            the card is cancelled, hidden or not live. `conflict` with
            `details.state`: the organiser is `suspended` or `closed`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: >-
            `uploads_paused`, `photos_unavailable` or `media_unavailable`; for
            a picture also `organisers_paused`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/uploads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [me]
      summary: One of my uploads
      operationId: getMyUpload
      description: Another traveller's upload, or a deleted one, is `404`. A session only. Never cached.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: One., content: { application/json: { schema: { $ref: "#/components/schemas/CreatorUpload" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [me]
      summary: Change the caption of one of my uploads
      operationId: editMyUpload
      description: >-
        Only the caption can change; `""` takes it away, and a body without
        it changes nothing. The caption rules of `startMyUpload` apply. Once
        staff approve the video its caption is fixed: `409 caption_locked`.
        A session only. Never cached.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                caption: { type: string, maxLength: 140 }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/CreatorUpload" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `caption_locked`: staff approved this video, and what they
            approved is what shows. Delete it and post it again to say
            something else.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [me]
      summary: Delete one of my uploads
      operationId: deleteMyUpload
      description: >-
        Gone from every Yuvoy page now, in any state; the file is deleted
        within the hour. `503 photos_unavailable` for a photo when this
        service has no photo store. A session only.


        An organiser's picture can be deleted by the member who added it or
        by any current member of that organiser, with the `uploadId` from
        `OrganiserEvent.picture`; the card shows its department's art again.
        Anybody else gets `404`.
      security: [{ travellerSession: [] }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`photos_unavailable` or `media_unavailable`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/uploads/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [me]
      summary: Say the file is sent
      operationId: completeMyUpload
      description: >-
        Asks the video provider, or for a photo the bucket, whether the whole
        file arrived. Then a video is `in_review`: a person at Yuvoy looks
        before anybody else sees it. A photo is `private`: kept for its owner
        alone, with `photoUrl`. Safe to call again. A session only. Never
        cached.


        For an organiser's picture it asks the image host, and only the
        member who started it may call it (anybody else gets `404`). A file
        not yet sent is `409 not_arrived`; a slot the host no longer has is
        `404`. A file that is not the one this start made is `409
        media_refused` and the upload is `failed`, as for a refused video.
        Then the picture is `in_review`.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: "`in_review` for a video or a picture, `private` for a photo.", content: { application/json: { schema: { $ref: "#/components/schemas/CreatorUpload" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `not_arrived`: send the whole file, then call again.
            `media_refused`: Yuvoy will never show this file;
            `details.reason` says why: for a photo, `not_a_photo` when its
            bytes or size are not what was started, or `incomplete` when it
            was not sent in time. Choose another file.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`photos_unavailable` or `media_unavailable`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/creator-links:
    get:
      tags: [me]
      summary: My share links and what came through them
      operationId: listMyCreatorLinks
      description: >-
        The caller's links to things they went on, newest first, with the
        opens and the bookings that came through each. The counts are
        indicative: no amount, no name and no date of another person's trip,
        and Yuvoy does not pay for links. A session only: a recovery link is
        `401`. Outside the creator release (`releases.creator` in
        `getAppConfig`) it is `404`. Never cached.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: Mine.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CreatorLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [me]
      summary: Get my share link for something I went on
      operationId: getMyCreatorLink
      description: >-
        Returns your link for this listing or card, making it the first time
        (`201`); one per person per listing or card, so asking again is `200`
        with the same link. Only somebody who went, once it is over, gets
        one. Twenty links made a day, then `429 rate_limited`; a link you
        already have is never counted. Pausing new videos does not stop
        links. A session only. Never cached.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                experienceId: { type: string, format: uuid, description: Exactly one of experienceId and eventId. }
                eventId: { type: string, format: uuid, description: Exactly one of experienceId and eventId. }
      responses:
        "200": { description: Already yours., content: { application/json: { schema: { $ref: "#/components/schemas/CreatorLink" } } } }
        "201": { description: Made., content: { application/json: { schema: { $ref: "#/components/schemas/CreatorLink" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            `not_went`: the caller did not go on it, or their trip is still to
            come. `not_open_yet`: a card whose event has not ended.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /videos/{id}/reports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [me]
      summary: Tell Yuvoy a video is wrong
      operationId: reportVideo
      description: >-
        Hidden for the reporter at once, and a person at Yuvoy looks. A second
        person reporting the same video within 7 days takes it down until
        they have. Ten reports a day per traveller, then `429 rate_limited`.
        A video the caller cannot see is `404`. A session only. Never cached.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, enum: [not_from_this_trip, shows_something_unsafe, people_did_not_agree, offensive, other] }
                note: { type: string, maxLength: 300 }
      responses:
        "204": { description: Hidden for you now; a person looks. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/people:
    get:
      tags: [people]
      summary: The People home
      operationId: getMyPeople
      description: >-
        Whether the signed-in traveller may use People, what they share, their requests and their friend
        link. Answers 200 for an unconfirmed age or a missing name, so the app can show the right step
        (`ageConfirmed` false: R4's age step and `confirmMyAge`; `needsName` true: ask for a first name with
        `updateMyAccount`). A session only: a recovery link answers 401. 404 while the `people` release is
        closed to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: The People home., content: { application/json: { schema: { $ref: "#/components/schemas/PeopleHome" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [people]
      summary: Choose what friends see, and whether requests are emailed
      operationId: updateMyPeople
      description: >-
        The first step answers `sharing`; the first answer sets when People was started. `sharing: only_me`
        hides everything already shared without changing each item. `shareUpcomingGoing: true`, when
        sharing is friends once the call is saved (sent now or chosen before), also opens to friends the caller's upcoming goings that are only me (the ones
        made before People, counted in `privateUpcomingGoing`); false or absent leaves them as they are.
        Choosing `sharing` needs a confirmed adult and a first name; `requestEmails` alone needs neither. A
        session only. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                sharing: { type: string, enum: [friends, only_me] }
                shareUpcomingGoing: { type: boolean, description: "When sharing is friends after this call, open the upcoming goings that are only me to friends. Not stored." }
                requestEmails: { type: boolean, description: Whether a friend request is also told by email. At most one email a day. }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/PeopleHome" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdultsOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`name_required`: add a first name first.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /me/friends:
    get:
      tags: [people]
      summary: The caller's friends, newest first
      operationId: listMyFriends
      description: >-
        Only the caller sees their own friends list. Pass `nextCursor` back unchanged for the next page. A
        session only. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: A page of friends. `nextCursor` null is the end.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [friends, nextCursor]
                properties:
                  friends: { type: array, items: { $ref: "#/components/schemas/Friend" } }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PeoplePaused" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/friends/{personId}:
    delete:
      tags: [people]
      summary: Stop being friends
      operationId: removeFriend
      description: >-
        Nobody is told. 204 also when the two were not friends. Anyone signed in may end a friendship, so
        neither the age answer nor a name is needed. A session only. 404 while the `people` release is
        closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: personId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Not friends. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/friends-going:
    get:
      tags: [people]
      summary: Which friends are going to these events
      operationId: listFriendsGoing
      description: >-
        For the cards on screen. Only friends who chose to share and whose going is not only me, and only
        live, upcoming events. An event with nobody visible is left out, so an empty list is the common
        answer. `total` is how many the caller could see by name; `friends` holds up to 20, most recent
        first. A session only. While the `people` release is closed to the caller this answers 200 with an
        empty `events` list, never 404, so cards render the same either way.
      security: [{ travellerSession: [] }]
      parameters:
        - name: eventIds
          in: query
          required: true
          style: form
          explode: false
          description: Up to 50 event ids, comma separated.
          schema: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Friends going, per event.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [eventId, friends, total]
                      properties:
                        eventId: { type: string, format: uuid }
                        friends: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/PersonRef" } }
                        total: { type: integer, minimum: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/friends/activity:
    get:
      tags: [people]
      summary: What friends are up to
      operationId: listFriendActivity
      description: >-
        Goings for the next 30 days and went answers from the last 30, from friends who share, and only
        those whose visibility is friends; never saves, plans or bookings (REQ-R9-06), and never a rating.
        Newest first by when it happens or happened. Pass `nextCursor` back unchanged for the next page. A
        session only. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: A page of activity. `nextCursor` null is the end.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FriendActivity" } }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required` or `people_paused`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/friend-requests:
    post:
      tags: [people]
      summary: Ask somebody to be friends
      operationId: requestFriend
      description: >-
        By the other person's friend link (`via: friend_link` with `code`), from a plan both are on
        (`via: plan` with `planId` and the other person's `memberId` from the plan's `people`), or from a
        table both belong to (`via: table` with `tableId` and `personId`; this answers 404 until tables can
        name their people). With `via: plan`, both must be active signed-in members of the plan and the
        member is not the caller; anything else answers 404, the same as a plan that does not exist, and
        `personId` is a 400. Answers 202 `requested` even when a declined request, an open request, a link
        switched off, a code nobody holds, or an owner People cannot show means nothing is sent, so the
        answer never tells what the other person did and a guessed code learns nothing; `person` is absent
        then. Only a link past its date (410) or its requests (409) answers otherwise, as the lookup shows
        those too. A request crossing one the other way, or asking back somebody whose request the caller
        declined, answers `friends`. 30 a day per caller, counted before the code is read. A session only.
        404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [via]
              properties:
                via: { type: string, enum: [friend_link, plan, table] }
                code: { type: string, maxLength: 16, description: "The friend link code, any case, hyphen optional. With via friend_link." }
                planId: { type: string, format: uuid, description: With via plan. }
                memberId: { type: string, format: uuid, description: "With via plan: the other person's PlanPerson.memberId." }
                tableId: { type: string, format: uuid, description: With via table. }
                personId: { type: string, format: uuid, description: With via table only. }
      responses:
        "202":
          description: Asked, or already friends.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [state]
                properties:
                  state: { type: string, enum: [requested, friends] }
                  person: { $ref: "#/components/schemas/PersonRef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required` or `people_paused`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`friend_limit_reached`, `friend_link_full` or `name_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "410": { description: "`friend_link_expired`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/friend-requests/{requestId}/answer:
    post:
      tags: [people]
      summary: Say yes or no to a request
      operationId: answerFriendRequest
      description: >-
        A no is never shown to the person who asked. A yes needs a confirmed adult and a first name; a no
        needs neither. A session only. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [answer], properties: { answer: { type: string, enum: [accept, decline] } } } } }
      responses:
        "200": { description: Answered., content: { application/json: { schema: { type: object, additionalProperties: false, required: [state], properties: { state: { type: string, enum: [friends, declined] }, friend: { $ref: "#/components/schemas/Friend" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required` or `people_paused`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not a request waiting for the caller., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`friend_limit_reached` or `name_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /me/friend-requests/{requestId}:
    delete:
      tags: [people]
      summary: Take back a request the caller sent
      operationId: withdrawFriendRequest
      description: Nobody is told. A session only. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: "Withdrawn, or nothing to withdraw." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/friend-link:
    put:
      tags: [people]
      summary: The caller's friend link, made if there is none
      operationId: putMyFriendLink
      description: >-
        `rotate: true` switches the current link off and makes a new one. An expired or full link is
        replaced in the same call without `rotate`, so it never holds the owner's one live slot. 30 days, 20
        requests. Needs a confirmed adult and a first name. A session only. 404 while the `people` release
        is closed to the caller.
      security: [{ travellerSession: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { rotate: { type: boolean } } } } }
      responses:
        "200": { description: The live link., content: { application/json: { schema: { $ref: "#/components/schemas/FriendLink" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required` or `people_paused`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`name_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [people]
      summary: Switch the friend link off
      operationId: deleteMyFriendLink
      description: A session only. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "204": { description: "Off. Opening it now answers `unavailable`." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /friend-links/lookup:
    post:
      tags: [people]
      summary: Whose friend link this is
      operationId: lookupFriendLink
      description: >-
        For the page a link opens. A session only: signed out it is the same 401 whatever the code, before
        the code is read. The code is in the body so it is never in a logged path. `owner` and `relation`
        only with `state: ok`. `unavailable` covers an unknown code, a link switched off and an owner who
        cannot use People. 30 a minute per session, and 120 a minute on a shared address. Never stored by a
        cache. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, maxLength: 16 } } } } }
      responses:
        "200":
          description: The link's state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [state]
                properties:
                  state: { type: string, enum: [ok, expired, full, unavailable] }
                  owner: { $ref: "#/components/schemas/PersonRef" }
                  relation: { type: string, enum: [self, none, requested, request_in, friends] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /people/{personId}:
    get:
      tags: [people]
      summary: Another traveller, as the caller may see them
      operationId: getPerson
      description: >-
        A friend sees `name` and `since`; somebody with a request either way sees `shortName` and, on an
        incoming request, `mutualFriends`. Anyone else answers 404, so an id alone shows nothing. Whoever
        sees the person also sees their published videos in `videos`, the newest 12, as a listing shows
        them: a video the caller reported is left out, and one its business took off the listing stays.
        `videos` is empty while the `creator` release is closed to the caller. A session only. 404 while
        the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: personId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The person., content: { application/json: { schema: { $ref: "#/components/schemas/PersonCard" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdultsOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/crews:
    get:
      tags: [people]
      summary: The caller's crews, newest first
      operationId: listMyCrews
      description: >-
        A crew is a named list of the caller's friends, for asking them along in one tap. Only the caller
        sees their crews, and members are never told they are in one. At most 20 crews, so the list is not
        paged. A session only. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: The crews., content: { application/json: { schema: { $ref: "#/components/schemas/CrewList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [people]
      summary: Save a crew
      operationId: createCrew
      description: >-
        Every member must be the caller's friend now. 20 crews per person and 50 members per crew. Members
        are not told. Needs a confirmed adult and a first name, and People not restricted or ended for the
        caller (`people_paused`). A session only. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CrewInput" } } } }
      responses:
        "201": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/Crew" } } } }
        "400": { description: "`invalid_input` with `details.name` or `details.memberIds`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required`, or `people_paused` with `details.standing` and `details.until`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`crew_limit_reached` (20 crews already), `not_friends` with `details.personIds` (members who are not the caller's friends now), or `name_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /me/crews/{crewId}:
    patch:
      tags: [people]
      summary: Rename a crew or replace its members
      operationId: updateCrew
      description: >-
        Send what changes. `memberIds` replaces every member the caller can see now, and each must be the
        caller's friend now. A member People cannot show at the time (restricted or hidden) stays in the crew
        and is listed again once they can be shown. The same gates as `createCrew`. 404 for a crew that is not the caller's, and while the `people` release
        is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: crewId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CrewPatch" } } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/Crew" } } } }
        "400": { description: "`invalid_input` with `details.name` or `details.memberIds`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required`, or `people_paused` with `details.standing` and `details.until`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`not_friends` with `details.personIds`, or `name_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [people]
      summary: Delete a crew
      operationId: deleteCrew
      description: >-
        Nobody is told. 204 also for a crew that is not the caller's or is gone, which is left as it is. A
        session only. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: crewId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: "Deleted, or nothing of the caller's to delete." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /plans/{planId}/crew-invites:
    post:
      tags: [people, plans]
      summary: Invite a crew to a plan (planner)
      operationId: inviteCrewToPlan
      description: >-
        Adds each member who is still the caller's friend as a guest, the way a planner adds signed-in
        travellers, not through the guest reply, so each gets the plan as any invited guest does.
        `skipped` counts members left out: no longer a friend, blocked either way, not shown in People
        now, already on the plan, with no first name to show, or past the guest cap. `invited` and
        `skipped` add up to the crew's members. Needs a confirmed adult and a first name, and People not
        restricted or ended for the caller (`people_paused`). A session only. 404 while the `people` or the `plans` release is closed to
        the caller, and 503 `plans_unavailable` while plans are paused.
      security: [{ travellerSession: [] }]
      parameters: [{ name: planId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [crewId], properties: { crewId: { type: string, format: uuid } } } } } }
      responses:
        "200": { description: Invited., content: { application/json: { schema: { type: object, additionalProperties: false, required: [invited, skipped], properties: { invited: { type: integer, minimum: 0 }, skipped: { type: integer, minimum: 0 } } } } } }
        "400": { description: "`invalid_input` with `details.crewId`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required`, or `people_paused` with `details.standing` and `details.until`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "Not a plan the caller made, or not their crew.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`plan_closed` with `details.reason`, or `name_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /clubs:
    get:
      tags: [people]
      summary: The groups directory for a place
      operationId: listClubs
      description: >-
        Groups that meet in a place, by name. Public, and only while the `people` release is `all`: 404
        otherwise, when staff and early travellers read `listMyClubs`. Never stored by a cache, not even at
        the edge, so a group hidden on request leaves the list at once. Never says who follows a group.
        `onYuvoy` is false for a group that has not claimed its listing. 400 with `details.destinationKey`
        for a place Yuvoy does not have.
      security: []
      parameters: [{ name: destinationKey, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: Groups by name., content: { application/json: { schema: { $ref: "#/components/schemas/ClubList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /clubs/{slug}:
    get:
      tags: [people]
      summary: One group
      operationId: getClub
      description: >-
        Public. 404 for an unknown, removed, hidden or hidden-on-request group, and while the `people`
        release is not `all` (staff and early travellers read `getMyClub`). Never stored by a cache, not even
        at the edge. The `{slug}` position also takes the group's `clubId`, which `listMyClubFollows` and the
        `club_joined` push carry; the same 404s hold either way, so an id finds nothing its slug would not.
      security: []
      parameters: [{ name: slug, in: path, required: true, description: "The group's slug, or its clubId.", schema: { type: string } }]
      responses:
        "200": { description: The group., content: { application/json: { schema: { $ref: "#/components/schemas/Club" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/clubs:
    get:
      tags: [people]
      summary: The groups directory for a place, as the caller's release stage allows
      operationId: listMyClubs
      description: >-
        The same answer as `listClubs`, for a session or a recovery link while the `people` release is
        `staff` or `early`; it answers at `all` too. A recovery link reads as nobody in a group, so it sees
        the directory only at `all`. 404 while the release is closed to the caller.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      parameters: [{ name: destinationKey, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: Groups by name., content: { application/json: { schema: { $ref: "#/components/schemas/ClubList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/clubs/{slug}:
    get:
      tags: [people]
      summary: One group, as the caller's release stage allows
      operationId: getMyClub
      description: >-
        The same answer as `getClub`. 404 for an unknown, removed, hidden or hidden-on-request group, and
        while the `people` release is closed to the caller. Like `getClub`, it takes the group's `clubId` in
        the `{slug}` position.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      parameters: [{ name: slug, in: path, required: true, description: "The group's slug, or its clubId.", schema: { type: string } }]
      responses:
        "200": { description: The group., content: { application/json: { schema: { $ref: "#/components/schemas/Club" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /clubs/{clubId}/claims:
    post:
      tags: [people]
      summary: Say you run this group
      operationId: claimClub
      description: >-
        A person at Yuvoy checks the claim against the group's own public contact before approving it, and
        the claimant hears by email. One waiting claim per person per group, and 3 claims a day per person.
        Needs a confirmed adult and a first name, and People not restricted or ended for the caller
        (`people_paused`). A session only. 404 for a group that is not shown, and while the `people`
        release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: clubId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClubClaimInput" } } } }
      responses:
        "202": { description: Received. A person decides., content: { application/json: { schema: { $ref: "#/components/schemas/ClubClaimReceipt" } } } }
        "400": { description: "`invalid_input` with `details.roleText`, `details.contactEmail`, `details.proofUrl` or `details.note`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required`, or `people_paused` with `details.standing` and `details.until`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict` with `details.reason` `claim_waiting` (the caller's claim is already waiting) or `already_claimed` (the group has claimed its listing), or `name_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /clubs/{clubId}/removal-requests:
    post:
      tags: [people]
      summary: Ask for a listing to be taken down
      operationId: requestClubRemoval
      description: >-
        Public, no account needed. With `we_run_it_and_want_off` the listing is hidden at once (state
        `hidden_on_request`) and a person at Yuvoy removes it or puts it back; a request nobody has checked
        never removes a listing by itself. Other reasons wait for a person. 3 requests a day per group, so
        one caller cannot use up every group's requests, and 20 a day per client address. Sends no email,
        because an address nobody proved would let anyone make Yuvoy write to anybody. Never stored by a
        cache. 404 for a group that is not shown, and while the `people` release is closed to the caller;
        signed out, that is until it reaches `all`.
      security: [{}, { travellerSession: [] }]
      parameters: [{ name: clubId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClubRemovalRequest" } } } }
      responses:
        "202": { description: "Hidden now, or waiting for a person.", content: { application/json: { schema: { $ref: "#/components/schemas/ClubRemovalReceipt" } } } }
        "400": { description: "`invalid_input` with `details.reason` or `details.note`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /clubs/{clubId}/reports:
    post:
      tags: [people]
      summary: Something is wrong with this listing
      operationId: reportClub
      description: >-
        Reaches Yuvoy's support queue; the listing stays as it is until a person looks. 5 reports a day per
        person. A session only. 404 for a group that is not shown, and while the `people` release is closed
        to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: clubId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClubReport" } } } }
      responses:
        "202": { description: Received., content: { application/json: { schema: { $ref: "#/components/schemas/ClubReportReceipt" } } } }
        "400": { description: "`invalid_input` with `details.reason`, or `details.note` (required for `other`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/blocks:
    get:
      tags: [people]
      summary: People the caller has blocked
      operationId: listMyBlocks
      description: >-
        Newest first, at most 500, so there is no next page. A session only. 404 while the `people` release
        is closed to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: The people blocked., content: { application/json: { schema: { $ref: "#/components/schemas/BlockList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/blocks/{personId}:
    put:
      tags: [people]
      summary: Block a person
      operationId: blockPerson
      description: >-
        Hides the two from each other everywhere and ends their friendship, their requests and their places
        in each other's crews. The blocked person is never told. 204 also when the person is already
        blocked. The caller's own id is a 400 and an id that is nobody is a 404. Not gated on age or
        standing: anyone signed in may block. 500 blocks at most: one more answers 409 `conflict` with
        `details.reason` `block_limit`. A session only. 404 while the `people` release is closed to the
        caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: personId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Blocked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict` with `details.reason` `block_limit`: 500 blocks is the most.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [people]
      summary: Unblock a person
      operationId: unblockPerson
      description: >-
        Nothing that the block ended comes back. 204 also when the person was not blocked. A session only.
        404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: personId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: "Unblocked, or was not blocked." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /people/{personId}/reports:
    post:
      tags: [people]
      summary: Report a person to the Yuvoy team
      operationId: reportPerson
      description: >-
        One open report per reporter and person: a repeat answers 202 with the open one's `reportId`. The
        person is never told who reported them. `alsoBlock` blocks the person in the same request. 5 reports
        a day per reporter. Needs a confirmed adult. A session only. 404 while the `people` release is
        closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: personId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PersonReport" } } }
      responses:
        "202": { description: Received., content: { application/json: { schema: { $ref: "#/components/schemas/PersonReportReceipt" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdultsOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/life-list:
    get:
      tags: [me]
      summary: The caller's life list, newest first
      operationId: getMyLifeList
      description: >-
        Every entry is read from a record (bookings that ran, went answers, plans marked done, table
        check-ins) with its proof. The first page also carries `didYouGo`: goings on events that ended in
        the last 30 days with no answer, to ask with `answerDidYouGo`; it is empty while the `going`
        release is closed to the caller. `counts` are over the whole list. Later pages carry an empty
        `didYouGo` and zero counts. Pass `nextCursor` back unchanged for the next page. A session only.
        404 while the `me` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: A page of entries. `nextCursor` null is the end.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entries, didYouGo, counts, nextCursor]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/LifeEntry" } }
                  didYouGo:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [eventId, title, startsAt]
                      properties:
                        eventId: { type: string, format: uuid }
                        title: { type: string }
                        startsAt: { type: string, format: date-time }
                  counts:
                    type: object
                    additionalProperties: false
                    required: [done, checked]
                    properties:
                      done: { type: integer, minimum: 0, description: Every entry. }
                      checked: { type: integer, minimum: 0, description: The entries with a checked record. }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/life-list/{entryId}:
    patch:
      tags: [me]
      summary: Who may see one entry
      operationId: updateMyLifeEntry
      description: >-
        Trips and tables only. A went entry's visibility is written by `updateMyWentVisibility`
        (`PATCH /v1/me/went/{eventId}`), the one route that writes it, so a went entry here answers 409
        `conflict` with `details.use` naming that route; a plan is always only me (409 `conflict`). Friends
        see an entry only when the caller's People sharing is friends too. 404 for an entry the caller has
        not got. A session only. 404 while the `me` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: entryId, in: path, required: true, schema: { type: string, pattern: '^(trip|went|plan|table):[0-9a-f-]{36}$' } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [visibility]
              properties:
                visibility: { $ref: "#/components/schemas/ItemVisibility" }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/LifeEntry" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdultsOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `conflict`: a plan is always only me, and a went entry is changed on its own route, named in
            `details.use` (for example "/v1/me/went/{eventId}"). `name_required` when the caller has no
            name People can show.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/badges:
    get:
      tags: [me]
      summary: Badges earned and in progress
      operationId: getMyBadges
      description: >-
        Evaluates the caller's rules first, so a badge shows as soon as its record exists. `earned` are
        the badges the caller holds now; `inProgress` is every special not earned yet and every season not
        earned whose last day has not passed. `seen` false marks a badge the app has not shown yet; mark
        it with `markBadgesSeen`. A session only. 404 while the `me` release is closed to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: Badges.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [earned, inProgress]
                properties:
                  earned: { type: array, items: { $ref: "#/components/schemas/Badge" } }
                  inProgress: { type: array, items: { $ref: "#/components/schemas/BadgeProgress" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/badges/seen:
    post:
      tags: [me]
      summary: Mark new badges as shown
      operationId: markBadgesSeen
      description: >-
        Sets `seen` on the caller's earned badges named in `keys`. A key the caller has not earned is
        ignored. A session only. 404 while the `me` release is closed to the caller.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [keys]
              properties:
                keys: { type: array, minItems: 1, maxItems: 20, items: { type: string, pattern: '^[a-z][a-z0-9_]{2,40}$' } }
      responses:
        "204": { description: Marked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /people/{personId}/life-list:
    get:
      tags: [me, people]
      summary: A friend's life list, as they chose to share it
      operationId: getPersonLifeList
      description: >-
        Checked entries only, under People's rules (two-way friends, no block, sharing with friends, the
        entry not only me), newest first. A went entry whose event is hidden is left out. Never a rating,
        and never who else cheered. Anyone else answers 404, so an id alone shows nothing. Pass
        `nextCursor` back unchanged for the next page. A session only. 404 while the `me` or the `people`
        release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: The shared life list. `nextCursor` null is the end.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entries, badges, checkedCount, nextCursor]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/LifeEntry" } }
                  badges:
                    type: array
                    description: >-
                      Badges computed over the same entries, so none reveals a hidden one. Seasons here
                      are evaluated as the entries stand now.
                    items: { $ref: "#/components/schemas/FriendBadge" }
                  checkedCount: { type: integer, minimum: 0, description: "Every entry the caller may see here, on all pages." }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required` or `people_paused`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /people/{personId}/life-list/{entryId}/cheer:
    put:
      tags: [me, people]
      summary: Cheer a friend's entry
      operationId: cheerLifeEntry
      description: >-
        One cheer per person and entry; a repeat answers 204 and changes nothing. Only an entry the caller
        may see on `getPersonLifeList`; anything else answers 404. A session only. 404 while the `me` or
        the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entryId, in: path, required: true, schema: { type: string, pattern: '^(trip|went|table):[0-9a-f-]{36}$' } }
      responses:
        "204": { description: Cheered. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required` or `people_paused`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`not_found`: the caller cannot see this entry.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`name_required`: the caller has no name People can show.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [me, people]
      summary: Take a cheer back
      operationId: uncheerLifeEntry
      description: >-
        204 also when there was no cheer, or the entry is gone. A session only. 404 while the `me` or the
        `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entryId, in: path, required: true, schema: { type: string, pattern: '^(trip|went|table):[0-9a-f-]{36}$' } }
      responses:
        "204": { description: "Removed, or there was none." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/club-follows:
    get:
      tags: [people]
      summary: The groups the caller follows
      operationId: listMyClubFollows
      description: >-
        The groups the caller follows that the directory shows, newest follow first: `clubIds`, and in
        `clubs` the same groups in the same order with the slug and name to list and open each one.
        Private: nobody else sees who follows a group or how many. A session only. 404 while the `people`
        release is closed to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: The followed groups.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clubIds, clubs]
                properties:
                  clubIds: { type: array, items: { type: string, format: uuid } }
                  clubs:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [clubId, slug, name]
                      properties:
                        clubId: { type: string, format: uuid }
                        slug: { type: string }
                        name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/club-follows/{clubId}:
    put:
      tags: [people]
      summary: Follow a group
      operationId: followClub
      description: >-
        Private. The caller is told once when the group joins Yuvoy. 200 follows per person. Following a
        group twice is 204 too. Needs a confirmed adult and a first name, and People not restricted or
        ended for the caller (`people_paused`). A session only. 404 for a group
        that is not shown, and while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: clubId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Following. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`adult_confirmation_required`, or `people_paused` with `details.standing` and `details.until`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`follow_limit_reached` (200 groups followed already), or `name_required`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [people]
      summary: Stop following
      operationId: unfollowClub
      description: >-
        204 also for a group the caller does not follow, and for one taken out of the directory. A session
        only. 404 while the `people` release is closed to the caller.
      security: [{ travellerSession: [] }]
      parameters: [{ name: clubId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Not following. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /trigo/turns:
    post:
      tags: [trigo]
      operationId: createTrigoTurn
      summary: Ask Trigo one thing and get its answer
      description: >-
        One synchronous turn, never streamed. The message is stored, Trigo
        answers within about 20 seconds, and both come back. A retry with the
        same Idempotency-Key returns the stored turn with `Idempotent-Replay:
        true`; the same key with other text is 409 idempotency_key_reuse, and
        while the first is still running 409 idempotency_in_progress (read
        getTrigoConversation then). Another turn while one of this traveller's
        turns runs is 409 turn_in_progress. A session only: a recovery link
        answers 401 "Sign in to ask Trigo.". Not released to this traveller
        (releases.trigo): 404 not_found.
      security: [{ travellerSession: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated, 16-128 chars of `A-Za-z0-9_.:-`, one per message typed.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrigoTurnInput" }
      responses:
        "200":
          description: The turn and the answer, or the stored turn on a replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrigoTurnResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            `adult_confirmation_required`: show "Add your birth year to use
            Trigo." with a button to confirmMyAge, and send the turn again after
            its 200.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `consent_required` (details.noticeVersion is the notice to show),
            `idempotency_key_reuse`, `idempotency_in_progress` or
            `turn_in_progress`. Nothing new was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >-
            `daily_limit_reached`: 20 answers today; details.resetsAt is the
            next midnight in India and nothing was stored. Or `rate_limited`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trigo/conversations:
    get:
      tags: [trigo]
      operationId: listTrigoConversations
      summary: The traveller's Trigo chats, newest first (at most 20)
      description: Not gated by the release. A session only. Private to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: Chats
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [conversations]
                properties:
                  conversations: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/TrigoConversation" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trigo/conversations/{id}:
    get:
      tags: [trigo]
      operationId: getTrigoConversation
      summary: Messages after a cursor for polling, or before one for reading back
      description: >-
        Not gated by the release. Another traveller's chat answers 404, the
        same as one that does not exist. A session only. With neither cursor
        the page is the newest 50; `after` polls for newer lines and `before`
        reads back the 50 lines before a seq, oldest first. `hasOlder` says
        whether lines older than the page's first remain. Sending `after` and
        `before` together is 400 invalid_input with details.before.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, description: "A seq; only messages after it. 0 or absent is the newest 50.", schema: { type: integer, format: int64, minimum: 0 } }
        - { name: before, in: query, description: "A seq; the newest 50 messages before it, oldest first. Not with after.", schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrigoConversationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /trigo/conversations/{id}/read:
    post:
      tags: [trigo]
      operationId: markTrigoConversationRead
      summary: Mark the chat read up to a message
      description: Not gated by the release. A session only.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seq]
              properties:
                seq: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Marked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /trigo/conversations/{id}/handoff:
    post:
      tags: [trigo]
      operationId: requestTrigoHandoff
      summary: Talk to a person from the Yuvoy team in this chat
      description: >-
        The "Talk to a person" button, and "Ask the team" under a reply. It
        raises the chat's hand-off to the Yuvoy team and writes one system
        line saying when they will reply. Pressed again while the hand-off is
        open, it writes no second line and answers the one already there. It
        makes no model call and does not count toward the 20 a day, and
        neither the consent, the age check nor Trigo being paused stops it. A
        session only: a recovery link answers 401. Not released to this
        traveller (releases.trigo): 404 not_found. Another traveller's chat,
        or a messageId that is not in this chat, is 404. An ended chat is
        409 conflict "This chat has ended. Start a new one to ask the team."
        Private to the caller.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                messageId: { type: [string, "null"], format: uuid, description: "The message the traveller asked from, when they asked from one." }
      responses:
        "200":
          description: The system line and the team's place in the chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrigoHandoff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: the chat has ended. Start a new chat to ask the team."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trigo/messages/{id}/report:
    post:
      tags: [trigo]
      operationId: reportTrigoAnswer
      summary: Report one of Trigo's answers
      description: >-
        The traveller says an answer Trigo gave was wrong, unhelpful, unsafe or
        offensive. The answer is marked and the Yuvoy team gets one report to
        read; unsafe_advice reaches them first. The report holds the chat, the
        answer and the reason, never the words. Reported again, nothing
        changes: still 204, and the first reason stands. There is no note
        field. A session only: a recovery link answers 401. Not released to
        this traveller (releases.trigo): 404 not_found. Another traveller's
        message, or a line Trigo did not write, is 404, the same as a message
        that does not exist.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, enum: [wrong_information, not_helpful, unsafe_advice, offensive, other] }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trigo/consent:
    get:
      tags: [trigo]
      operationId: getTrigoConsent
      summary: Whether the traveller accepted the Trigo notice in force, and its words
      description: >-
        `accepted` is true only when the latest choice is granted on the
        current noticeVersion. noticeText is the notice to show, word for word.
        Not gated by the release. A session only.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: Consent state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrigoConsent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [trigo]
      operationId: acceptTrigoConsent
      summary: Accept the Trigo notice the person was shown
      description: >-
        noticeVersion must be the current one, else 400 invalid_input with
        details.noticeVersion naming it; surface is where the person chose.
        Each acceptance is kept as evidence; the same choice on the same notice
        sent again is not a new one. Not released to this traveller: 404
        not_found. A session only.
      security: [{ travellerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [noticeVersion, surface]
              properties:
                noticeVersion: { type: string, maxLength: 40, example: "2026-11-r5" }
                surface: { type: string, enum: [web, ios, android] }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [trigo]
      operationId: withdrawTrigoConsent
      summary: Withdraw consent
      description: >-
        Kept as evidence, with the surface the person withdrew on. Turns answer
        409 consent_required until the notice is accepted again. A missing or
        unknown surface is 400 invalid_input with details.surface. Not gated by
        the release. A session only.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: surface, in: query, required: true, description: "Where the person withdrew.", schema: { type: string, enum: [web, ios, android] } }
      responses:
        "204": { description: Withdrawn }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trigo/actions/{id}/confirm:
    post:
      tags: [trigo]
      operationId: confirmTrigoAction
      summary: Confirm a Trigo card
      description: >-
        Re-reads the card's facts the way Trigo read them to make it. A book
        card answers the checkout to open with the card's own idempotencyKey;
        nothing is booked until the traveller finishes that checkout. A
        date-alert or trip-draft card writes its alert or draft and answers
        its id. Idempotent: a second confirm returns the first answer while it
        still holds. 409 action_changed with details.reason (sold_out,
        price_moved, time_moved, not_bookable, booking_changed) when the facts
        moved since the card, or action_expired when the card expired, was
        declined or replaced, or its checkout lapsed: ask Trigo again. 409
        date_alerts_full for a date-alert card when the traveller already has
        50 alerts waiting: stop one to add another. A
        session only: a recovery link answers 401. Not released to this
        traveller (releases.trigoActions): 404 not_found. Another traveller's
        card is 404, the same as one that does not exist. 503 unavailable
        while feature:trigo_actions is engaged. Private to the caller.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: What the app does next
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrigoActionConfirmation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`action_changed` (details.reason), `action_expired`, or `date_alerts_full` (50 date alerts waiting already)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trigo/actions/{id}/decline:
    post:
      tags: [trigo]
      operationId: declineTrigoAction
      summary: Say no to a Trigo card
      description: >-
        Writes nothing but the card's state and Trigo's line "No problem.
        Nothing has been booked or changed." in the chat. The line costs no
        turn and does not count toward the 20 a day. Idempotent: declined
        again, it answers the same line. Not gated by the release or by
        feature:trigo_actions. A card already confirmed, used or replaced is
        409 action_expired. A session only: a recovery link answers 401.
        Another traveller's card is 404. Private to the caller.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: "#/components/schemas/TrigoMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`action_expired`: the card was confirmed, used or replaced."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/date-alerts:
    get:
      tags: [trigo]
      operationId: listMyDateAlerts
      summary: The listings Trigo will tell the traveller about once they get a date
      description: >-
        The alerts the traveller saved from a Trigo date-alert card: every
        alert still waiting (a traveller has at most 50 waiting; a card for a
        51st is refused, and its confirm answers 409 date_alerts_full), and
        the 50 that most recently told them (notifiedAt set), until those are
        removed 30 days after they told them. At most 100, newest first by
        createdAt. A stopped alert is not listed, nor one that expired after
        180 days without a date. Each card is read from our records now: available is
        false once the listing is no longer shown. Not gated by
        releases.trigoActions or feature:trigo_actions. A session only: a
        recovery link answers 401. Private to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: The alerts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [alerts]
                properties:
                  alerts: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/TrigoDateAlert" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/date-alerts/{id}:
    delete:
      tags: [trigo]
      operationId: stopMyDateAlert
      summary: Stop a date alert
      description: >-
        "Stop telling me": a waiting alert is stopped and leaves the list. An
        alert that already told the traveller has nothing left to send: 204,
        and it stays as it is. Another traveller's alert, one already stopped
        and one that does not exist are 404. Not gated by
        releases.trigoActions or feature:trigo_actions. A session only: a
        recovery link answers 401.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Stopped }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/trip-drafts:
    get:
      tags: [trigo]
      operationId: listMyTripDrafts
      summary: The trip drafts the traveller saved from Trigo, newest first (at most 20)
      description: >-
        Each draft is a day-by-day list of our own cards, read from our
        records now: available is false once a listing or event is no longer
        shown. A draft is removed 30 days after its last day. Not gated by
        releases.trigoActions or feature:trigo_actions. A session only: a
        recovery link answers 401. Private to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: The drafts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [drafts]
                properties:
                  drafts: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/TrigoTripDraft" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/trip-drafts/{id}:
    delete:
      tags: [trigo]
      operationId: deleteMyTripDraft
      summary: Delete a trip draft
      description: >-
        "Delete draft" deletes it; there is no deleted state to read back.
        Another traveller's draft and one that does not exist are 404. Not
        gated by releases.trigoActions or feature:trigo_actions. A session
        only: a recovery link answers 401.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/trigo/memory:
    get:
      tags: [trigo]
      operationId: getTrigoMemory
      summary: What Trigo reads about the traveller
      description: >-
        The trips, goings and favourite departments Trigo reads when it
        answers, less what the traveller hid and what they cleared. A booking
        is a reservation id, a going a found item id and a department a
        Category key. Saves can be hidden but are never listed. items is
        empty, never null, when there is nothing. Not gated by the release. A
        session only: a recovery link answers 401. Private to the caller.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: What Trigo reads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrigoMemory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/trigo/memory/{subjectType}/{subjectId}:
    delete:
      tags: [trigo]
      operationId: hideTrigoMemoryItem
      summary: Stop Trigo reading one thing
      description: >-
        Trigo stops reading this booking, going, save or department in its
        answers. Hiding never cancels or deletes the booking, the going or the
        save itself. Hidden again, still 204. Another traveller's subject, a
        department that is not in the traveller's interests, a subjectType
        outside the enum and a subjectId over 80 characters are all 404
        not_found, the same as a subject that does not exist. Not gated by
        the release. A session only: a recovery link answers 401. The next
        answer also reads none of the chat written before the hide, since an
        earlier answer may name what was hidden.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: subjectType, in: path, required: true, schema: { type: string, enum: [booking, going, save, department] } }
        - { name: subjectId, in: path, required: true, description: "A reservation id, a found item id, a saved experience id or a Category key.", schema: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        "204": { description: Hidden }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`not_found`: not one of this traveller's items."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/trigo/memory/clear:
    post:
      tags: [trigo]
      operationId: clearTrigoMemory
      summary: Stop Trigo reading everything it reads now
      description: >-
        Clear all: Trigo ignores the bookings, goings and saves made before
        now, and every department listed now. Nothing is cancelled or
        deleted. The next answer also reads none of the chat written before
        now. GET then answers clearedAt as this time. Not gated by the
        release. A session only: a recovery link answers 401.
      security: [{ travellerSession: [] }]
      responses:
        "204": { description: Cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/stay:
    put:
      tags: [me]
      summary: Keep the days I am on the island
      operationId: setMyStay
      description: >-
        Keeps the traveller's stay on the account, for the day plan on Trips,
        so a new phone, a cleared browser and the other phone of a couple see
        the same dates. Replaces any stay already kept. `getMyAccount` reads it
        back as `stay`.


        Dates are days in the market's own calendar (Asia/Kolkata), like a
        departure's `localDate`, as `YYYY-MM-DD`. `to` may equal `from` and may
        be at most 60 days after it, and both fall between 2000 and 2100.
        `destinationKey` is optional; when sent it is a destination key the
        catalogue knows, and the destination must be one Yuvoy sells in: a
        place for finding things to do (a `discover` market) is a `400`.


        Validation problems are a `400` with one plain sentence per field in
        `error.details`, keyed `from`, `to` or `destinationKey`.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                destinationKey: { type: string }
      responses:
        "200":
          description: The stay as kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TravellerStay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [me]
      summary: Forget the days I am on the island
      operationId: clearMyStay
      description: >-
        Clears the stay. `getMyAccount` then answers `stay: null`. Clearing a
        stay that is not there is the same `204`.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/interest-options:
    get:
      tags: [me]
      summary: The tiles for the first-sign-in screen
      operationId: listInterestOptions
      description: >-
        Six to eight interests to offer, so the app does not invent its own
        list. Activity types with the most live listings come first; when too
        little is on sale to fill the screen, the busiest categories and then
        the leading categories top it up. With a `discover` market the tiles are
        the categories of what was found there, most items first, then the
        leading categories.


        **The populated vocabulary, not the active one**, which is why this is
        not a field on `getPublicVocabulary`. A filter chip must not vanish when
        its last listing pauses; a tile asking what somebody likes should only
        offer what is actually sold, or in a discover market what was found.


        No session. `marketKey` narrows to one market; without it, every market.
        Edge-cacheable for a few minutes.
      parameters:
        - name: marketKey
          in: query
          schema: { $ref: "#/components/schemas/MarketKey" }
      responses:
        "200":
          description: The tiles, in the order to show them.
          content:
            application/json:
              schema:
                type: object
                required: [options]
                properties:
                  options:
                    type: array
                    minItems: 6
                    maxItems: 8
                    items: { $ref: "#/components/schemas/InterestOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/invite-codes/redeem:
    post:
      tags: [me]
      summary: Redeem an invite code
      operationId: redeemInviteCode
      description: >-
        Admits the signed-in traveller's number to booking with a code Yuvoy
        gave them. Sign in first (`verifyTravellerSignIn`), then redeem.
        **Redeeming never creates a session**: the number admitted is the one
        the session already proved, so a traveller who signs in again on a new
        phone with the same number keeps their access.


        Codes are 8 characters from an alphabet with no 0, O, 1, I or L, shown
        as `XXXX-XXXX`. Case, spaces and hyphens do not matter on input, so
        `k7qm 4xrd` is the same code as `K7QM-4XRD`. One code admits one
        person, once.


        A number that is already admitted gets `200` with
        `alreadyAdmitted: true` whatever code it sends, and the code is **not**
        used up, so it can go to somebody else.


        A code staff issued for a named number is redeemable by that number
        only (yuvoy-api#195). From any other number it is
        `404 invite_code_unknown`, whatever state it is in, so a code says
        nothing about itself to somebody it was not meant for.


        Refusals: `404 invite_code_unknown` (no such code, one that was
        withdrawn, or one issued for another number, which read alike on
        purpose), `409 invite_code_used`, `410 invite_code_expired`. Throttled
        per IP and per number, `429`; through the app's own server, per IP
        means the person's address it names (see the API description).


        `GET /me` reports the result as `admitted`. Whether booking actually
        needs it is a server switch; see `createReservation`.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  examples: ["K7QM-4XRD"]
                  description: As typed. Case, spaces and hyphens are ignored.
      responses:
        "200":
          description: The number is admitted.
          content:
            application/json:
              schema:
                type: object
                required: [admitted]
                properties:
                  admitted: { type: boolean, enum: [true] }
                  alreadyAdmitted:
                    type: boolean
                    enum: [true]
                    description: >-
                      Present only when the number was admitted before this
                      request. The code sent was left unused.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`invite_code_unknown`: no such code, one that was withdrawn, or one issued for another number."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`invite_code_used`: somebody has already used this code."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "`invite_code_expired`: the code is past its expiry."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /support/requests:
    get:
      tags: [me]
      summary: The help requests this traveller has sent
      operationId: listSupportRequests
      description: >-
        Every request the signed-in traveller sent with `createSupportRequest`,
        however they signed in, and every one sent from a number they have
        proved, whether signed in or through a booking link for a booking on
        that number. A request that names another traveller stays theirs, even
        from the same number. Newest first, paged like `listSavedExperiences`:
        pass `nextCursor` back unchanged as `cursor`, and stop on
        `complete: true`.


        **Signed in only.** A session with no number lists too. A booking
        link's status token proves one booking, not who holds it, so it cannot
        list; it is a `401` here. It can open a request raised about this
        booking or its reservation with `getSupportRequest`.


        The list also holds the cards this traveller reported while signed in
        (`reportEvent`), under topic `other`, with `message` reading
        `You reported "<title>": <reason words>.` Such a request reads
        `resolved` once staff decide on the card.


        What is not here, so it is not faked: no staff replies (the
        conversation happens on WhatsApp or by email and is not stored) and no
        `waiting_on_traveller` state (staff do not record one).
      security: [{ travellerSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: This traveller's help requests, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportRequestPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >-
            `unauthorized`, "Sign in to see your messages to us.", for no
            `Authorization` header, an unknown token or a booking link's status
            token. An expired booking link is `token_expired` instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [me]
      summary: Send Yuvoy a message from the app
      operationId: createSupportRequest
      description: >-
        The in-app help form. The message reaches the admin customer support
        queue (`adminCustomerSupport`, kind `TRAVELLER_HELP_REQUEST`, source
        `traveller`), and a person replies on WhatsApp, or by email to a
        traveller with no number.


        Accepts a signed-in session **or** a booking link's status token, so a
        traveller who booked without signing in can still ask for help.


        `bookingReference` is optional. With a session it must be the
        signed-in traveller's booking; with a booking link it must be that
        link's own booking, and when omitted the link's booking is attached
        anyway. Somebody else's reference, or one that does not exist, is a
        `404`.


        Sending the same message about the same booking again returns the same
        `reference` rather than opening a second case. Five requests an hour per
        number, or per traveller for a session with no number, or per booking
        for a booking link with no number, then `429`.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 10, maxLength: 2000 }
                bookingReference: { type: string, example: YV-8K2M4PQR }
                topic:
                  type: string
                  enum: [booking, payment, cancellation, other]
                  default: other
      responses:
        "201":
          description: The message is in the support queue.
          content:
            application/json:
              schema:
                type: object
                required: [reference, message]
                properties:
                  reference:
                    type: string
                    example: SR-3F9A12C0
                    description: Short enough to quote on a call.
                  message:
                    type: string
                    description: Plain words to show the traveller.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /support/requests/{reference}:
    get:
      tags: [me]
      summary: One help request, by its reference
      operationId: getSupportRequest
      description: >-
        Takes the same credentials as `createSupportRequest`. A signed-in
        session opens the requests its traveller sent, and those sent from a
        number the traveller has proved that name no other traveller. A
        booking link's status token opens only the requests raised about this
        booking or its reservation, whoever sent them, so a guest who booked
        without signing in can look up the reference they were given,
        including one sent while the trip was still a hold or an unanswered
        request.


        A reference that does not exist and one that belongs to somebody else
        are the same `404`, word for word, so the answer never says whether a
        reference exists. The reference is matched without regard to case.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string, example: SR-3F9A12C0 }
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/devices:
    post:
      tags: [bookings]
      summary: Get pushes about this booking on this phone
      operationId: registerBookingDevice
      description: >-
        For a guest, who booked without signing in. Registers the push token
        `expo-notifications` gave this app for the one booking the link in
        `Authorization: Bearer <statusToken>` opens (since 2026-10-15,
        yuvoy-api#305). Sending the same token again refreshes it and is not an
        error, so an app may register on every launch and after a recovery,
        which moves the registration to the new link.


        **Only a checkout or recovery link.** A link from the signed-in trip
        list (`listMyBookings`) answers `401`: a signed-in phone registers
        through `registerTravellerDevice`. An unknown, revoked or expired link
        also answers `401`.


        **Pushes stop when the link does.** Recovery revoking the link, or the
        link expiring 7 days after its departure ends, stops pushes to this
        phone about this booking with nothing further to call. Closing the
        traveller account of the booking's number (`deleteMyAccount`) stops
        them too, and registering answers `401` while that closing is open.
        One phone may hold several bookings, each registered with its own
        link, and registering here never stops the pushes a signed-in session
        on the same phone receives. A booking hears on at most five phones;
        registering a sixth stops the one heard from longest ago.


        **What a push carries** is what `registerTravellerDevice` describes:
        a generic sentence and `data: { type, id }`, where `id` is the
        booking's `reservationId` as `getBookingStatus` returns it. Open the
        booking with the same link to show anything more. A phone registered
        both ways hears about a booking once.
      security: [{ statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "204": { description: "Registered, or refreshed." }
        "400":
          description: >-
            `invalid_push_token` for a token that is not an Expo push token;
            `invalid_input` for anything else, with `details` keyed by field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [bookings]
      summary: Stop pushes about this booking on this phone
      operationId: unregisterBookingDevice
      description: >-
        Stops pushes about the booking this link opens to one token. The token
        is in the body, not the query, because a URL is written to request
        logs. `204` whether or not the token was registered for this booking,
        so the answer says nothing about which phones hold it.
      security: [{ statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceToken" }
      responses:
        "204": { description: "Stopped, or was never registered here." }
        "400":
          description: As for `registerBookingDevice`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/share:
    post:
      tags: [bookings]
      summary: Make a link for the people coming
      operationId: shareBooking
      description: >-
        A link for a different audience from the person who paid, and therefore
        a different token.


        The status token opens the booking — the payer's name, their number, the
        amount, the refund position, the cancel button. A trip pasted into a
        hostel WhatsApp group of six strangers must reveal none of that. This
        token opens what somebody needs in order to turn up and nothing else,
        and the response says so in words, because the person about to paste it
        is the one who needs to know what it reveals.


        Only the holder of the status token can mint one: you may share your own
        trip, not somebody else's.
      security: [{ statusToken: [] }]
      responses:
        "201":
          description: A shareable link.
          content:
            application/json:
              schema:
                type: object
                required: [shareUrl, expiresIn]
                properties:
                  shareUrl:
                    type: string
                    description: >-
                      Opens `/trip/{token}` on the traveller app, the shared-trip
                      page that reads `GET /v1/trips/{token}`.
                    example: https://app.yuvoy.in/trip/3q2-Xw9vLk
                  expiresIn: { type: integer, description: Seconds. }
                  expiresAt:
                    type: string
                    format: date-time
                    description: >-
                      When the link stops working. The same moment as
                      `expiresIn`, and the one `listBookingShares` shows.
                  reveals:
                    type: string
                    description: Plain words for what the link exposes.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/shares:
    get:
      tags: [bookings]
      summary: The live share links of this booking, with when each stops working
      operationId: listBookingShares
      description: >-
        The links made with `shareBooking` for the booking this status token
        opens, that still work: not stopped and not expired. Newest first.


        **The token of a link is never returned again.** Only its hash is
        stored, so a link lost from the group chat cannot be fetched back; make
        a new one.


        `openedCount` and `lastOpenedAt` say whether a link is being passed
        around, not who opened it. `lastOpenedAt` is absent until it is opened.
      security: [{ statusToken: [] }]
      responses:
        "200":
          description: Live links. The token is never returned again.
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items:
                      type: object
                      required: [id, createdAt, expiresAt, openedCount]
                      properties:
                        id: { type: string, format: uuid }
                        createdAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
                        openedCount: { type: integer }
                        lastOpenedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/shares/{id}:
    delete:
      tags: [bookings]
      summary: Stop one share link now
      operationId: revokeBookingShare
      description: >-
        Stops one link of the booking this status token opens. Opening it
        afterwards with `getSharedTrip` answers `404`.


        A link of this booking that already stopped, by an earlier call or by
        expiry, answers `204`: the state asked for holds. `404` for an id that
        is not a link of this booking: another booking's, an unknown one and
        one that is not an id at all are the same answer, so nothing can be
        learnt by trying ids.
      security: [{ statusToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: A link `id` from `listBookingShares`.
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Stopped. Opening it now answers 404. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{token}:
    get:
      tags: [bookings]
      summary: Open a shared trip
      operationId: getSharedTrip
      description: >-
        Unauthenticated by design — the token IS the authorisation, and
        everybody in the group has it. What it buys is deliberately small.


        Note what is absent, and that the absence is the design: no phone
        number, no email, no name, no amount paid, no refund position and no
        cancel action. `partySize` is a count, never a guest list — who is
        coming is theirs to say in the group chat, not ours.


        A cancelled trip still resolves. Somebody opening a link for a departure
        that was called off must be told, not shown a dead page.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: What somebody needs in order to turn up.
          content:
            application/json:
              schema:
                type: object
                required: [experience, operator, hostName, localDate, localTime, meetingPoint, partySize, cancelled]
                properties:
                  experience: { type: string }
                  operator: { type: string, deprecated: true, description: The old name of `hostName`; sent beside it until the traveller cut-over (D-049). }
                  hostName: { type: string }
                  localDate: { type: string, format: date }
                  localTime: { type: string }
                  meetingPoint: { type: string }
                  landmark: { type: string }
                  durationMinutes: { type: integer }
                  bring: { type: array, items: { type: string } }
                  partySize: { type: integer }
                  cancelled: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/invites:
    post:
      tags: [bookings]
      summary: Invite somebody onto this trip
      operationId: createTripInvite
      description: >-
        Offers one place in the party, to a phone number or as a link. Both
        answer with `inviteUrl`, so the booker can copy an invitation to a
        number into a chat of their own. The link is returned once and never
        again; offer Copy and Share rather than printing it.


        With `phone`, the invitation also waits in that number's own account
        (`listInvitedTrips`) with no link at all. Numbers are normalised as at
        checkout, so a bare ten-digit number is taken as +91.


        Without `phone`, the link is single-use: the first verified number to
        accept it has the place.


        **The guest-count rule.** Live invitations (invited or joined) may not
        exceed the party size less the booker, so a party of four can invite
        three people and a party of one nobody. Declined and removed
        invitations do not use a place. Beyond that, `409`.


        **Delivery.** There is no WhatsApp sender yet, so an invitation to a
        number reads `delivery: not_sent_no_channel` and nothing is queued. When
        a sender is configured the same request reads `queued`. A link is never
        sent by us and reads `not_applicable`.


        Authorised by the booking's status token (any issuer, including the
        `statusToken` rows of `listMyBookings`), or by a traveller session for
        the number the booking was made with, in which case `reservationId` is
        required. A share token is refused. Invitations are taken for a trip
        that is confirmed, or a request still waiting on the operator, and that
        has not ended.
      security: [{ statusToken: [] }, { travellerSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: The number to invite. Omit for a link anybody may accept once.
                reservationId:
                  type: string
                  description: >-
                    Which booking, when signed in with a session. Optional with a
                    status token, where it must be that token's own booking.
      responses:
        "201":
          description: The invitation, with its link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedTripInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `conflict`. The trip is not taking invitations (cancelled, called
            off, over, or an unpaid hold), every place is already offered, that
            number already has an invitation, or it is the booker's own number.
            `message` says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      tags: [bookings]
      summary: Who the booker invited
      operationId: listTripInvites
      description: >-
        Every invitation on this booking except removed ones, oldest first. A
        number is shown masked to its last four digits, unless the guest joined
        with a profile name, in which case the name is shown instead. Declined
        invitations stay, so the booker knows.
      security: [{ statusToken: [] }, { travellerSession: [] }]
      parameters:
        - name: reservationId
          in: query
          required: false
          description: Required with a travellerSession.
          schema: { type: string }
      responses:
        "200":
          description: The guests, and how many places there are to offer.
          content:
            application/json:
              schema:
                type: object
                required: [guests, maxGuests]
                properties:
                  guests:
                    type: array
                    items: { $ref: "#/components/schemas/TripGuest" }
                  maxGuests:
                    type: integer
                    description: The party size less the booker.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/invites/{id}:
    delete:
      tags: [bookings]
      summary: Remove a guest or revoke an invitation
      operationId: removeTripGuest
      description: >-
        Withdraws an invitation, revokes its link, or takes somebody who joined
        off the trip. Their access ends on the next request. `204` also when
        they were already removed. With a session, `reservationId` may be
        omitted: the invitation names its booking, and the session must be the
        number that booking was made with.
      security: [{ statusToken: [] }, { travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: reservationId
          in: query
          required: false
          schema: { type: string }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /invites/{token}:
    get:
      tags: [bookings]
      summary: Which trip an invitation link is for
      operationId: previewTripInvite
      description: >-
        Unauthenticated. Names the trip so somebody knows what they are signing
        in for: the experience, the day, the operator and where it stands.
        Nothing personal and nothing about money. `404` for a link that is
        unknown, revoked, declined, or past the end of its trip.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The trip behind the link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripInvitePreview" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /invites/{token}/accept:
    post:
      tags: [me]
      summary: Accept an invitation link
      operationId: acceptTripInvite
      description: >-
        Joins the trip as the signed-in traveller (`verifyTravellerSignIn`, by
        number, email or Google). An invitation addressed to a number can be
        accepted only by a traveller who has proved that number; anybody else
        gets `404`, not `403`. A link addressed to nobody is single-use, and a
        traveller with no number may accept it. Accepting again is not an
        error. The trip then appears in `listInvitedTrips`.
      security: [{ travellerSession: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The trip, as a guest sees it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitedTrip" }
        "401":
          description: >-
            `unauthorized`. With no `Authorization` header the message is "Sign
            in with your WhatsApp number to see your trips.", the sentence every
            route behind the traveller sign-in check answers, however the
            traveller signed in; an unknown or expired token reads "Sign in
            again to see your trips." A credential that names no traveller,
            which a live one never does, reads "Sign in to accept."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `conflict`. The trip was cancelled or called off before it was
            accepted, or this is the traveller, or the number, the trip was
            booked with.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/invited-trips:
    get:
      tags: [me]
      summary: Trips this traveller was invited to
      operationId: listInvitedTrips
      description: >-
        Trips the signed-in traveller joined as a guest, however they signed
        in, and invitations addressed to a number they have proved that can
        still be accepted, each with `role: guest`. Ordered as trips are:
        upcoming soonest first, then past ones most recent first.


        **Separate from `listMyBookings` on purpose.** Those rows carry a booking
        link and belong to the person who booked; these carry no money, no
        reference and no link, and an invitee cannot cancel or change anything.
        The app merges the two lists, telling them apart by `role`.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: The trips.
          content:
            application/json:
              schema:
                type: object
                required: [trips]
                properties:
                  trips:
                    type: array
                    items: { $ref: "#/components/schemas/InvitedTrip" }
        "401":
          description: >-
            As for `acceptTripInvite`; a credential that names no traveller
            reads "Sign in to see your trips."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/invited-trips/{id}:
    get:
      tags: [me]
      summary: One trip this traveller was invited to
      operationId: getInvitedTrip
      security: [{ travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The trip, as a guest sees it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitedTrip" }
        "401":
          description: >-
            As for `acceptTripInvite`; a credential that names no traveller
            reads "Sign in to see your trips."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/invited-trips/{id}/accept:
    post:
      tags: [me]
      summary: Accept an invitation from the list
      operationId: acceptInvitedTrip
      description: >-
        For an invitation addressed to a number this traveller has proved,
        with no link needed. Accepting again is not an error.
      security: [{ travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The trip, as a guest sees it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitedTrip" }
        "401":
          description: >-
            As for `acceptTripInvite`; a credential that names no traveller
            reads "Sign in to accept."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`. The trip was cancelled or called off before it was accepted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/invited-trips/{id}/decline:
    post:
      tags: [me]
      summary: Decline an invitation
      operationId: declineInvitedTrip
      description: >-
        Frees the place for somebody else and takes the trip out of this list.
        Declining again is not an error; declining a trip already joined is
        `409`.
      security: [{ travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Declined. }
        "401":
          description: >-
            As for `acceptTripInvite`; a credential that names no traveller
            reads "Sign in to answer."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`. This traveller already joined the trip."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/review:
    post:
      tags: [bookings]
      summary: Say how the trip went
      operationId: leaveReview
      description: >-
        Only from a booking whose trip has actually happened — `completed`, not
        `confirmed`. A confirmed booking is one that is going to happen, and a
        review of a trip nobody has taken is exactly the fabricated claim this
        API is built not to make.


        One per booking, enforced by a unique constraint rather than a check: a
        booking is a trip somebody took, and a second review of it is an edit.


        **Nothing written here is published to anybody yet.** The catalog
        carries no rating and no review count, and that ABSENCE is what enforces
        the no-fabricated-claims rule — not a promise to be careful. Collecting
        from day one is what makes the numbers real on the day there is
        something worth showing.


        A review is taken for 30 days after the departure's scheduled end.
        Each refusal has its own code, all `409`: `not_reviewable_yet` (the
        trip has not been marked completed), `already_reviewed` (one per trip),
        and `review_window_closed` (more than 30 days after the trip).
        `canReview` on `listMyBookings` and `review.canReview` on
        `getBookingStatus` say in advance whether this will be accepted.
      security: [{ statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment:
                  type: string
                  maxLength: 2000
                  description: >-
                    Optional. Plenty of people tap five stars and nothing else,
                    and a required comment box turns a two-second act into an
                    abandoned one.
                tags:
                  type: array
                  maxItems: 6
                  description: >-
                    Optional. What was good, from a closed list. Repeats are
                    dropped and the order is kept. A value outside the list, or
                    more than six entries, is refused with `invalid_input`.
                    Stored with the review and never editable afterwards.
                  items:
                    type: string
                    enum: [guide, safety, value, organisation, punctuality, equipment]
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >-
            Refused, and `error.code` says why: `not_reviewable_yet`,
            `already_reviewed` or `review_window_closed`. Before 2026-09-13
            all three were `conflict`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/answers:
    post:
      tags: [bookings]
      summary: Answer the questions the listing asks
      description: >
        The traveller answering the operator's questions on this listing, after
        checkout, from the booking link. `GET /bookings/status` carries the
        questions, what this party has answered, and `answersOpen`.


        Each answer replaces this party's earlier answer to the same question,
        whether that was given at checkout or here. Questions left out keep what
        they had. All or nothing: if one answer does not fit its question,
        nothing is saved, and `details` names each problem, keyed like
        `answers[0].answer`.


        `yes_no` takes `yes` or `no`, and `choice` takes one of the question's
        `options`, both ignoring case. `short_text` takes up to 300 characters,
        and no phone number, email address or link: the same screening messages
        have, since an answer reaches the operator's manifest. Such an answer is
        refused with a reason saying which kind it looks like it holds, never
        what was written, and `details` also carries
        `answers[0].contactDetail`: `phone`, `email` or `link`. A time range
        such as `0830-0930` and a code such as `Z1234567` are not read as phone
        numbers; a bare run of ten digits is. Unknown fields are refused.


        Answers are taken while the booking is going ahead and until its
        departure leaves; after that this answers `409 answers_closed`. These
        questions never ask about health, which is the screener at checkout.


        Answers are kept for 90 days after the departure ends, and then deleted,
        unless a legal hold names this booking (D46). `PartyQuestion` says how
        the booking reads afterwards.
      operationId: answerBookingQuestions
      security: [{ statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingAnswersInput" }
      responses:
        "200":
          description: Saved. Every question and answer for this party, as the status page shows them.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [questions]
                properties:
                  questions:
                    type: array
                    items: { $ref: "#/components/schemas/PartyQuestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >-
            `answers_closed`: the departure has left, or the booking is no longer
            going ahead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/cancellation-quote:
    get:
      tags: [bookings]
      summary: What cancelling would refund
      description: >
        A read that changes nothing. A traveller deciding whether to cancel
        should see the number **first** — showing it only afterwards is how
        people end up feeling tricked by a policy they did agree to.


        Priced from the policy snapshot frozen at checkout, never from the live
        listing. `selfService` tells the client whether to render a cancel
        button at all: a partial refund is an amount somebody has to stand
        behind, and offering a button that then fails is worse than not offering
        one.


        **A departure that moved after this booking was made refunds in full**
        (D-032.3). If the operator moved the departure while this booking, or
        the hold it was made from, was on it, the quote is everything paid
        online whatever tier the snapshot holds, until the departure leaves, and
        `note` says why. A booking made after the move chose the new time and
        gets the usual tiers.


        A valid token whose booking does not exist yet answers `200` with
        `cancellable: false` and a reason — the token's validity and the
        booking's existence are different questions.
      operationId: quoteCancellation
      security:
        - statusToken: []
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                type: object
                required: [cancellable, selfService]
                properties:
                  bookingReference: { type: string }
                  cancellable: { type: boolean }
                  selfService:
                    type: boolean
                    description: >-
                      False when the refund is part of what was paid online:
                      that needs a person. A partial tier with nothing to
                      refund is self-service.
                  capturedPaise: { type: integer }
                  refundPaise: { type: integer }
                  refundTier: { type: string }
                  hoursBeforeStart: { type: integer }
                  reason: { type: string, description: Present when not cancellable. }
                  note:
                    type: string
                    description: >-
                      A sentence to show beside the figure, when there is one: a
                      partial refund of money paid online, which needs a person,
                      or a departure the operator moved after this booking was
                      made, which refunds everything paid online.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookings/status:
    get:
      tags: [bookings]
      summary: What happened to my booking
      description: >
        The page a traveller lands on after checkout, and the only way back to a
        booking made without an account.


        The status token from `createReservation` is presented as
        `Authorization: Bearer <token>` and **never as a query parameter** — this
        service logs the request URI on every request, and a URL additionally
        reaches browser history, proxies, referrer headers and page analytics.
        The web route fronting this sets `Referrer-Policy: no-referrer`.


        `state` is computed server-side from the underlying state machines and is
        never stored as a column. Clients must not derive it: a hold whose
        deadline has passed reads `expired` here even though the stored row still
        says `active`, because the seat is genuinely gone the instant the hold
        lapses — the sweep that rewrites the row is tidiness, not truth.


        Poll every 3s with backoff while `final` is `false`. Stop when it is
        `true`; do not hardcode which states are terminal, or the list goes stale
        the first time one is added.


        An expired token is answered `token_expired` rather than the generic
        unauthorized code, so the page can offer to send a new link. An unknown
        token and a revoked one are deliberately indistinguishable. A link
        expires 7 days after its departure ends, or 72 hours after it was
        issued if that is later (yuvoy-api#305). Cancelling or refunding the
        booking does not end it, so a cancelled booking stays readable.
      operationId: getBookingStatus
      security:
        - statusToken: []
      responses:
        "200":
          description: The booking as the traveller may see it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookings/messages:
    get:
      tags: [bookings]
      summary: The conversation with the business
      description: >
        The conversation on this booking between the traveller and the business
        running the trip (D6). The booking link's token opens it, exactly as it
        opens `getBookingStatus`, and no booking id is taken: the token is the
        booking, so a link opens its own conversation and no other.


        **The most recent messages first, a page at a time, oldest first within
        a page.** Draw a page top to bottom. To load what came before it, pass
        `nextCursor` back as `cursor`; it is absent when the conversation begins
        on this page. A message that arrives while somebody scrolls is after the
        first page and never inside a later one, so fetch the first page again
        to see new messages.


        Fetching marks nothing read. Mark what was shown with
        `markBookingMessagesRead`, so a page left polling in a pocket does not
        clear `unreadCount`.


        A link whose hold or request never became a booking answers an empty,
        complete conversation with `canWrite` false and `closedReason`
        `not_booked`, not an error.


        A message's text is removed a set time after the trip ends (90 days
        unless the service is configured otherwise). The message stays, with who
        wrote it and when, and carries `textRemovedAt` in place of `text`. Show
        it as a message whose text was removed, never as an empty one.
      operationId: getBookingMessages
      security:
        - statusToken: []
      parameters:
        - name: limit
          in: query
          description: >-
            Messages per page. None, or a value that is not a whole number above
            zero, gets 50. More than 200 gets 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: >-
            A previous page's `nextCursor`, for the messages before that page.
            Opaque, so do not construct one. A cursor this conversation did not
            issue is a `400`.
          schema: { type: string }
      responses:
        "200":
          description: One page of the conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingMessageThread" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [bookings]
      summary: Write to the business
      description: >
        Adds a message to this booking's conversation and queues a notice for
        the business: every active person there, once for this message, on
        WhatsApp or email as this service can send. The notice names the trip
        and the booking reference and never carries the text, which is read in
        the conversation.


        The text is trimmed, keeps its line breaks, and is at most 1000
        characters, counted as characters rather than bytes.


        **A message with a phone number, an email address or a link in it is
        refused** `400 invalid_input`, with `details.text` `contact details` and
        `details.contactDetail` saying which: `phone`, `email` or `link`.
        Nothing is stored, and the refusal names the kind without repeating any
        of the text. A phone number is seven or more digits written close
        together, counted through the spaces, dashes, brackets and dots between
        them, except the digits of a date written like 14.09.2026 or 2026-09-14.
        A link starts `http://`, `https://` or `www.`, or is a word ending
        `.com`, `.in`, `.net`, `.org`, `.io`, `.co` or `.me`, so a full stop
        typed with no space before one of those words reads as a link too. An
        email address is a name, an `@` and a domain with a dot in it.


        Writing stops when the booking is cancelled or declined, and a set time
        after the trip ends (seven days unless the service is configured
        otherwise). After that the conversation can still be read, and a message
        is refused `409 messages_closed` with `details.reason` saying which.
      operationId: sendBookingMessage
      security:
        - statusToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Optional. Client-generated, 16-128 chars of `A-Za-z0-9_.:-`. Send
            one per message and the same one when resending that message after
            a lost answer. A resend with the same key and the same `text`
            answers `201` with the message the first send wrote and
            `Idempotent-Replay: true`: nothing is posted twice and the business
            is told once. The same key with different `text` is
            `409 idempotency_key_reuse`. The key belongs to this booking and is
            kept for 7 days. Without it, every send is a new message, as
            before.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingMessageInput" }
      responses:
        "201":
          description: Written, and the business's notice is queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingMessage" }
        "400":
          description: >-
            `invalid_input`, with `details.text` saying why: `required` (nothing
            written, or a body that is not JSON), `too long` (over 1000
            characters), `unprintable` (characters no screen can show), or
            `contact details`, with `details.contactDetail` `phone`, `email` or
            `link`. Nothing was stored. Or `idempotency_key_malformed`: the
            `Idempotency-Key` sent is not 16-128 characters of `A-Za-z0-9_.:-`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >-
            `messages_closed`: the conversation can be read and not written in.
            `details.reason` is `not_booked`, `cancelled`, `declined` or
            `window_closed`. `idempotency_key_reuse`: that `Idempotency-Key`
            was sent before with different text. `idempotency_in_progress`:
            another send with that key is still being written; resend after
            `Retry-After` and the answer is that message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/messages/read:
    post:
      tags: [bookings]
      summary: Mark the conversation read up to a message
      description: >
        Moves the traveller's read marker to a message they were shown, and so to
        everything before it, and answers what is still unread. Named by the
        message rather than "all of it, now", so a message that arrived after
        the page was drawn stays unread. A marker never moves back: naming an
        older message changes nothing.
      operationId: markBookingMessagesRead
      security:
        - statusToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingMessageReadInput" }
      responses:
        "200":
          description: What is still unread.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingMessageReadReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: That message is not in this booking's conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /plans/templates:
    get:
      tags: [plans]
      operationId: listPlanTemplates
      summary: The eleven plan templates, in display order
      description: >-
        Public and the same for everybody, so it is cached at the edge and asks
        no release stage. It holds no plan. Each app maps `key` to its own icon.
      security: []
      responses:
        "200":
          description: The templates.
          content: { application/json: { schema: { $ref: "#/components/schemas/PlanTemplateList" } } }
  /plans:
    post:
      tags: [plans]
      operationId: createPlan
      summary: Make a plan
      description: >-
        Signed-in adults only. The answer carries `link`, which the planner shares
        from their own WhatsApp; Yuvoy sends nothing to anybody. Suggested share
        text, for both apps: "{title}. {when}. Reply here, no app needed:
        {link}". The planner answers `can` on every time they offer. Each time is
        from 30 minutes to 180 days ahead, ends after it starts and within 24
        hours, and replyBy is before the earliest time. With no name on the
        profile, or one whose first word is not a first name, send `plannerName`;
        without it the answer is 400 with `details.plannerName` ("What should
        friends call you?"). At most 30 plans still ahead (409
        `plan_limit_reached`) and 10 new plans a day (429). Every route on a
        plan is 404 while the `plans` release does not admit the caller, and
        503 `plans_unavailable` while plans are paused.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NewPlan" } } } }
      responses:
        "201": { description: "The plan, planner view.", content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdultsOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`plan_limit_reached`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /me/plans:
    get:
      tags: [plans]
      operationId: listMyPlans
      summary: Plans I made or answered while signed in
      description: >-
        when=upcoming (the default) lists open and decided plans whose time is
        still ahead, soonest first; when=past lists the rest, newest first.
        Cursor is opaque; pass nextCursor back unchanged with the same when.
      security: [{ travellerSession: [] }]
      parameters:
        - { name: when, in: query, schema: { type: string, enum: [upcoming, past], default: upcoming } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/PlanPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [plans]
      operationId: getPlan
      summary: One plan for its planner or a signed-in member
      description: A plan the caller is not an active member of is 404, never 403.
      security: [{ travellerSession: [] }]
      responses:
        "200": { description: The plan., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
    patch:
      tags: [plans]
      operationId: updatePlan
      summary: Change a plan (planner)
      description: >-
        Repeat every week needs exactly one time, or a picked time, and
        repeatUntil is at most 12 weeks after the first start.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanChanges" } } } }
      responses:
        "200": { description: The plan., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`plan_closed`; `details.reason` says why.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/{id}/times:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [plans]
      operationId: addPlanTime
      summary: Offer another time (planner; at most three)
      description: >-
        A fourth time is 400 with `details.times`. A weekly plan with no
        picked time keeps its one time: another is 400 with
        `details.repeatWeekly` until repeat is turned off or a time is picked.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NewPlanTime" } } } }
      responses:
        "200": { description: The plan., content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`plan_closed`; `details.reason` says why.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/{id}/times/{optionId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: optionId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [plans]
      operationId: removePlanTime
      summary: Withdraw a time that is not the decided one (planner)
      security: [{ travellerSession: [] }]
      responses:
