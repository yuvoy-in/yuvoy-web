        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `conflict` with `details.reason` `decided_time` (it is the picked
            time) or `last_time` (it is the only time left), or `plan_closed`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/PlansUnavailable" }
  /plans/{id}/ideas:
