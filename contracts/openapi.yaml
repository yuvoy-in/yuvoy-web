      summary: Pick this time, or pick the winning idea (planner)
      description: >-
        Send timeId or ideaId, one of them. Picking a time locks the plan: each
        answer for that time becomes Going, Maybe or Can't, shares freeze, and
        the claims of anybody who can't come are released. Picking another time
        later leaves the shares as they are.
      security: [{ travellerSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanDecision" } } } }
      responses:
