        extraPeople: { type: integer, minimum: 1, maximum: 10 }
        expectTotalPaise:
          type: integer
          minimum: 0
          description: >-
            The booking's new total as it was shown: the price agreed at checkout
            for each person, or the same total for a booking priced per group. A
            different total answers 409 price_moved.
        screening:
          type: object
          additionalProperties: false
          description: The listing's safety questions for the added people, as checkout asks them.
          properties:
            declaredClear: { type: [boolean, "null"] }
            ageBands:
              type: array
              items: { type: string }
              description: One per added person.
        trigoActionId:
          type: [string, "null"]
          format: uuid
          description: As for BookingMove.

    BookingChange:
      type: object
      description: The booking as it stands after the change.
      required: [reference, kind, localDate, localTime, guests, payAtCounterPaise, currency]
      properties:
        reference: { type: string }
        kind: { type: string, enum: [move, add_people] }
        localDate: { type: string, format: date }
        localTime: { type: string, description: "HH:MM where the departure leaves." }
        guests: { type: integer }
        payAtCounterPaise:
          type: integer
          description: The cash to pay at the counter on the day, in paise.
        currency: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            requestId: { type: string }

    ErrorCode:
      type: string
      description: >-
        A closed set, so a client can branch on the machine-readable code and
        never on the message. Codes are added by contract change, never invented
        at the call site.
      enum:
        # Transport and shape
        - invalid_input
        - unauthorized
        - not_found
        - conflict
        - rate_limited
        - method_not_allowed
        - not_implemented
        - internal_error
        # The body limit refused the request before any handler saw it: 64 KB,
        # or a route's own cap where its description states one
        # (`POST /reel-views`, 256 KB). Retrying the same body fails
        # identically. Send less, or send it in pieces.
        - payload_too_large
        # The unclassified case, and deliberately named as one: an HTTP-level
        # 4xx at a status this API does not anticipate, produced by the
        # framework rather than by a handler. There is nothing to branch on
        # beyond the status. It replaced an undeclared literal `error` on
        # 2026-09-07; anything seen arriving with it is a status that has
        # earned a code of its own.
        - unclassified_error
        # Availability and capacity. Each names a different reason a traveller
        # cannot proceed, because "unavailable" alone leaves them with no next
        # step — and one of these is not the traveller's fault at all.
        - capacity_unavailable
        # Retired 2026-09-13 and no longer returned: every request is taken, at
        # any hour. Kept in the enum so a deployed client's exhaustive handling
        # still type-checks.
        - request_quota_exhausted
        - request_window_closed
        - grant_ceiling_exceeded
        - cutoff_passed
        - stale_availability
        # Deliberately stopped, rather than broken. Truthful copy depends on the
        # client being able to tell these from an outage.
        - booking_disabled
        # Since 0053 this is returned by POST /v1/reservations/{id}/payment-order
        # as well as by reservation create: the operator's standing is re-checked
        # when a traveller re-enters checkout, not only when they first hold a
        # seat. It never carries a reason — why a business stopped selling is a
        # supply judgment about them, and this is a traveller endpoint.
        - operator_not_bookable
        # The same code under its D-049 name. Listed now so clients accept
        # both; the API sends the old one until the traveller cut-over.
        - host_not_bookable
        # Idempotency and checkout, emitted today but previously undeclared —
        # a client cannot branch on a code the contract does not name.
        - idempotency_key_malformed
        - idempotency_key_reuse
        - idempotency_in_progress
        # Access to a booking without an account.
        - token_expired
        - reservation_not_payable
        # The booking takes no more answers to its listing's questions: the
        # departure has left, or the booking is no longer going ahead.
        - answers_closed
        # A checkout that sent answers left a question the listing requires
        # without one. `details.questions` names each (D45).
        - answers_required
        # Why a review was refused, all 409. Each is a different screen: come
        # back after the trip, thank you, or this has closed.
        - not_reviewable_yet
        - already_reviewed
        - review_window_closed
        # Refused for saying it wrong rather than for lacking permission. Each
        # is a different next step for the caller: fix the code, echo the
        # confirmation back, pick a role that exists.
        - invalid_reason_code
        - refund_quote_moved
        - price_moved
        # Safety refusals. Distinct codes because each leaves the traveller with
        # a different next step, and "talk to us first" is not the same message
        # as "this trip has a minimum age".
        - screening_required
        - screening_needs_a_doctor
        - under_minimum_age
        # A traveller's own change to a booking (moveBooking,
        # addPersonToBooking). `booking_not_changeable`: the booking is not
        # confirmed or waiting on the business, or the link's reservation never
        # became a booking. `booking_departed`: its departure has started.
        # `change_needs_a_person`: one of our team makes this change, and
        # `details.reason` says why (`paid_online`, `cash_collected`,
        # `request_departure`). `action_changed` on a change is listed with
        # Trigo's cards below.
        - booking_not_changeable
        - booking_departed
        - change_needs_a_person
        # A person under 18 at a sign-in door or on confirmMyAge (R4-T1).
        # Never under_minimum_age, which is a trip's own minimum.
        - under_age_sign_up
        - refund_requires_finance
        - confirmation_required
        - invalid_role
        # Configured-off surfaces. Distinguishable from an outage on purpose.
        - payments_unavailable
        - media_unavailable
        # The booking store this endpoint needs is not wired, so recovery,
        # cancellation quotes and "my trips" cannot answer. A 503: the request
        # was not recorded and retrying later is the right move, which is why
        # it is not `internal_error`. The three sibling surfaces each name
        # themselves (`admin_unavailable`, `operator_unavailable`,
        # `media_unavailable`); this one predates that convention and is left
        # under the bare spelling the handlers actually write rather than
        # renamed underneath a client.
        - unavailable
        # A booking's conversation that can be read and not written in: no
        # booking behind the link yet, a cancelled or declined booking, or a
        # trip that ended longer ago than messages stay open. `details.reason`
        # says which.
        - messages_closed
        # Booking by invitation (yuvoy-api#195). `invite_required` is a 403 from
        # createReservation while the gate is on; the other three are
        # redeemInviteCode's refusals (404, 409, 410).
        - invite_required
        - invite_code_unknown
        - invite_code_used
        - invite_code_expired
        # Closing an account (B9, D13). A 403 from verifyTravellerSignIn and
        # verifyBookingRecovery, only after the code checked out: this number
        # closed its account and the erasure request is still open.
        - account_deletion_pending
        # A sign-in door switched off in `features.signIn` (yuvoy-api#304): a
        # 503 from requestTravellerSignIn and verifyTravellerSignIn for an
        # email, and from signInWithGoogle.
        - sign_in_unavailable
        # Adding a way in while signed in (verifyTravellerSignIn with a
        # session, yuvoy-api#304, MD-110). `identity_taken` is a 409: the
        # number or address already signs in to another traveller, and nothing
        # is merged. `identity_kind_taken` is a 409 too: the traveller already
        # holds a number (or an address), one of each (MD-111).
        # `fresh_sign_in_required` is a 401: the credential is from before
        # 16 Oct 2026 17:21 IST, so sign in again first.
        - identity_taken
        - identity_kind_taken
        - fresh_sign_in_required
        # registerTravellerDevice and unregisterTravellerDevice: a token that
        # is not an Expo push token. A client bug or an old build; never retry
        # it with the same token.
        - invalid_push_token
        # setMyGoing on an item that has started, has no date, or is
        # cancelled (R4-T3), a 409. One no longer listed is a 404.
        - event_not_open
        # Ask Trigo (R5-T1a). `adult_confirmation_required` is a 403: the
        # traveller has not said they are 18 or over (confirmMyAge); R7, R8 and
        # R9 reuse it. `consent_required` is a 409 naming the notice to show in
        # details.noticeVersion. `turn_in_progress` is a 409 while another turn
        # of the same traveller is still running. `daily_limit_reached` is a
        # 429 with details.resetsAt, the next midnight in India.
        - adult_confirmation_required
        - consent_required
        - turn_in_progress
        - daily_limit_reached
        # Plans (R7). `plans_unavailable` is a 503 while the feature:plans kill
        # switch is engaged or plans are not set up: paused, not broken. A caller
        # outside the release gets 404. `plan_full` (409): the plan has its 40
        # guests. `plan_closed` (409): no more of that change, because the plan
        # started, was cancelled, was marked done or was closed by Yuvoy;
        # `details.reason` says which. `plan_limit_reached` (409): the planner has
        # 30 plans still ahead.
        - plans_unavailable
        - plan_full
        - plan_closed
        - plan_limit_reached
        # Join a table (R8). `tables_unavailable` (503): the feature:tables kill
        # switch is engaged. Outside the tables release a list is empty and a
        # table is 404. `table_closed` (409): requests closed, or the table was
        # cancelled or has started. `table_full` (409): every seat is taken (no
        # waitlist). `table_request_limit` (409): three requests waiting or two
        # seats coming up already. `table_banned` (403): this person may not
        # join tables; the message does not say why. `women_only` (403): the
        # table is for women and the confirmation was not given.
        - tables_unavailable
        - table_closed
        - table_full
        - table_request_limit
        - table_banned
        - women_only
        # People (R9-T2a). `people_paused` is a 403: the caller's use of
        # People is paused or ended (details.standing, details.until).
        # `name_required` is a 409: People needs a first name first.
        # `friend_limit_reached` is a 409: 1,000 friends or 100 waiting
        # requests sent. `friend_link_expired` is a 410 and
        # `friend_link_full` a 409. `crew_limit_reached` and `not_friends`
        # are 409s from crews (R9-T2c).
        - people_paused
        - name_required
        - friend_limit_reached
        - friend_link_expired
        - friend_link_full
        - crew_limit_reached
        - not_friends
        # Trigo's cards (R6-T1). Both are 409s from confirmTrigoAction.
        # `action_changed`: the card's facts moved since Trigo made it;
        # details.reason is sold_out, price_moved, time_moved, not_bookable
        # or booking_changed. From moveBooking and addPersonToBooking (R6-T2)
        # it is a 409 when the change was not made from a Trigo card the
        # traveller confirmed for exactly this change. `action_expired`: the card expired, was
        # declined or replaced, or its checkout lapsed; declineTrigoAction
        # answers it for a card already confirmed, used or replaced.
        # `date_alerts_full` (R6-T3, decider 21 Oct): a 409 from
        # confirmTrigoAction for a date-alert card when the traveller has 50
        # alerts waiting already.
        - action_changed
        - action_expired
        - date_alerts_full
        # A traveller's own video (R12-T1). `uploads_paused`,
        # `photos_unavailable` and `media_unavailable` are 503s;
        # `caption_has_contact` is a 400 (details.caption says which);
        # `not_went` and `not_open_yet` are 403s; `video_already_posted`,
        # `upload_in_progress`, `not_arrived`, `media_refused` and
        # `caption_locked` are 409s. `photo_limit_reached` (R12-T1 PR 3) is
        # the 409 for a fourth photo of the same trip or event.
        - uploads_paused
        - photos_unavailable
        - caption_has_contact
        - not_went
        - not_open_yet
        - video_already_posted
        - upload_in_progress
        - not_arrived
        - media_refused
        - caption_locked
        - photo_limit_reached
        # The directory (R11-T3). `already_on_yuvoy` is a 409 from
        # removeSupplierListing: the business joined Yuvoy, so its listing
        # cannot be removed from here.
        - already_on_yuvoy
        # People (R9-T2b). `age_locked` is a 409 on confirmMyAge: the Yuvoy
        # team upheld a report that the person is under 18, so only the team
        # can change the age answer.
        - age_locked
        # Organiser pages (R11-T2). `organisers_paused` is a 503 on every
        # write but cancelling an event while feature:organisers is engaged.
        # `not_a_member` and `not_owner` are 403s about one organiser.
        # `no_account_with_that_email` is a 400 from addOrganiserHelper: they
        # sign in to Yuvoy once with it first. `event_has_ended` is a 409 on
        # an edit, a cancel or a picture start. `organisers_paused` and
        # `not_a_member` also answer a picture start (startMyUpload,
        # organiser_image). `organiser_email_required` is a 409: the
        # posting member has no proven email. Outside the supply release
        # every organiser route is 404.
        - organisers_paused
        - not_a_member
        - not_owner
        - no_account_with_that_email
        - event_has_ended
        - organiser_email_required
        # The club link (R11-T2). `not_club_holder` is a 403 from
        # createOrganiser with clubId: the group is shown but the caller does
        # not hold it. `club_already_linked` is a 409: the group has an
        # organiser already (details.organiserId names it, G4).
        - not_club_holder
        - club_already_linked
        # The door (R11-T2 PR 3a). `organisers_paused` (above) is a 503 while organiser
        # pages are paused. `own_code` and `check_in_not_today` are 409s from
        # checkInAtTheDoor: the caller's own going, or a code for another day
        # (details.validOn names it).
        - own_code
        - check_in_not_today
        # An organiser claims an event card (R11-T2 PR 3b). `claim_already_open` is a
        # 409 from claimEventForOrganiser: somebody's claim on the event is with a
        # person already.
        - claim_already_open
        # `follow_limit_reached` is a 409 from followClub: 200 groups followed already (R10-T2).
        - follow_limit_reached

    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          description: Amount in the currency's minor unit (paise for INR)
          example: 450000
        currency: { type: string, example: INR }

    SupplierListing:
      type: object
      additionalProperties: false
      required: [slug, name, category, destinationKey, placeName, sourceHost, sourceUrl, checked, state]
      description: >-
        A business that is not on Yuvoy: four facts and the public page they
        came from, nothing else.
      properties:
        slug: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        destinationKey: { $ref: "#/components/schemas/DestinationKey" }
        placeName: { type: string }
        sourceHost: { type: string, example: example.com }
        sourceUrl: { type: string, format: uri }
        checked:
          type: boolean
          description: True only when a person at Yuvoy checked it is a real business at this place. It is still not on Yuvoy.
        state:
          type: string
          enum: [listed, joining, on_yuvoy]
          description: >-
            `listed`: not on Yuvoy. `joining`: the business claimed it and its
            papers are not checked yet. `on_yuvoy`: it sells on Yuvoy, see
            `hostSlug`.
        operatorSlug: { type: string, deprecated: true, description: The old name of `hostSlug`; sent beside it until the traveller cut-over (D-049). }
        hostSlug: { type: string, description: Present only when `state` is `on_yuvoy`. }
        claimable:
          type: boolean
          description: >-
            Whether the business can claim this listing from the operator
            portal. Present while `state` is `listed`: `true` when no claim is
            open on it, `false` while one waits for our team. Absent once the
            business is `joining` or `on_yuvoy`.
    SupplierListingList:
      type: object
      additionalProperties: false
      required: [items, complete]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SupplierListing" } }
        complete: { type: boolean, description: "Told rather than inferred, as on `listEvents`." }
        nextCursor: { type: string, description: Absent when there is nothing after this page. }
    SupplierRemoval:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [owner_request, closed_down, wrong_details, other] }
    Category:
      type: string
      enum:
        - adventure
        - nature_wildlife
        - food_drink
        - arts_creativity
        - learning
        - culture_heritage
        - wellness
        - entertainment
        - community
        - sports
        - local_life
        - events

    ExperienceMode:
      type: string
      enum: [local, travel]

    PolicyTier:
      type: string
      enum: [flexible, firm, weather]

    ProviderTier:
      type: string
      enum: [professional, creator, community]

    Provider:
      type: object
      required: [id, name, tier]
      properties:
        id: { type: string }
        name: { type: string }
        tier: { $ref: "#/components/schemas/ProviderTier" }
        verified: { type: boolean }

    CreatorUpload:
      type: object
      description: >-
        A traveller's own video, or private photo, of something they went on,
        as its owner reads it (R12-T1), or a picture a member added to their
        organiser's event (`organiser_image`, R11-T2). A picture's target is
        the event's card; it has no `wentOn`, caption or `playback`, and is
        never `held` or `private`.
      required: [id, purpose, state, target, hiddenFromListing, createdAt]
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [listing_video, went_photo, organiser_image] }
        state:
          type: string
          enum: [uploading, in_review, published, held, rejected, private, deleted, failed]
          description: >-
            `uploading` until the file is sent and `completeMyUpload` called;
            `in_review` while a person looks; `published` once shown; `held`
            while reports are looked at; `rejected` with `rejection`;
            `private` for a photo, kept for you alone; `failed` when the file
            was refused or never sent.
        wentOn: { type: string, format: date, description: "The day the traveller went. Absent for an organiser's picture." }
        organiserId:
          type: string
          format: uuid
          description: The organiser whose event the picture is of. Pictures only.
        target:
          type: object
          required: [kind, id, title]
          properties:
            kind: { type: string, enum: [experience, event] }
            id: { type: string, format: uuid }
            slug: { type: string, description: Experiences only. }
            title: { type: string }
        caption: { type: string, maxLength: 140 }
        rejection:
          type: object
          required: [code, sentence]
          description: Present when the video or picture was not accepted.
          properties:
            code: { type: string }
            sentence: { type: string, description: "Why, in plain words for the person who filmed it or took the picture." }
        hiddenFromListing:
          type: boolean
          description: The business took it off its listing. It stays on your profile.
        playback:
          $ref: "#/components/schemas/Media"
          description: Present once the video is published.
        imageUrl:
          type: string
          format: uri
          description: An organiser's picture once it is published; absent otherwise.
        photoUrl:
          type: string
          format: uri
          description: >-
            Photos only, once private. A signed read for its owner that works
            for 5 minutes. Do not store it or send it anywhere else.
        createdAt: { type: string, format: date-time }

    CreatorLink:
      type: object
      description: >-
        A traveller's share link to something they went on (R12-T2), as its
        owner reads it. Counts only, and indicative: the code arrives from the
        browser, so they are never the basis of a perk or a payout.
      required: [code, link, target, createdAt, opens30Days, opensTotal, bookings]
      properties:
        code: { type: string, example: C-K7QM2XPA }
        link: { type: string, format: uri, example: "https://app.yuvoy.in/go/C-K7QM2XPA" }
        target:
          type: object
          required: [kind, id, title]
          properties:
            kind: { type: string, enum: [experience, event] }
            id: { type: string, format: uuid }
            slug: { type: string, description: Experiences only. }
            title: { type: string }
        createdAt: { type: string, format: date-time }
        opens30Days: { type: integer, minimum: 0, description: Opens counted without identifying anybody; not people. }
        opensTotal: { type: integer, minimum: 0 }
        bookings: { type: integer, minimum: 0, description: "Bookings through the link that are paid, confirmed or completed. No amounts, no names." }
        lastBookingOn: { type: string, format: date, description: The day the latest of them was booked. Absent when there is none. }

    CreatorUploadStart:
      type: object
      additionalProperties: false
      required: [purpose, sizeBytes]
      properties:
        purpose:
          type: string
          enum: [listing_video, went_photo, organiser_image]
          description: >-
            `listing_video` is a video others see once staff approve it.
            `went_photo` is a private photo only its owner sees.
            `organiser_image` is a member's picture for their organiser's
            live event: send `eventId` and no `experienceId`, `caption` or
            `contentType`.
        experienceId: { type: string, format: uuid, description: "Exactly one of experienceId and eventId. Never for a picture." }
        eventId: { type: string, format: uuid, description: "Exactly one of experienceId and eventId. A picture names the event's card." }
        sizeBytes: { type: integer, minimum: 1, maximum: 209715200, description: "The file's own size. Photos and pictures: at most 5242880." }
        contentType:
          type: string
          enum: [image/jpeg, image/png]
          description: Photos only, and required for one; a video or picture start that sends it is a `400`.
        statement:
          type: object
          required: [version, sha256]
          additionalProperties: false
          description: >-
            The statement as it was shown. Videos and pictures only, and
            required for each; a photo start that sends either is a `400`.
          properties:
            kind:
              type: string
              enum: [creator_video, organiser_image]
              default: creator_video
              description: "`organiser_image` for a picture, with that statement's version and digest."
            version: { type: integer, minimum: 1 }
            sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        peopleConsentConfirmed:
          type: boolean
          const: true
          description: Videos and pictures only, and required for each; a photo start that sends either is a `400`.
        caption: { type: string, maxLength: 140, description: "Never for a picture: a picture start that sends it is a `400`." }

    ListingVideo:
      type: object
      required: [id, firstName, wentOn, playback]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, description: "Empty when the person gave none; say someone who went." }
        wentOn: { type: string, format: date }
        caption: { type: string }
        playback: { $ref: "#/components/schemas/Media" }

    Media:
      type: object
      # A playback object, not a URL. Video is delivered as adaptive-bitrate
      # HLS/DASH from the media provider's edge, so there is no single "the
      # url" — the client picks a rendition. posterUrl always resolves and
      # renders first; a client on a slow connection may show only that.
      required: [id, kind, posterUrl]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video] }
        playbackId: { type: string }
        hlsUrl:
          type: string
          format: uri
          description: >-
            **Not populated before M15.** Render poster-first and treat playback
            as progressive enhancement: `posterUrl` always resolves, and on a
            0.5-3 Mbps island connection the poster is what most travellers see
            first anyway.
        dashUrl:
          type: string
          format: uri
          description: Not populated before M15. See `hlsUrl`.
        posterUrl: { type: string, format: uri }
        durationSeconds: { type: number, format: float }
        aspectRatio:
          type: string
          description: "e.g. '9:16'. The feed is vertical; a non-9:16 clip is flagged in review."
          examples: ["9:16"]
        alt: { type: string }

    OperatorSummary:
      type: object
      # What a traveller may know about who is running the experience. There is
      # no rating: reviews do not exist until real completed bookings produce
      # them, and a number nobody earned is a fabricated claim.
      required: [id, slug, name, verified]
      properties:
        id: { type: string }
        slug:
          type: string
          description: >-
            How a card links to the business's own page, `/v1/operators/{slug}`.


            Added when that page shipped and was reachable from nothing: every
            card carried the operator's name and id, the page is addressed by
            slug, and so the one journey it exists for — reel, listing, operator
            — could not be built. Use this rather than `id` in a URL: the id is
            ours, and the slug is what a traveller can read and yuvoy-web can
            index.
        name: { type: string }
        verified:
          type: boolean
          description: >-
            True only when every mandatory credential is on file, verified and
            unexpired. It is a statement about evidence we hold, not a badge.
        logoUrl:
          type: string
          description: >-
            The operator's own mark. **Absent when they have not set one**, so
            fall back to your own placeholder rather than rendering a broken
            image.


            Show it on a card whose `heroMedia` is absent. A logo is not a
            substitute for footage — the feed is video — but a card carrying the
            operator's mark is something a person can recognise and tap, and an
            empty rectangle is neither.
        credentialsSummary:
          type: array
          description: Human-readable statements of what was checked, each backed by a record.
          items: { type: string }

    SavedIds:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
    SavedExperience:
      allOf:
        - { $ref: "#/components/schemas/ExperienceSummary" }
        - type: object
          required: [bookable]
          properties:
            bookable:
              type: boolean
              description: False when unavailable; a save never grants access to drafts.
    SupportRequest:
      type: object
      required: [reference, status, topic, createdAt, updatedAt, message]
      description: >-
        A help request as the traveller who sent it sees it. Staff notes, how
        the case was graded and internal ids are never included.
      properties:
        reference:
          type: string
          example: SR-3F9A12C0
          description: What `createSupportRequest` returned.
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
          description: >-
            `open`: received, nobody has picked it up. `in_progress`: somebody
            is on it. `resolved`: dealt with. `closed`: closed without action.
            Sending the same message again reopens a `resolved` or `closed`
            request as `open`.
        topic:
          type: string
          enum: [booking, payment, cancellation, other]
        createdAt:
          type: string
          format: date-time
          description: When the request was first sent.
        updatedAt:
          type: string
          format: date-time
          description: >-
            The latest of: the request being sent again, picked up, or
            resolved.
        message:
          type: string
          description: >-
            The traveller's own text. Staff replies are not stored. For a card
            reported while signed in (`reportEvent`, topic `other`) it is our
            words instead: `You reported "<title>": <reason words>.`
        bookingReference:
          type: string
          example: YV-8K2M4PQR
          description: Present only when the request is about a booking.

    SupportRequestPage:
      type: object
      required: [items, nextCursor, complete]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SupportRequest" }
        nextCursor: { type: [string, "null"] }
        complete: { type: boolean }

    SavedPage:
      type: object
      required: [items, nextCursor, complete]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SavedExperience" }
        nextCursor: { type: string, nullable: true }
        complete: { type: boolean }

    ExperienceSummary:
      type: object
      required:
        [
          id,
          slug,
          title,
          marketKey,
          destinationKey,
          category,
          bookingMode,
          durationMinutes,
          operator,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        marketKey: { $ref: "#/components/schemas/MarketKey" }
        destinationKey: { $ref: "#/components/schemas/DestinationKey" }
        location: { type: string, description: Display name of the destination. }
        category: { $ref: "#/components/schemas/Category" }
        activityType:
          type: string
          description: >-
            What this experience actually is — `scuba`, not `adventure`.


            `category` is market-agnostic and is what a traveller browses by; it
            cannot describe the thing, because in the launch market every water
            sport is `adventure`. **Absent** on listings that predate the
            vocabulary, so render nothing rather than a placeholder noun.


            Deliberately **not an enum**, unlike `category`: the set grows by
            INSERT and an enum would go stale — the same reasoning the operator
            contract already gives for `destination`. `category` stays a closed
            enum because it is what a traveller browses by and it is not growing.
          examples: ["scuba"]
        activityTypeLabel:
          type: string
          description: >-
            `activityType` as the word to print. From the same table the operator
            picker reads, so the two cannot word the same noun differently.
            Present exactly when `activityType` is.
          examples: ["Scuba diving"]
        bookingMode:
          $ref: "#/components/schemas/BookingMode"
        durationMinutes: { type: integer }
        maxPartySize: { type: integer }
        fromPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: >-
            **The listing's unit price, in the unit `pricingUnit` names.** Absent
            until a real contracted price exists; there is no placeholder price
            anywhere in this API.


            The name implies a floor across variants and that is not what it is:
            it is a single number, and for a `per_group` charter "from ₹4,000"
            is wrong twice — it is not a minimum, and it is not per person. The
            field is not renamed because generated clients carry the name.
            If it is ever renamed, the right name is `price`.
        pricingUnit:
          type: string
          enum: [per_person, per_group]
          description: >-
            How `fromPrice` is charged. `per_person` multiplies by the party;
            `per_group` is the price of the whole departure whatever the party
            size. **Present exactly when `fromPrice` is present.**


            This existed in the schema and at checkout from the beginning and was
            never selected by any public read path, so both traveller surfaces
            hard-coded "per person" and a ₹4,000 per-GROUP listing read as
            ₹4,000 per person until the last screen.
        pricingUnitLabel:
          type: string
          description: >-
            `pricingUnit` as the phrase to print beside the price. **Render it
            verbatim; do not build one from `pricingUnit`.**


            Same rule and the same reason as `seatsOnNextDisplay`: a client
            deriving its own phrase is a second copy of a rule this API owns, and
            the copy that drifts is the one that misstates a price to a consumer.
            Money FORMATTING stays with the client — it already gets rupee
            grouping right; only the unit phrase is ours.


            A `per_group` listing reads "for the group", or "for the boat" when
            Yuvoy staff have said the price is for the whole boat (an Andaman
            boat trip, for one).
          examples: ["per person", "for the group", "for the boat"]
        heroMedia: { $ref: "#/components/schemas/Media" }
        operator:
          $ref: "#/components/schemas/OperatorSummary"
          deprecated: true
          description: The old name of `host`; sent beside it until the traveller cut-over (D-049).
        host: { $ref: "#/components/schemas/OperatorSummary" }
        nextAvailable:
          type: string
          format: date
          description: >-
            The next departure a traveller could actually book, as a date in
            the MARKET's timezone.


            **Absent means nothing is bookable in the next 90 days** — not "we
            did not check". A card that says nothing about availability makes
            the traveller tap through to find out, and the tap that ends in "no
            dates" is the one that loses them. Bounded at 90 days on purpose: an
            experience whose next departure is in March is not usable by
            somebody with three days on an island, and showing it as available
            wastes their tap.
        seatsOnNext:
          type: integer
          description: >-
            Seats left on that departure. Present only alongside
            `nextAvailable`, and **only for `allotment` mode** — a request-mode
            departure holds nothing until an operator says yes, so a number here
            would be a promise we cannot keep, and "3 seats left" that becomes
            "the operator declined" is worse than saying nothing.
        seatsOnNextDisplay:
          type: string
          description: >-
            That number as a sentence, decided here. **Render it verbatim; do
            not re-derive one from `seatsOnNext`.**


            The card was printing "N seats left" below a threshold it kept
            itself, which is a second copy of a rule the server owns. The moment
            the threshold moves — or counts start being suppressed — the card
            and the slot row disagree about the same departure.


            Absent means say nothing about availability. Same semantics as
            `Slot.remainingDisplay`, and the same function computes both.
          examples: ["3 seats left"]

    BookingMode:
      type: string
      description: >-
        How this experience sells. `allotment` means Yuvoy holds contracted
        seats and a traveller books instantly. `request` means the operator
        answers first and the traveller pays only after they accept — Yuvoy
        holds no inventory and makes no availability claim.
      enum: [allotment, request]

    Experience:
      allOf:
        - $ref: "#/components/schemas/ExperienceSummary"
        - type: object
          required: [gallery, meetingPoint, bookable, paymentLabel]
          properties:
            bookable:
              type: boolean
              description: >-
                Whether this listing can be sold right now: the operator is
                selling, the listing is published and priced, no kill switch
                applies, and every credential its market and activity category
                require is on file, verified and unexpired today.


                **`false` is a 200, not a 404.** The card is already absent from
                every browse surface, so the only way to reach this page is a
                link somebody was handed — a shared message, a bookmark, a
                search result — and telling that person the business does not
                exist is worse than telling them it is not selling. Availability
                comes back empty for the same listing, and a checkout attempt is
                refused with `operator_not_bookable`.


                Deliberately carries **no reason**. Why a business has stopped
                selling is a supply judgment about them and is not published on
                a traveller endpoint.
            summary: { type: string }
            description: { type: string }
            included:
              type: array
              items: { type: string }
            # What the day asks of the traveller — fitness, swimming, prior
            # certification. Shown before anyone commits, not at the jetty.
            requirements:
              type: array
              items: { type: string }
            safetyNotes: { type: string }
            policyTier: { $ref: "#/components/schemas/PolicyTier" }
            cancellationPolicy:
              type: string
              description: The policy as it will be frozen onto a booking at checkout.
            cancellationSummary:
              type: string
              description: >-
                `cancellationPolicy` as one short line, to print beside the
                price. **Render it verbatim; do not shorten the policy
                yourself.**


                It says the best refund a traveller can get by cancelling and
                the latest they can cancel to get it. Built from the same refund
                tiers checkout freezes onto the booking and that a cancellation
                is refunded by, so it cannot promise more than the policy pays.
                The rest of the policy, including the full refund when the
                operator or the weather cancels, is in `cancellationPolicy`,
                which is still sent and is still what the traveller accepts.


                **Absent exactly when `cancellationPolicy` is absent**, and then
                there is no policy in force to summarise.
              examples: ["Full refund until 48 hours before"]
            paymentLabel:
              type: string
              description: >-
                How a traveller pays, as the phrase to print beside the price
                and at the top of checkout. **Always present. Render it
                verbatim.**


                Decided by the server with the same payment provider the
                payment-order answer is decided by, so the listing and the pay
                step cannot disagree. The listing needs it before a reservation
                exists, and `createPaymentOrder` only answers once one does.
                Paying at the counter is offered whatever the provider, so every
                phrase names it; card and UPI are named only when a provider
                that really takes money is configured. The demo provider does
                not count. The value is the same on every listing.
              examples:
                ["Pay at the counter on the day", "Pay by card, UPI or at the counter on the day"]
            meetingPoint: { $ref: "#/components/schemas/MeetingPoint" }
            gallery:
              type: array
              items: { $ref: "#/components/schemas/Media" }
            safety: { $ref: "#/components/schemas/SafetyRequirements" }
            questions:
              type: array
              description: >-
                What the operator asks every traveller on this listing, in the
                order to ask it. Absent when the listing asks nothing. Send the
                answers with the reservation as `answers`, or from the booking
                link afterwards with `POST /bookings/answers`. A checkout that
                sends `answers` must answer every question with
                `required: true`; one that sends none is never refused over a
                question. Never about health, which is `safety.screener`.
              items: { $ref: "#/components/schemas/ListingQuestion" }
            compliance:
              type: object
              required: [label, validTo]
              description: >-
                The operator's registration, as a line to print on the listing.
                **Render `label` verbatim.** Taken from the operator's A&N
                Tourism registration with the latest expiry date, among the ones
                Yuvoy staff have verified and that have not expired. **Absent
                when there is none**, which includes the day after it expires,
                counted in the market's calendar as the sale gate counts it:
                say nothing rather than guess.
              properties:
                label:
                  type: string
                  examples: ["Registered with A&N Tourism"]
                validTo:
                  type: string
                  format: date
                  description: The last day the registration is valid.
                  examples: ["2027-06-30"]

    MeetingPoint:
      type: object
      required: [text]
      properties:
        text: { type: string }
        landmark: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    ExperiencePage:
      type: object
      required: [items, nextCursor, complete]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ExperienceSummary" }
        nextCursor:
          # OpenAPI 3.1 drops `nullable`; a null union is the 3.1 spelling.
          type: [string, "null"]
        complete:
          type: boolean
          description: >-
            Whether this is the end. **Told, not inferred.** A client that
            decides it has reached the end because a page came back short stops
            early the first time a filter happens to return exactly one page —
            and an infinite scroll that silently stops looks identical to one
            with nothing more to show.

    Slot:
      type: object
      required:
        [id, startsAt, endsAt, marketTimezone, localDate, localStartTime, bookingCutoffAt, status, bookingMode, soldOut]
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        marketTimezone:
          type: string
          description: IANA zone the local fields are expressed in, e.g. Asia/Kolkata.
          examples: ["Asia/Kolkata"]
        localDate: { type: string, format: date }
        localStartTime: { type: string, examples: ["07:00:00"] }
        bookingCutoffAt:
          type: string
          format: date-time
          description: After this instant the slot cannot be booked. Shown disabled, never hidden.
        status: { type: string, enum: [open, closed, cancelled] }
        bookingMode: { $ref: "#/components/schemas/BookingMode" }
        maxPartySize: { type: integer }
        price: { $ref: "#/components/schemas/Money" }
        # Present ONLY for allotment slots that are NOT stale.
        #
        # A request-mode slot carries no seat count because Yuvoy holds no
        # inventory on it — publishing a number there would be claiming
        # availability we do not have. A stale slot carries none because the
        # number is the thing that went stale; the departure did not.
        remainingSeats:
          type: integer
          description: >-
            Seats remaining after holds and bookings — the same arithmetic
            checkout enforces, not the contracted allotment. Absent for request
            mode and absent when `availability.stale` is true.
        remainingDisplay:
          type: string
          description: >-
            What to show the traveller, and the only field a UI should render
            for availability. Render this string; do not re-derive it from
            `remainingSeats`, or the two disagree the moment either rule
            changes.


            For allotment: `Full` at zero, an exact count from 1 to 5, and
            **`Available` at six or more** — a counter that reads 23, then 21,
            then 22 as holds come and go teaches a traveller the number is
            noise, so it appears only when it changes what somebody does. A
            stale slot reads `Available` too, except a full one, which stays
            `Full`: if our best information says there is no room we do not
            invite somebody into a checkout that will refuse them.


            For request mode: wording that promises an answer, never a seat.
        availability: { $ref: "#/components/schemas/SlotAvailability" }
        soldOut:
          type: boolean
          description: >-
            True when nobody more can book, or ask for, this departure. **Grey
            the departure out in a date picker on this field**, in both booking
            modes, rather than deriving it from `remainingSeats` or
            `remainingDisplay`.


            Allotment: no seat is left after holds and bookings, the same fact
            `remainingDisplay` states as `Full`. It stays true on a stale slot,
            for the same reason `Full` does.


            Request: the operator has already granted the departure's full
            capacity, so no further request could be accepted. Only the boolean
            is published. Request mode withholds seat counts on purpose, and
            this field does not change that.


            It says nothing about `status` or `bookingCutoffAt`. A departure
            that is `closed`, `cancelled` or past its cutoff is unbookable too
            and should be shown disabled on those fields, with `soldOut` possibly
            false.

    SlotAvailability:
      type: object
      required: [asOf, stale]
      properties:
        asOf:
          type: string
          format: date-time
          description: When a human last confirmed this seat count with the operator.
        verifiedVia:
          type: string
          enum: [manifest_call, operator_message, operator_portal, host_message, host_portal, ops_correction]
          description: >-
            `host_message` and `host_portal` are the D-049 names of
            `operator_message` and `operator_portal`, listed so clients accept
            them; the API sends the old ones until the traveller cut-over.
        stale:
          type: boolean
          description: >-
            True when nobody has confirmed this seat count with the operator in
            over 24 hours.


            **Two thresholds, not one.** Past 24 hours the slot is still offered
            — the departure is real and the operator is reachable — but
            `remainingSeats` is withheld and `remainingDisplay` reads
            `Available`, so a day-old figure is never printed as a current one.
            Past the slot's suppression window (default 48 h) it is not returned
            at all and is counted in `staleSlotsSuppressed` instead.


            A UI seeing `stale: true` should say when the count was last checked
            — `asOf` and `verifiedVia` are there for exactly that — rather than
            silently showing less information.

    AvailabilityPage:
      type: object
      required: [slots, bookable, availabilityAsOf, marketTimezone, staleSlotsSuppressed]
      properties:
        slots:
          type: array
          items: { $ref: "#/components/schemas/Slot" }
        bookable:
          type: boolean
          description: >-
            The listing-level answer, identical to `Experience.bookable`. When
            it is `false` the response is still a 200 with an EMPTY `slots`
            array rather than a 404, so "this is not on sale" and "nothing is on
            between those dates" stay distinguishable to a client.


            Note that a slot can also disappear from a range while `bookable` is
            `true`: a credential lapsing mid-range removes the departures after
            it and leaves the ones before it. Those are dropped silently and are
            NOT counted in `staleSlotsSuppressed` — a counter there would
            publish the date an operator's insurance runs out.
        availabilityAsOf: { type: string, format: date-time }
        marketTimezone: { type: string, examples: ["Asia/Kolkata"] }
        staleSlotsSuppressed:
          type: integer
          description: >-
            How many slots were withheld as stale. Reported rather than hidden,
            so an empty day is distinguishable from an unverified one.

    ReservationInput:
      type: object
      required: [slotId, guests, contact]
      additionalProperties: false
      properties:
        slotId: { type: string }
        guests: { type: integer, minimum: 1 }
        contact: { $ref: "#/components/schemas/ReservationContact" }
        expectTotalPaise:
          type: integer
          format: int64
          description: >-
            The total the traveller was shown, in paise, for this party size.


            **Optional, and send it.** Omitted, nothing is checked and this
            endpoint behaves exactly as it always has. Sent, the checkout is
            refused `409 price_moved` when the listing no longer costs that.


            It exists because an operator now changes their own price with no
            review (D-032.3). That used to take days, so the gap between reading
            a total and pressing the button could not matter; it is now however
            long a checkout screen sits open. The price snapshot is taken from
            the LIVE listing inside the checkout transaction, so without this a
            traveller is charged the new number having agreed to the old one —
            and the snapshot records the new number as what they agreed to.


            Trusted, unlike `attribution`, and safely: the worst a wrong value
            can do is refuse a booking that would have overcharged whoever sent
            it.
        attribution: { $ref: "#/components/schemas/Attribution" }
        screening: { $ref: "#/components/schemas/Screening" }
        answers:
          type: array
          description: >-
            Answers to the questions this listing asks (`questions` on the
            experience).


            **Optional.** Omit it and nothing about questions is checked, the
            listing's required ones included: the booking reads each question
            as not answered yet, to be answered with `POST /bookings/answers`.


            **Send it, even as an empty list, and required questions are
            enforced.** The checkout is refused `409 answers_required` when a
            question the listing asks now with `required: true` has no answer
            here that fits, and `details.questions` names each one. `null`, or
            a value that is not a list, counts as not sent.


            An answer that does not fit is not recorded, and never refuses the
            checkout on its own: it only leaves its question unanswered. The one
            exception is an answer holding a phone number, an email address or a
            link, which refuses the checkout `409 answers_required` with a
            `reason` and a `contactDetail` for its question. Not
            fitting means a question the listing no longer asks, a choice that
            is not one of its options, an answer its question's type does not
            take, or an item that is not an object with a string `questionId`
            and a string `answer`. See what was recorded on
            `GET /bookings/status`, and answer the rest with
            `POST /bookings/answers`.


            A retry that replays an existing reservation records nothing new;
            answer from the booking link instead.


            Answers are kept for 90 days after the departure ends, and then
            deleted, as `PartyQuestion` describes.
          items: { $ref: "#/components/schemas/BookingAnswer" }

    SafetyRequirements:
      type: object
      description: >-
        What this listing asks before it will take money. Carried here rather
        than behind a second call, because it decides how the booking form
        renders and a round trip on that screen costs bookings.


        This is what a client needs in order to ASK correctly. It enforces
        nothing — a client that ignores it gets a refusal from
        `POST /reservations`.
      properties:
        minAge:
          type: integer
          description: >-
            The operator's stated minimum age. Absent means no age rule. When
            present, collect an age BAND per participant — never a date of
            birth, which is personal data gathered for a comparison that does
            not need it.
        screener:
          type: object
          description: The health declaration this listing requires. Absent means none.
          required: [key, version, questions, affirmation]
          properties:
            key: { type: string, example: diving_rstc }
            version:
              type: integer
              description: >-
                The version a declaration will be recorded against. A screener
                revised on medical advice does not retroactively restate what
                somebody was already asked.
            questions:
              type: array
              items: { type: string }
              description: >-
                Render from here, in order. Not hardcoded in the client: the
                list changes on medical advice, and a copy in a frontend build
                is a copy that goes stale silently.
            affirmation:
              type: string
              description: >-
                The single statement the lead traveller ticks, covering the
                whole party — which is what the copy tells them they are doing.

    ListingQuestion:
      type: object
      additionalProperties: false
      description: >-
        One question the operator asks every traveller on a listing. Its `text`,
        `answerType` and `options` never change once it exists: a reworded
        question comes with a new `id`. Never about health, which the screener
        asks.
      required: [id, text, answerType, required]
      properties:
        id:
          type: string
          description: What an answer names in `questionId`.
        text:
          type: string
          maxLength: 200
          description: The question, to show as it is.
        answerType:
          type: string
          enum: [short_text, choice, yes_no]
          description: >-
            How to ask it. `short_text` takes up to 300 characters, `choice`
            takes exactly one of `options`, and `yes_no` takes `yes` or `no`.
        options:
          type: array
          items: { type: string }
          description: The choices, in the order to show them. Present only on a `choice` question.
        required:
          type: boolean
          description: >-
            The operator needs an answer. Show it as needed. A checkout that
            sends `answers` is refused `409 answers_required` until this
            question has an answer that fits; a checkout that sends no `answers`
            is not, and the traveller can answer from the booking link
            afterwards.

    PartyQuestion:
      type: object
      additionalProperties: false
      description: >-
        One question as it stands for this party: the words they were asked, and
        their answer if they gave one. Every question the listing asks now comes
        first, in the listing's order, answered or not. After them comes any
        question this party answered that the listing no longer asks, with
        `current: false`, so an earlier answer stays readable with its words.


        Answers are kept for 90 days after the departure ends, and then deleted,
        unless a legal hold names this booking (D46). Afterwards every question
        the listing still asks reads `answered: false`, with no `answer` or
        `answeredAt`, exactly as a question never answered reads, and a question
        the listing no longer asks is not listed at all.
      required: [questionId, text, answerType, required, current, answered]
      properties:
        questionId: { type: string }
        text:
          type: string
          description: >-
            The words this party was asked. They never change once a question
            exists, so on an answered question these are the words answered.
        answerType: { type: string, enum: [short_text, choice, yes_no] }
        options:
          type: array
          items: { type: string }
          description: Present only on a `choice` question.
        required: { type: boolean }
        current:
          type: boolean
          description: >-
            `false` when the listing no longer asks this question. Only an
            answered question appears with `current: false`, and it cannot be
            answered again.
        answered:
          type: boolean
          description: "`false` means no answer is on record: not answered yet, or deleted 90 days after the trip."
        answer:
          type: string
          description: >-
            Present when answered: `yes` or `no`, one of `options` as the
            listing wrote it, or the traveller's own words.
        answeredAt: { type: string, format: date-time }

    BookingAnswer:
      type: object
      additionalProperties: false
      required: [questionId, answer]
      properties:
        questionId:
          type: string
          description: The `id` of one of the listing's `questions`.
        answer:
          type: string
          maxLength: 300
          description: >-
            `yes` or `no` for a `yes_no` question, one of `options` for a
            `choice` question, and up to 300 characters for `short_text`, with
            no phone number, email address or link in it. At checkout such an
            answer refuses the checkout with its reason; see `answers`.

    BookingAnswersInput:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/BookingAnswer" }

    Screening:
      type: object
      additionalProperties: false
      description: >-
        The two safety gates, both enforced when the reservation is created
        rather than checked at the jetty. Read `safety` on the experience detail
        to know whether this listing asks for either.


        **A declared condition takes no money and holds no seat.** The whole
        transaction rolls back: no hold, no payment order, nothing to refund. A
        refund afterwards is worse for everybody than a conversation beforehand,
        and somebody who has already paid is somebody who will argue to be
        allowed in the water — which puts the operator in the position of
        refusing a paying customer at the jetty.
      properties:
        declaredClear:
          type: boolean
          description: >-
            The lead traveller's answer to the whole screener, on behalf of the
            party. **Omitted is not `false`** — a listing that asks and receives
            nothing answers `400 screening_required`, because a default here is
            an answer nobody gave. `false` answers `409
            screening_needs_a_doctor` and books nothing.


            Only the boolean, the screener version and a timestamp are stored.
            No conditions, no names, no free text — which is what lets that
            record be unencrypted. The per-diver medical form is a separate,
            encrypted thing taken privately before the dive.
        ageBands:
          type: array
          description: >-
            One band per participant, in party order, required when the listing
            states a `minAge`. A band rather than a date of birth: a band is
            enough to enforce a minimum age and is not identifying.


            Checked against the FLOOR of the band. Somebody in `12_14` could be
            12, so a 14+ experience refuses them — comparing the top of the band
            would admit exactly the person the rule exists to stop.
          items:
            type: string
            enum: [under_10, 10_11, 12_14, 15_17, 18_plus]

    Attribution:
      type: object
      additionalProperties: false
      description: >-
        Where this checkout came from. Optional, client-claimed, and trusted for
        nothing — it decides no price, no eligibility and no permission, which is
        what makes accepting it from an anonymous caller safe. A client that lies
        here corrupts only its own marketing numbers.


        Frozen at checkout alongside the price and the policy, and inherited by
        the booking at capture rather than re-read. At capture the traveller is
        arriving back from a payment provider's redirect, so anything read then
        would attribute every booking to the provider.


        Not part of the idempotency fingerprint: a retry with the same key
        replays the first reservation and its attribution, whatever this field
        says, so a retry cannot re-attribute a booking that already exists.
      properties:
        source:
          type: string
          enum: [qr, direct, search, social, referral, operator, host, web, unknown, creator]
          description: >-
            `host` and `operator` are the same source (D-049) and either is
            accepted.


            Anything outside this set is stored as `unknown` rather than
            rejected — a checkout must not fail over a marketing field.


            `creator` is a traveller's own link; `scanCode` names it. It is
            kept only when `scanCode` is an active creator link that is not
            the booker's own (by account or by contact number); otherwise
            the checkout is stored as `direct` with no code, and is never
            refused for it.


            `web` is **our own marketing site**, and is deliberately not
            `referral`, which means somebody else's site, nor `direct`, which
            means the address was typed. A person who read `yuvoy.in` and tapped
            through did neither, and filing them under either name makes the
            funnel unreadable a quarter later.
        placement:
          type: string
          maxLength: 120
          description: Which card, which boat, which door.
        campaign: { type: string, maxLength: 120 }
        scanCode:
          type: string
          maxLength: 32
          description: >-
            The printed code they arrived from, if any. The code, not a scan id:
            an id the client keeps and sends back is exactly the correlatable
            token POST /scans refuses to mint.
        landingPath:
          type: string
          maxLength: 256
          description: >-
            First page of the visit. The checkout path is not accepted here — we
            already know it for certain, and asking for a fact we hold is how the
            two come to disagree.

    ReservationContact:
      type: object
      # Name and a WhatsApp number, and nothing else required. Minimal by
      # design: it is what puts someone on a boat and tells them where to be,
      # and every extra field costs conversions on the one funnel there is.
      #
      # Not listed in `required` since 2026-09-13, because a signed-in checkout
      # may leave both out (see createReservation). A guest checkout still must
      # send both, and is refused with a 400 naming the field when it does not.
      description: >-
        `name` and `whatsapp` are required for a guest checkout. Signed in with a
        travellerSession, both may be omitted and `whatsapp` is ignored.
      properties:
        name:
          type: string
          maxLength: 120
          description: Required for a guest. Signed in, defaults to the profile name, then the newest booking's name.
        whatsapp:
          type: string
          description: "E.164, e.g. +919000000000. Required for a guest. Ignored when signed in: the session's number is used."
        email: { type: string, description: "Optional. Signed in and left out, the profile email is used when there is one." }
        marketingConsent:
          type: boolean
          description: >-
            A separate, unticked question at checkout. **Omit it if you did not
            ask** — absent and `false` mean different things and both are
            recorded as such.


            absent = never asked · `false` = asked and declined · `true` =
            asked and agreed.


            Collapsing absent into `false` would make every client that omits
            the field look like a refusal, and would erase the difference
            between "we never asked" and "they said no" — which is precisely
            the question a DPDP request asks of us.


            The moment it was given is recorded server-side from the database
            clock, never from anything you send: a consent record whose date
            the caller chooses is not evidence.


    Reservation:
      type: object
      required: [reservationId, state, guests]
      properties:
        reservationId: { type: string }
        state:
          type: string
          enum: [pending_request, active]
          description: >-
            `active` holds seats until `holdExpiresAt`. `pending_request` holds
            none and waits on the operator until `requestExpiresAt`.
        guests: { type: integer }
        holdExpiresAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Set for allotment holds only. At checkout this is about ten minutes
            away. A request accepted later by the operator gets its own, longer
            hold, read from the booking status.
        requestExpiresAt:
          type: [string, "null"]
          format: date-time
          description: Set for operator requests only.
        statusToken:
          type: string
          description: >-
            Returned once per answer. Only its hash is stored; it cannot be
            recovered afterwards. A retry with the same `Idempotency-Key` carries
            a fresh one for the same booking, and the first keeps working; it is
            an empty string when the booking's links were revoked, have
            expired, or 20 are already live. Carry it in a URL fragment, never a path or query: this
            API logs request URIs.

    PaymentOrder:
      type: object
      required: [state, orderId, providerOrderId, provider, amountPaise, currency, expiresAt]
      properties:
        state:
          type: string
          enum: [ready]
          description: >-
            Always `ready` on a 201. Present so a client switches on one field
            across both responses rather than inferring from the status code.
        orderId: { type: string, description: Ours. }
        providerOrderId:
          type: string
          description: >-
            The provider's own order id, for their checkout widget.
        provider: { type: string }
        amountPaise:
          type: integer
          description: >-
            INR paise. Integer — there are no fractional paise.
        currency: { type: string }
        expiresAt:
          type: string
          format: date-time
          description: >-
            The hold's deadline, not a separate payment clock, so it can be
            hours away when the hold came from an accepted request. Paying after it
            may still succeed — the capture re-acquires capacity — but the seat
            is no longer reserved and the booking can be declined with a full
            automatic refund.
        payAtCounter:
          description: >-
            Present **alongside** a live payment order, not only in its absence.
            On a jetty in the Andamans cash is not a fallback for when the card
            machine is broken; it is how people pay, and a traveller with no card
            or no signal at the moment they decide is not an edge case.


            Absent means cash is not on offer for this reservation. Offer it as a
            real second choice rather than hiding it behind the card flow.
          type: object
          required: [available, confirmAt]
          properties:
            available: { type: boolean }
            confirmAt:
              type: string
              description: >-
                Path to POST to, relative to the API base — the same path as
                `POST /reservations/{id}/cash-booking`, so it carries no `/v1` of
                its own.

    ReelViewEvent:
      type: object
      description: One view of one reel.
      required: [eventId, reelId, watchedMs, completed, viewedAt]
      properties:
        eventId:
          type: string
          format: uuid
          description: >-
            Minted by the app once per view and kept with it until a call
            carrying it succeeds. The same id sent again is the same view.
        reelId:
          type: string
          format: uuid
          description: The feed card's `media.id`.
        experienceId:
          type: string
          format: uuid
          description: >-
            Optional. The feed card's `experience.id`, when the app knows which
            listing the reel was shown with. A reel can be published on more
            than one listing; without this the view counts against the listing
            `GET /reels/{id}` opens it with.
        watchedMs:
          type: integer
          minimum: 0
          maximum: 600000
          description: How long the reel played in this view, in milliseconds, across loops.
        completed:
          type: boolean
          description: Whether the reel played to its end at least once in this view.
        viewedAt:
          type: string
          format: date-time
          description: >-
            When the view started, RFC 3339 with an offset. No more than 5
            minutes ahead of the server's clock and no more than 24 hours
            behind it.
    ReelItem:
      type: object
      description: >-
        One reel and the listing it sells: the item `GET /reels` pages, and
        what `GET /reels/{id}` returns.
      required: [media, experience]
      properties:
        media: { $ref: "#/components/schemas/Media" }
        experience: { $ref: "#/components/schemas/ExperienceSummary" }

    VocabularyTerm:
      type: object
      required: [key, label]
      properties:
        key: { type: string, description: What to send. }
        label: { type: string, description: What to show. }

    ActivityTypeTerm:
      type: object
      required: [key, label, category]
      properties:
        key: { type: string, examples: ["scuba"] }
        label: { type: string, examples: ["Scuba diving"] }
        category: { $ref: "#/components/schemas/Category" }

    ReelPage:
      type: object
      required: [items, complete]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              media: { $ref: "#/components/schemas/Media" }
              experience: { $ref: "#/components/schemas/ExperienceSummary" }
        complete:
          type: boolean
          description: >-
            Told rather than inferred. `false` with no `nextCursor` means the
            server stopped, which is a different thing from the grid having
            ended.
        nextCursor:
          type: string
          description: Absent when there is nothing after this page.

    OperatorProfile:
      type: object
      required:
        [id, slug, name, verified, bookable, listingCount, reelCount, listings, reels]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        verified:
          type: boolean
          description: >-
            True only when EVERY visible listing of theirs is — every mandatory
            credential on file, verified and unexpired. Stated across the
            business rather than per listing on purpose: an operator whose
            diving licence has lapsed must not collect a badge from a listing
            that needs no licence. A statement about evidence we hold, not a
            reputation score.
        bookable:
          type: boolean
          description: >-
            Whether anything of theirs can be bought right now. `false` is a
            real, renderable state — a business that has paused is still a
            business somebody was linked to, so render the page and say so.
        logoUrl:
          type: string
          description: >-
            Absent when they have not set one. Fall back to your own placeholder
            rather than rendering a broken image.
        about:
          type: string
          description: >-
            What this business says about itself, 40 to 600 characters. **Absent
            when they have not written one** — render nothing rather than an
            empty "About" heading, which on a trust surface reads as a business
            that could not be bothered rather than one that has not got to it.
        operatingSince:
          type: integer
          description: >-
            The year they started. Sits beside the verified badge and is read as
            something we checked, which is why an operator cannot restate it in
            place — it changes through review.
        languages:
          type: array
          description: >-
            What the crew speaks. On these islands it is often the deciding fact
            for a traveller who is nervous in the water.
          items: { type: string }
        findThemAt:
          type: string
          description: >-
            Where a traveller physically goes. **Not the registered address** —
            that is compliance data and is frequently an accountant's office on
            a different island. Also not the meeting point, which belongs to a
            listing and can differ per experience.
        photos:
          type: array
          description: >-
            Up to five photographs **of the operation** — the boat, the shop,
            the crew. Deliberately not the experience: that is what the reels
            are, and a gallery standing in for footage is the failure a
            video-first feed exists to prevent.
          items: { type: string }
        locations:
          type: array
          description: The destinations they run in, from their own listings.
          items: { type: string }
        listingCount: { type: integer }
        reelCount: { type: integer }
        listings:
          type: array
          items:
            type: object
            required: [experience, bookable]
            properties:
              experience: { $ref: "#/components/schemas/ExperienceSummary" }
              bookable:
                type: boolean
                description: >-
                  Per listing, and projected rather than filtered on: a listing
                  that has stopped selling says "not available" rather than
                  vanishing. Truer here than anywhere — somebody sent this link
                  is looking for a specific thing they saw.
        reels:
          allOf:
            - $ref: "#/components/schemas/ReelPage"
          description: The first screen of the grid. Page it at /operators/{slug}/reels.

    CashBooking:
      type: object
      required: [bookingReference, state, payAtCounterPaise, currency]
      properties:
        bookingReference:
          type: string
          description: >-
            `YV-XXXXXXXX`. The one thing the traveller has to be able to say out
            loud at a jetty, so the alphabet excludes the letters people mishear.
        state:
          type: string
          enum: [paid_pending_ops]
          description: >-
            Committed, and nobody has been paid yet. The booking holds the seat
            from this moment; the state changes to `confirmed` when the operator
            records taking the cash.
        payAtCounterPaise:
          type: integer
          description: >-
            What to bring, in INR paise. The price agreed at checkout, not a
            fresh read of the listing. Named for what the traveller does rather
            than for what our ledger calls it — this money never reaches us, so
            calling it an amount due would be wrong in both directions.
        currency: { type: string }

    BookingStatus:
      type: object
      required: [reservationId, state, final, guests, experience, slot, price, review]
      properties:
        reservationId: { type: string }
        state:
          type: string
          enum:
            - holding
            - awaiting_operator
            - awaiting_host
            - expired
            - released
            - verifying
            - confirmed
            - declined
            - cancelled
            - completed
            - no_show
          description: >-
            `awaiting_host` is the D-049 name of `awaiting_operator`, listed so
            clients accept it; the API sends the old one until the traveller
            cut-over.


            Computed server-side from the reservation, fulfilment, payment and
            refund machines. Never stored, and never to be derived client-side.


            `verifying` means money may have moved and the outcome is not yet
            settled. **Never render it as failure** — "if money left your
            account it is safe" is the only honest copy for that window. It is
            also what the server says when a booking exists but is not yet
            visible: claiming a confirmed seat we cannot prove is the one thing
            this endpoint must never do.


            A **cash** booking reads `confirmed` as soon as it is made, never
            `verifying`: the seat was taken against a live hold and is the
            traveller's, and no money has moved to wait on. What they still owe
            the operator is in `payment` (D-034).


            `declined` means money was taken and the seat could not be
            delivered; a full refund is already recorded and `refund` carries
            where it is.
        final:
          type: boolean
          description: >-
            `true` when this state cannot change on its own — stop polling.
        holdExpiresAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Present only while `state` is `holding`. Absent once the deadline is
            meaningless, so a countdown is never rendered beside a dead booking.


            **Not always minutes away.** A hold taken at checkout runs about ten
            minutes. A hold that comes from an operator accepting a request runs
            twelve hours, or until the departure's booking cutoff if that is
            sooner (yuvoy-api#203), so it can end tomorrow morning. Show a
            deadline that far off as a time, with the day when it is not today
            in the trip's market, rather than as a ticking count of minutes.
        guests: { type: integer }
        contactName:
          type: string
          description: >-
            The name given at checkout. The phone number and email are
            deliberately not returned: whoever holds this link is usually the
            person who supplied them, and "usually" is not an access rule.
        experience:
          type: object
          required: [slug, title, operator, hostName, operatorSlug, hostSlug, heroImageUrl]
          properties:
            slug: { type: string }
            title: { type: string }
            operator: { type: string, deprecated: true, description: The old name of `hostName`; sent beside it until the traveller cut-over (D-049). }
            hostName: { type: string }
            operatorSlug: { type: string, deprecated: true, description: The old name of `hostSlug`; sent beside it until the traveller cut-over (D-049). }
            hostSlug:
              type: string
              description: The business, for linking to its page.
            heroImageUrl:
              type: [string, "null"]
              format: uri
              description: >-
                The listing's headline picture, resolved as the catalog resolves
                `heroMedia`. `null` when the listing has none; always sent.
        slot:
          type: object
          required: [startsAt, timezone]
          properties:
            startsAt: { type: string, format: date-time }
            timezone:
              type: string
              description: IANA zone of the market, for rendering local time.
        price:
          type: object
          required: [totalPaise, currency]
          properties:
            totalPaise:
              type: integer
              description: >-
                From the price snapshot frozen at checkout, not the live
                listing — an operator editing a price cannot restate what this
                traveller agreed to.
            currency: { type: string }
        bookingReference:
          type: string
          description: >-
            Present once a booking exists. Human-quotable and **not a
            credential** — it goes on the operator's manifest and is read aloud
            on a jetty.
        checkIn:
          type: object
          additionalProperties: false
          required: [code, link, validOn]
          description: >-
            What to show at the meeting point. Present only for a booking whose
            state is confirmed (a cash booking to pay on the day included) or
            verifying (a card payment still settling), and whose business
            checks people in by code. The QR encodes
            `link`. Never the status token, and never on the booking pass image.
          properties:
            code:
              type: string
              pattern: "^[2-9A-HJKMNP-Z]{4}-[2-9A-HJKMNP-Z]{4}$"
              example: K7QM-2XPA
            link:
              type: string
              format: uri
              example: "https://operators.yuvoy.in/check-in#YV-7K2Q4BCD.K7QM2XPA"
            validOn:
              type: string
              format: date
              description: The departure's day in its market. The code also works the day before.
            checkedInAt:
              type: string
              format: date-time
              description: Present once the code has been used.
        meetingPoint:
          type: object
          description: >-
            Where the day starts. This is the screen a traveller opens on the
            morning of the trip and it was the one screen without it — both
            `/trips/{token}` and `/me/bookings` already carried it.
          properties:
            text: { type: string }
            landmark: { type: string }
        cancellation:
          type: object
          description: >-
            Why the trip is off. Present only when it is. The app was hedging
            with "if the sea called it off", which is a guess dressed as
            information and the wrong guess for anything cancelled otherwise.
          properties:
            reasonCode: { type: string }
            message:
              type: string
              description: >-
                Why it is off, written for the traveller. **Render it verbatim;
                do not build one from `reasonCode`.**


                Present only when this booking is a 2B request an operator
                turned down, and the code above is that decline's own. One of
                six sentences, decided by the API so that this page and the
                message sent to the traveller's phone cannot say different
                things about one decision. It names no person, carries no code,
                and always states that nothing was charged, because a request
                never takes money and "declined" on its own reads as a charge
                to go and check.


                Absent for a departure called off or a booking cancelled: those
                reason codes are a different vocabulary with no traveller
                wording behind them.
              examples: ["The operator is full on that departure. Nothing was charged."]
            nextDeparture:
              type: object
              description: >-
                The same listing's next departure the traveller could book right
                now, offered alongside the decline.


                **Absent means there is nothing else on sale in the next 90
                days** — not "we did not check". Present only with `message`.
                Read from the same view the feed and availability read, so it is
                never a date checkout would then refuse. Bounded at 90 days for
                the reason `nextAvailable` is: a departure in March is not usable
                by somebody with three days on an island.
              required: [date, startsAt, timezone, bookUrl]
              properties:
                date:
                  type: string
                  format: date
                  description: >-
                    The departure's day in the MARKET's timezone, not a UTC one.
                    A 06:00 Andaman departure falls on the previous UTC day, and
                    an offer naming the wrong day is worse than no offer.
                startsAt:
                  type: string
                  format: date-time
                  description: When it leaves, in UTC, for printing a time.
                timezone:
                  type: string
                  description: The market's IANA zone, the one `date` is in.
                  examples: ["Asia/Kolkata"]
                bookUrl:
                  type: string
                  format: uri
                  description: >-
                    Where to book this listing again. The public listing page,
                    the same link a lapsed hold is sent.
        requestExpiresAt:
          type: string
          format: date-time
          description: >-
            When an unanswered request lapses — "answer by". Since 2026-09-13
            this is the departure's booking cutoff, which can be days away, so
            show it as a date and time rather than a countdown. The creation
            response carried this and the status page could not show it, so a
            traveller waiting had no idea how long for. Absent once the booking
            is final.
        operatorUpdates:
          type: array
          deprecated: true
          description: >-
            The old name of `hostUpdates`, the same list, sent beside it until
            the traveller cut-over (D-049).


            What the host has told everybody on this departure: a time
            change, a meeting point, a weather watch. Absent when there are
            none; the key is omitted rather than sent empty.


            This is where a relay note lands. Free text an operator writes is
            shown HERE and never sent to a phone, so a traveller who is told
            "see your booking page" has somewhere to look.
          items:
            type: object
            required: [kind, from, sentAt]
            properties:
              kind:
                type: string
                enum: [time_change, meeting_point_change, weather_watch, bring_item, note]
                description: What sort of update this is.
              from:
                type: string
                description: >-
                  Who sent it: the business's display name. An update about
                  somebody's morning that appears from nobody is not reassuring.
              intent:
                type: string
                deprecated: true
                enum: [time_change, meeting_point_change, weather_watch, bring_item, note]
                description: >-
                  Never emitted. This document named the field `intent` while
                  the server has always sent `kind`; read `kind`.
              detail: { type: string }
              note: { type: string }
              sentAt: { type: string, format: date-time }
        hostUpdates:
          type: array
          description: >-
            What the host has told everybody on this departure: a time change,
            a meeting point, a weather watch. Absent when there are none; the
            key is omitted rather than sent empty. The same list as the old
            `operatorUpdates`.


            This is where a relay note lands. Free text a host writes is shown
            HERE and never sent to a phone, so a traveller who is told "see your
            booking page" has somewhere to look.
          items:
            type: object
            required: [kind, from, sentAt]
            properties:
              kind:
                type: string
                enum: [time_change, meeting_point_change, weather_watch, bring_item, note]
                description: What sort of update this is.
              from:
                type: string
                description: >-
                  Who sent it: the business's display name. An update about
                  somebody's morning that appears from nobody is not reassuring.
              detail: { type: string }
              note: { type: string }
              sentAt: { type: string, format: date-time }
        payment:
          type: object
          required: [method, collected, amountPaise]
          description: >-
            Present only for a booking paid in cash at the counter: what the
            traveller still owes the operator, and whether it has been taken. A
            card booking carries no `payment`.


            Render it beside `confirmed` — the seat is booked, and this is what to
            bring on the day (D-034).
          properties:
            method:
              type: string
              enum: [cash]
            collected:
              type: boolean
              description: "`true` once the operator has recorded taking the cash."
            amountPaise:
              type: integer
              description: >-
                What to bring, from the price frozen at checkout — the same
                number as `price.totalPaise`.
        questions:
          type: array
          description: >-
            The questions this listing asks and what this party answered. Absent
            when the listing asks nothing and nothing was answered. A question
            with `answered: false` has no answer on record; answer it with
            `POST /bookings/answers` while `answersOpen` is `true`. Answers are
            deleted 90 days after the trip, as `PartyQuestion` describes, and
            `questions` is then absent if the listing no longer asks anything.
          items: { $ref: "#/components/schemas/PartyQuestion" }
        answersOpen:
          type: boolean
          description: >-
            Present with `questions`. `true` while `POST /bookings/answers` will
            take an answer: the booking is going ahead and its departure has not
            left. Told rather than inferred, so a form is never offered that
            would be refused.
        refund:
          type: [object, "null"]
          description: >-
            Present only when a refund exists, so the happy path carries no
            alarming vocabulary. Answers the only question a declined or
            cancelled traveller has: where is my money.
          properties:
            amountPaise: { type: integer }
            state:
              type: string
              enum: [requested, pending, failed, processed, reversed, abandoned]
            message:
              type: string
              description: Ready-to-render copy for the current refund state.
        support:
          allOf: [{ $ref: "#/components/schemas/SupportContact" }]
          description: >-
            How to reach a person, the same as on `getMyAccount`, so a traveller
            on a booking link who never signed in can still "Chat with us".
            Always sent (since 2026-09-13); `whatsappE164` is null while there is
            no support number, and the button is hidden then.
        review:
          type: object
          required: [reviewed, canReview]
          description: >-
            Whether to offer "how did it go". Always sent. `canReview` is true
            for a `completed` trip with no review that ended no more than 30
            days ago, which is exactly when `leaveReview` accepts one.
          properties:
            reviewed: { type: boolean }
            canReview: { type: boolean }
            rating:
              type: integer
              minimum: 1
              maximum: 5
              description: The stars given. Present only once reviewed.

    BookingMessage:
      type: object
      required: [id, from, senderName, sentAt]
      properties:
        id:
          type: string
          description: Send it as `upTo` to mark this message and everything before it read.
        from:
          type: string
          enum: [traveller, operator, host]
          description: >-
            `traveller` is the person holding this link; `operator` is the
            business. `host` is the business's D-049 name, listed so clients
            accept it; the API sends `operator` until the traveller cut-over.
        senderName:
          type: string
          description: >-
            The name to show beside it: the name given at checkout on the
            traveller's messages, and the business's name on the business's.
        text:
          type: string
          description: >-
            What was written, trimmed, with its line breaks. Every message
            carries exactly one of `text` and `textRemovedAt`, and a message
            that was just sent always carries `text`.
        textRemovedAt:
          type: string
          format: date-time
          description: >-
            When the text was removed, a set time after the trip ended. Present
            only in place of `text`. Show the message as one whose text was
            removed, never as an empty message.
        sentAt: { type: string, format: date-time }

    BookingMessageThread:
      type: object
      required: [messages, complete, unreadCount, canWrite]
      properties:
        messages:
          type: array
          description: >-
            Oldest first within the page. The first page is the most recent
            messages.
          items: { $ref: "#/components/schemas/BookingMessage" }
        complete:
          type: boolean
          description: >-
            `true` when the conversation begins on this page. `false` always
            comes with a `nextCursor` for the messages before it.
        nextCursor:
          type: string
          description: Absent when nothing came before this page.
        unreadCount:
          type: integer
          description: Messages from the business the traveller has not marked read.
        canWrite:
          type: boolean
          description: Whether a message can be sent now.
        closedReason:
          type: string
          enum: [not_booked, cancelled, declined, window_closed]
          description: >-
            Present only when `canWrite` is `false`. `not_booked`: the link's
            hold or request never became a booking. `cancelled` and `declined`:
            the booking ended, and nothing reopens it. `window_closed`: the trip
            ended longer ago than messages stay open.
        writableUntil:
          type: string
          format: date-time
          description: >-
            When writing stops on its own, a set time after the trip ends.
            Present while the conversation is open and once that time has
            passed. Absent when there is no booking, or it was cancelled or
            declined.

    BookingMessageInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: The message. Trimmed, with its line breaks kept.

    BookingMessageReadInput:
      type: object
      required: [upTo]
      properties:
        upTo:
          type: string
          description: The `id` of the last message that was shown.

    BookingMessageReadReceipt:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          description: Messages from the business still unread after this.

    BookingInput:
      type: object
      required: [slotId, guests]
      properties:
        slotId: { type: string }
        guests: { type: integer, minimum: 1 }

    Booking:
      type: object
      required: [id, status, experienceSlug, slotId, guests, total, createdAt]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending_payment, confirmed, completed, cancelled, no_show]
        experienceSlug: { type: string }
        slotId: { type: string }
        guests: { type: integer }
        total: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }

    WaitlistInput:
      type: object
      required: [email]
      properties:
        name: { type: string, maxLength: 80 }
        email: { type: string, format: email }
        source: { type: string }

    WaitlistEntry:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        createdAt: { type: string, format: date-time }

    # ---- Pre-launch lead capture -------------------------------------------
    # Geography is deliberately generic. `marketKey` names a launch market and
    # a destination key is "<market>/<destination>". Andaman is the first
    # market, not the schema's boundary.

    LeadAudience:
      type: string
      description: >
        Which side of the marketplace the contact is. `provider` matches the
        existing `User.role` and `Provider` vocabulary in this contract.
      enum: [traveller, provider]

    PlaceList:
      type: object
      additionalProperties: false
      required: [markets]
      properties:
        markets: { type: array, items: { $ref: "#/components/schemas/PlaceMarket" } }

    PlaceMarket:
      type: object
      additionalProperties: false
      required: [key, name, mode, timezone, currency, destinations]
      properties:
        key: { $ref: "#/components/schemas/MarketKey" }
        name: { type: string, examples: ["Andaman Islands"] }
        mode: { type: string, enum: [bookable, discover] }
        timezone: { type: string, description: "IANA zone every local time in this market is shown in." }
        currency: { type: string, minLength: 3, maxLength: 3 }
        destinations: { type: array, items: { $ref: "#/components/schemas/PlaceDestination" } }

    PlaceDestination:
      type: object
      additionalProperties: false
      required: [key, name, kind, visibleTo]
      properties:
        key: { $ref: "#/components/schemas/DestinationKey" }
        name: { type: string, examples: ["Havelock (Swaraj Dweep)"] }
        kind: { type: string, enum: [local, travel] }
        visibleTo:
          type: string
          enum: [staff, early, all]
          description: Always `all` here; `listMyPlaces` also returns places still opening.

    FoundItemList:
      type: object
      required: [place, items, complete, understood]
      properties:
        place: { $ref: "#/components/schemas/ExplorePlace" }
        items: { type: array, items: { $ref: "#/components/schemas/FoundItem" } }
        complete: { type: boolean, description: "Told rather than inferred, as on `listReels`." }
        nextCursor: { type: string, description: Absent when there is nothing after this page. }
        window:
          type: object
          required: [from, to]
          description: Present only when the `when` parameter applied. Local dates in the place's zone, both included, for the heading.
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        understood:
          type: array
          maxItems: 12
          description: >-
            What the words of `q` were taken to mean, in the order typed. Empty without `q` and while
            `checkedCities` is not open to the caller. Every chip narrows the list except `place`.
          items: { $ref: "#/components/schemas/UnderstoodChip" }

    UnderstoodChip:
      type: object
      required: [kind, value, label, from]
      properties:
        kind: { type: string, enum: [department, when, free, place] }
        value:
          type: string
          description: >-
            A `Category` key for `department`; `today`, `tomorrow`, `weekend` or a weekday (`monday` to
            `sunday`) for `when`; `true` for `free`; a `DestinationKey` for `place`, which opens that place.
        label: { type: string, description: "English chip text, verbatim: `Adventure`, `Saturday`, `Free`, `Bengaluru`." }
        from: { type: string, maxLength: 40, description: "The word of `q` that matched. Send it in `asText` to search it as plain text." }

    TableSeatState:
      type: string
      enum: [requested, approved, declined, withdrawn, removed]
      description: >-
        `requested` waits for the Yuvoy team; `approved` has a seat;
        `declined` and `removed` were turned down by the team; `withdrawn` was
        taken back by the traveller.
    TableCard:
      type: object
      required: [id, title, destinationKey, venueKind, venueArea, startsAt, endsAt, timeZone, gettingHome, seatsMax,
                 seatsTaken, full, womenOnly, leader]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        about: { type: string }
        destinationKey: { type: string }
        venueKind: { type: string, enum: [cafe, restaurant, park, event_venue, community_space, other_public] }
        venueArea: { type: string, description: 'The area only, such as "Indiranagar". The venue comes with approval.' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timeZone: { type: string, description: "The place's time zone, such as Asia/Kolkata." }
        gettingHome: { type: string, description: How guests get home at the end. }
        costNote: { type: string }
        seatsMax: { type: integer, minimum: 4, maximum: 8 }
        seatsTaken: { type: integer, description: "Approved guests. The leader is not counted. May read as full to a caller for reasons the server does not give." }
        full: { type: boolean }
        womenOnly: { type: boolean }
        leader:
          type: object
          required: [kind, firstName]
          description: Who leads the table, a person from the Yuvoy team or from a partner club.
          properties:
            kind: { type: string, enum: [team, partner_club] }
            firstName: { type: string }
            clubName: { type: string, description: Only when a partner club leads it. }
        event:
          type: object
          required: [id, title]
          description: The event the table is around, when there is one.
          properties: { id: { type: string, format: uuid }, title: { type: string } }
        experience:
          type: object
          required: [slug, title]
          properties: { slug: { type: string }, title: { type: string } }
        requestsCloseAt: { type: string, format: date-time }
        myRequest:
          type: object
          required: [state]
          description: The caller's latest request at this table. Only with a session.
          properties: { state: { $ref: "#/components/schemas/TableSeatState" } }
    TableView:
      allOf:
        - { $ref: "#/components/schemas/TableCard" }
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [listed, in_review, cancelled, ended]
              description: >-
                `listed` while it shows; `in_review` while the Yuvoy team checks
                a change; `cancelled` by the team; `ended` once its end time
                has passed. In review and cancelled carry no venue and no
                number for the day.
            whoIsGoing:
              type: array
              items: { type: string }
              description: >-
                First names of approved guests, only to somebody with a live
                request or seat. On a women-only table, only to approved
                guests: a request alone sees `seatsTaken`. An approved guest the
                caller has blocked, or who blocked the caller, is `A guest`.
            venue:
              type: object
              description: >-
                Only to an approved guest, while the table is listed and for 30
                days after it ended.
              required: [name, address, meetingPoint]
              properties:
                name: { type: string }
                address: { type: string }
                mapUrl: { type: string }
                meetingPoint: { type: string }
            dayOfContact:
              type: string
              description: >-
                The Yuvoy team's number for the day, under the same rule as
                `venue`. Absent when no support number is set up.
    TableList:
      type: object
      required: [items, complete]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TableCard" } }
        complete: { type: boolean, description: "Told rather than inferred, as on `listReels`." }
        nextCursor: { type: string, description: Absent when there is nothing after this page. }
    MyTables:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TableView" } }
    TableSeatRequest:
      type: object
      additionalProperties: false
      properties:
        confirmWomenOnly: { type: boolean, description: Must be true for a women-only table. }
        firstName: { type: string, maxLength: 30, description: Only when the profile has no first name that can be shown. }
    TableReport:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [unsafe, harassment, not_as_described, spam, other] }
        personName: { type: string, maxLength: 30, description: The first name of somebody at the table the report is about. }
        note: { type: string, maxLength: 300, description: Read by Yuvoy staff only. }

    ExplorePlace:
      type: object
      required: [key, name, regionName, kind, timezone]
      properties:
        key: { $ref: "#/components/schemas/DestinationKey" }
        name: { type: string, examples: [Hyderabad] }
        regionName: { type: string, examples: [Telangana] }
        kind: { type: string, enum: [local, travel] }
        timezone: { type: string, examples: [Asia/Kolkata] }

    FoundItem:
      type: object
      required: [id, kind, department, title, when, where, price, status, check]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [event, recurring_event, activity] }
        department:
          anyOf: [{ $ref: "#/components/schemas/Category" }, { type: "null" }]
          description: Null when the finder could not tell; it then matches no department filter.
        title: { type: string, maxLength: 200 }
        when:
          type: object
          required: [startsOn, startTime, endsOn, repeats]
          properties:
            startsOn: { type: [string, "null"], format: date, description: "Local date in the place's zone; null when undated." }
            startTime: { type: [string, "null"], pattern: "^[0-2][0-9]:[0-5][0-9]$" }
            endsOn: { type: [string, "null"], format: date }
            repeats: { type: [string, "null"], maxLength: 200, description: "As the source states it, like `Every Sunday`." }
        where:
          type: object
          required: [placeText, town]
          properties:
            placeText: { type: [string, "null"], maxLength: 200, description: "The venue, or the address when no venue is named." }
            town: { type: string }
        price: { $ref: "#/components/schemas/FoundItemPrice" }
        status: { type: string, enum: [scheduled, cancelled, postponed, moved, sold_out, ended] }
        check: { $ref: "#/components/schemas/FoundItemCheck" }
        seeDetailsUrl: { type: string, format: uri, description: "http or https only, and never a host on the finder's blocked list; absent when there is no safe link." }
        imageUrl:
          type: string
          format: uri
          description: >-
            The picture the card's organiser added, once staff approved it
            (R11-T2): the `card` size on a list, a going or a save, and the
            `hero` size on `getEvent`. Absent when there is none; draw the
            department's art then.

    FoundItemPrice:
      type: object
      required: [kind, from, text]
      properties:
        kind: { type: string, enum: [free, paid, unknown], description: "`free` only when the source states it; a missing price is `unknown`." }
        from: { anyOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        text: { type: string, description: "Words to show, verbatim." }

    FoundItemCheck:
      type: object
      required: [tier, label, checkedAt, lapsed, sourceName, sourceUrl]
      properties:
        tier: { type: string, enum: [found, staff_checked, organiser_confirmed] }
        label:
          type: string
          description: >-
            The trust line, verbatim; never replaced by an icon. One of: "Being re-checked · details
            may have changed" (a checked card whose page changed or went); "Last checked by Yuvoy {n}
            days ago", "today" or "yesterday" (lapsed); "Confirmed with the organiser · {date}";
            "Checked by Yuvoy · {date}", with how it was checked when known ("· organiser's page",
            "· in person", "· venue's page", "· ticket page", "· official notice", "· group's
            calendar"); or "Found by Trigo · not checked yet", with its source.
        checkedAt: { type: [string, "null"], format: date-time, description: "The latest person check, if any." }
        lapsed: { type: boolean, description: "A person checked it and that check no longer counts, or it is a weekend card in a home city not checked again since Monday. Such a weekend card keeps its checked tier." }
        rechecking: { type: boolean, description: "True while Yuvoy re-checks a checked card whose page changed or went. Absent means false." }
        sentence: { type: [string, "null"], description: "On getEvent only: the card page's sentence about the check, verbatim. Absent when there are no words for the case yet." }
        sourceName: { type: [string, "null"], examples: [example.in], description: "Null when no source page may be linked." }
        sourceUrl: { type: [string, "null"], format: uri, description: "http or https, never a blocked host; null when there is none." }

    FoundItemDetail:
      allOf:
        - { $ref: "#/components/schemas/FoundItem" }
        - type: object
          required: [place, summary, organiser, sources, indexable, stated, claimable]
          properties:
            place: { $ref: "#/components/schemas/ExplorePlace" }
            summary: { type: [string, "null"], description: Our words; null unless a person has ever checked the item. }
            organiser: { type: [string, "null"] }
            sources: { type: array, items: { type: object, required: [name, url], properties: { name: { type: string }, url: { type: string, format: uri } } } }
            indexable: { type: boolean, description: "A checked, live item in a place open to all while `explore` is `all`." }
            stated:
              $ref: "#/components/schemas/StatedFacts"
            claimable:
              type: boolean
              description: >-
                True when an organiser may claim this event now: it has no organiser, no
                claim is waiting on it, and its facts fit an organiser's post
                (claimEventForOrganiser). Always false for a caller who is signed out.

    StatedFacts:
      type: object
      additionalProperties: false
      description: >-
        What the item's page states, each only as the page states it; nobody checked it. Always present,
        whatever the `checkedCities` stage: show the block only while `checkedCities` is open to the caller.
      required: [endTime, setting, suits, difficulty, venueType, included, goodToKnow]
      properties:
        endTime:
          type: [string, "null"]
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          description: Local time, only as the page states it, nobody checked it. Null on a multi-day item.
        setting:
          type: [string, "null"]
          enum: [indoor, outdoor, both, null]
          description: Only as the page states it, nobody checked it.
        suits:
          type: array
          uniqueItems: true
          items: { type: string, enum: [solo, couples, friends, families, kids] }
          description: Only as the page states it, nobody checked it, in this order. Empty when the page states none.
        difficulty:
          type: [string, "null"]
          enum: [easy, moderate, hard, null]
          description: Only as the page states it, nobody checked it. Null on a card no person has checked, even when the page states one.
        venueType:
          type: [string, "null"]
          maxLength: 40
          description: Only as the page states it, nobody checked it, like `rooftop cafe`.
        included:
          type: [string, "null"]
          maxLength: 300
          description: Only as the page states it, nobody checked it.
        goodToKnow:
          type: [string, "null"]
          maxLength: 300
          description: Only as the page states it, nobody checked it. Null on a card no person has checked, even when the page states one.

    FoundItemIndex:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [id, destinationKey, lastModified]
            properties:
              id: { type: string, format: uuid }
              destinationKey: { $ref: "#/components/schemas/DestinationKey" }
              lastModified: { type: string, format: date-time }

    EventReport:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [wrong_date, wrong_place, wrong_price, cancelled, broken_link, not_appropriate, other] }
        note: { type: string, maxLength: 500, description: "Required, 3 or more characters, when `reason` is `other`." }

    EventReportReceipt:
      type: object
      required: [hidden, message]
      properties:
        hidden: { type: string, enum: [everyone, you], description: "`you`: hide the card on this device." }
        reference: { type: string, examples: [SR-3F9A12C0], description: "Only for a signed-in reporter." }
        message: { type: string, description: "Words to show, verbatim." }

    EventSubmissionInput:
      type: object
      additionalProperties: false
      description: >-
        One event from its organiser. `isFree: true` takes no price; `isFree:
        false` needs `priceFrom`, and `priceTo` is at least `priceFrom`. Prices
        are INR, from 100 to 10000000 paise (1 to 1,00,000 rupees).
      required: [destinationKey, title, department, startsOn, venue, isFree, officialUrl, organiserName, email, consent]
      properties:
        destinationKey: { $ref: "#/components/schemas/DestinationKey" }
        title: { type: string, minLength: 3, maxLength: 120 }
        department: { $ref: "#/components/schemas/Category" }
        startsOn: { type: string, format: date, description: "From the place's local today up to 365 days ahead." }
        startTime: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", description: "Local time, 00:00 to 23:59." }
        endsOn: { type: string, format: date, description: "On or after `startsOn`, at most 30 days after it." }
        endTime: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", description: "Local time, 00:00 to 23:59; after `startTime` on a one-day event." }
        venue: { type: string, minLength: 2, maxLength: 200 }
        address: { type: string, maxLength: 300 }
        isFree: { type: boolean }
        priceFrom: { $ref: "#/components/schemas/Money" }
        priceTo: { $ref: "#/components/schemas/Money" }
        officialUrl: { type: string, format: uri, maxLength: 2048, description: "The organiser's own page or the ticket page, http or https. Linked as it is." }
        summary: { type: string, maxLength: 500 }
        organiserName: { type: string, minLength: 2, maxLength: 200 }
        email: { type: string, maxLength: 254, description: "Where the code goes. Compared without regard to case and surrounding spaces. Never shown on Yuvoy." }
        consent: { const: true, description: "The sender organises the event, or has the organiser's permission to list it." }
        extra: { type: string, maxLength: 200, description: "Leave empty. The form keeps it off screen." }

    EventSubmissionReceipt:
      type: object
      required: [id, reference, codeSentTo, expiresAt, message]
      properties:
        id: { type: string, format: uuid, description: "For `resendEventSubmissionCode` and `verifyEventSubmission`." }
        reference: { type: string, pattern: "^ES-[0-9A-F]{8}$", examples: [ES-3F9A12C0] }
        codeSentTo: { type: string, examples: ["a•••@example.org"], description: "The email, masked: its first character and its domain." }
        expiresAt: { type: string, format: date-time, description: When the code stops working. }
        message: { type: string, description: "Words to show, verbatim." }
        devCode:
          type: string
          description: >-
            **Development only**, as on `requestTravellerSignIn`. Never present
            in production.

    EventSubmissionVerifyInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    EventSubmissionConfirmation:
      type: object
      required: [reference, state, message]
      properties:
        reference: { type: string, examples: [ES-3F9A12C0] }
        state: { type: string, enum: [submitted] }
        message: { type: string, description: "Words to show, verbatim." }

    OutcomeEvent:
      type: object
      required: [eventId, kind, subjectType, subjectId, surface, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/OutcomeKind" }
        subjectType: { type: string, enum: [experience, event] }
        subjectId: { type: string, format: uuid, description: "An experience id, or with subject `event` a found item id from `listEvents`." }
        surface: { $ref: "#/components/schemas/OutcomeSurface" }
        position: { type: integer, minimum: 0, maximum: 999, description: "Place in the list it was shown in, from 0." }
        occurredAt: { type: string, format: date-time, description: "On the server's clock, as reel views are." }

    OutcomeKind:
      type: string
      enum: [shown, opened, saved, shared, link_out, problem_reported]
      description: >-
        What a client may send. The log holds nine kinds from 0146 (REC-8): these six, and `going`, `went`,
        `rated`, which only the API writes (surface `record`, R4); a client that sends one of those has it
        dropped as `unknown_kind`. `problem_reported` is a person saying a found item is wrong, with subject
        `event`.

    OutcomeSurface:
      type: string
      enum: [feed, search, listing, saved, business, shared_link, found_feed, found_detail, trigo]
      description: >-
        Where it happened. `shared_link` is a reel or listing opened from a link somebody shared. `found_feed`
        is `listEvents` and `found_detail` is `getEvent`, both with subject `event` (R2-T1). `trigo` is an
        opened card cited by Trigo (R5-T5).

    DroppedOutcomeEvent:
      type: object
      required: [index, reason]
      properties:
        index: { type: integer, minimum: 0, description: "The event's position in the request's `events` list, from 0." }
        reason:
          type: string
          enum: [invalid_event, invalid_event_id, unknown_kind, unknown_surface, unknown_subject,
                 position_out_of_range, invalid_occurred_at, occurred_at_in_future, occurred_at_too_old,
                 consent_denied]

    Going:
      type: object
      additionalProperties: false
      description: >-
        One thing the traveller said they are going to. Seen in full by them
        only; friends see at most that they are going (visibility). Show every
        time in timezone.
      required: [eventId, state, startsAt, endsAt, timezone, reminderAt, reminderSent, stillGoingAsked, askWentAt,
                 wentAnswer, event, visibility]
      properties:
        eventId: { type: string, format: uuid, description: "The event; after a merge, the card kept." }
        state:
          type: string
          enum: [going, postponed, cancelled]
          description: "postponed: no new date yet. cancelled: cancelled or no longer listed. Removed goings are never returned."
        startsAt: { type: string, format: date-time, description: "The start the traveller was last told. A date with no time starts at midnight in timezone." }
        endsAt:
          type: string
          format: date-time
          description: >-
            When it ends, for a calendar file: midnight after the last day when
            an end date is listed, three hours after a start time, or midnight
            after a day with no time.
        timezone: { type: string, description: "The place's IANA zone; show every time in it." }
        reminderAt: { type: [string, "null"], format: date-time, description: "Null: no reminder (too close, quiet hours, or postponed)." }
        reminderSent: { type: boolean }
        stillGoingAsked: { type: boolean, description: "True after a move until the traveller answers Yes, still going (setMyGoing) or removes it." }
        askWentAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When Did you go is asked, 10:00 place time the morning after. The
            app shows its card from askWentAt. The email can come later than
            this while the item is held, a merge has not moved yet, or a change
            is still to be told. Null while postponed.
        wentAnswer:
          description: The traveller's Did you go answer (answerDidYouGo), null until they answer.
          anyOf: [{ $ref: "#/components/schemas/WentAnswer" }, { type: "null" }]
        event:
          description: >-
            The card as it is now, or null once it is no longer listed or its
            place is not one you may see. An ended item keeps its card with
            status ended.
          anyOf: [{ $ref: "#/components/schemas/FoundItem" }, { type: "null" }]
        visibility: { $ref: "#/components/schemas/ItemVisibility" }
        checkIn:
          type: object
          additionalProperties: false
          required: [code, link, validOn, checkedInAt]
          description: >-
            What to show at the door. Present only on a going to an event of an
            organiser Yuvoy has checked, with a date, from the day before its
            first day, while organiser pages are not paused. The QR encodes
            `link`. One code for each date of an event that repeats.
          properties:
            code:
              type: string
              pattern: "^[2-9A-HJKMNP-Z]{4}-[2-9A-HJKMNP-Z]{4}$"
              example: K7QM-2XPA
            link:
              type: string
              format: uri
              example: "https://app.yuvoy.in/door#K7QM2XPA"
            validOn:
              type: string
              format: date
              description: The event's first day in its place. The code also works the day before.
            checkedInAt:
              type: [string, "null"]
              format: date-time
              description: When the code was used at the door; null until then.
    WentAnswer:
      type: object
      additionalProperties: false
      description: >-
        A Did you go answer. Seen in full by the traveller only; friends see at
        most that they went (visibility), never the rating or tags.
      required: [went, rating, tags, proof, answeredAt, visibility]
      properties:
        went: { type: boolean }
        rating: { type: [integer, "null"], minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string } }
        proof: { type: string, enum: [self, check_in] }
        answeredAt: { type: string, format: date-time }
        visibility: { $ref: "#/components/schemas/ItemVisibility" }
    SavedEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, complete]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SavedEvent" }
        nextCursor: { type: [string, "null"] }
        complete: { type: boolean }
    SavedEvent:
      type: object
      additionalProperties: false
      description: One event the traveller saved. Seen by them only.
      required: [eventId, savedAt, event]
      properties:
        eventId: { type: string, format: uuid, description: "The event; after a merge, the card kept." }
        savedAt: { type: string, format: date-time }
        event:
          description: >-
            The card as it is now, or null once it is no longer listed or its
            place is not one you may see. An ended event keeps its card with
            status ended.
          anyOf: [{ $ref: "#/components/schemas/FoundItem" }, { type: "null" }]
    MySettings:
      type: object
      additionalProperties: false
      required: [analyticsConsent, reminderEmails, didYouGoEmails, languages, showWomenOnlyTables]
      properties:
        analyticsConsent:
          type: [string, "null"]
          enum: [granted, denied, null]
          description: The account's analytics choice; null while the traveller has made none.
        reminderEmails: { type: boolean }
        didYouGoEmails: { type: boolean }
        goesWith:
          type: [string, "null"]
          enum: [solo, partner, friends, family, null]
          description: "Taste quiz (R4-T1): who the person usually goes with; null while unanswered."
        daySpend:
          type: [string, "null"]
          enum: [under_500, 500_to_1500, over_1500, null]
          description: "Taste quiz: what the person usually spends on a day out, in rupees; null while unanswered."
        cityTime:
          type: [string, "null"]
          enum: [visiting, under_a_year, longer, null]
          description: "Taste quiz: how long the person has been in the city; null while unanswered."
        languages:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { type: string, enum: [en, hi, te, kn] }
          description: The languages the person is happy to use, at most four. Kept and shown back; nothing else reads them yet.
        showWomenOnlyTables:
          type: boolean
          description: False hides women-only tables from the person's own table lists, read with a session. True when never set.

    TrigoTurnInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        conversationId: { type: [string, "null"], format: uuid, description: Absent or null continues the open chat or starts one. }
        text: { type: string, minLength: 1, maxLength: 1000 }
        destinationKey: { type: [string, "null"], description: "The destination key the app shows, such as andaman/havelock." }
        aboutCardId: { type: [string, "null"], description: "exp:{slug} or item:{uuid} when Trigo was opened from a card." }
    TrigoTurnResult:
      type: object
      required: [conversationId, turnId, outcome, messages, remainingToday, resetsAt, team]
      properties:
        conversationId: { type: string, format: uuid }
        turnId: { type: string, format: uuid }
        outcome: { type: string, enum: [answered, handed_off, check_failed, timed_out, refused, unavailable, paused, with_team] }
        messages: { type: array, description: "The traveller's message, then every reply in order.", items: { $ref: "#/components/schemas/TrigoMessage" } }
        remainingToday: { type: integer, minimum: 0, maximum: 20 }
        resetsAt: { type: string, format: date-time }
        team: { $ref: "#/components/schemas/TrigoTeam" }
    TrigoMessage:
      type: object
      required: [id, seq, role, text, createdAt, cards, handoffOffer, removed]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, format: int64 }
        role: { type: string, enum: [traveller, trigo, team, system] }
        text: { type: [string, "null"], description: "Card markers already taken out. Null once removed after 90 days." }
        createdAt: { type: string, format: date-time }
        cards: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/TrigoCard" } }
        safetyAnswer: { oneOf: [ { $ref: "#/components/schemas/TrigoSafetyAnswer" }, { type: "null" } ] }
        handoffOffer: { type: boolean, description: Show "Ask the team" under this message. }
        staffName: { type: [string, "null"], description: "First name of the person from the Yuvoy team, on team and system messages." }
        removed: { type: boolean }
        linkNotChecked:
          description: >-
            On a Trigo reply whose turn's traveller message held a link: the link's domain. Trigo never opens a
            link, so show it as not checked yet, with "Ask the team to check", which sends this message's id to
            requestTrigoHandoff. Null on every other message, and once the traveller's text is removed after 90
            days.
          oneOf: [ { $ref: "#/components/schemas/TrigoLinkNotChecked" }, { type: "null" } ]
        actionCard:
          description: >-
            On a Trigo reply that carries a confirm card (R6-T1): the card, as the server wrote it from our records
            when it was made, and what became of it. Null on every other message. Nothing is booked, changed or
            charged until the traveller confirms it; a book card hands them to the existing checkout.
          oneOf: [ { $ref: "#/components/schemas/TrigoActionCard" }, { type: "null" } ]
    TrigoActionCard:
      type: object
      required: [actionId, kind, state, expiresAt, heading, lines, confirmLabel, declineLabel]
      properties:
        actionId: { type: string, format: uuid }
        kind: { type: string, enum: [book, move_booking, add_people, date_alert, trip_draft] }
        state: { type: string, enum: [proposed, confirmed, declined, expired, used, superseded], description: "expired once a proposed card is past expiresAt. A confirmed book card stays confirmed while a reservation made under its key is live (a hold not past its expiry, or a request waiting for the business), past expiresAt too, and confirm answers the same checkout; it reads expired past expiresAt when no reservation was made, or once the reservation ended with no booking. used once a booking carries a book card, and once a date-alert or trip-draft card is confirmed." }
        expiresAt: { type: string, format: date-time }
        heading: { type: string, description: "Server words: Check before I book, Check before I send, Confirm the change, One tap, Your trip draft." }
        lines: { type: array, maxItems: 8, items: { type: string }, description: "Server-written facts, such as 'Sat, 18 Oct · 08:00', '₹7,000 for 2 people', the payment line and the cancellation summary." }
        confirmLabel: { type: string, description: "Confirm, Send, Move it, Add 2, Tell me, Save draft." }
        declineLabel: { type: string, enum: ["Not now"] }
        bookingReference: { type: [string, "null"], description: "Set once a reservation carries this card, or for a change." }
    TrigoLinkNotChecked:
      type: object
      required: [domain]
      properties: { domain: { type: string, example: "insider.in" } }
    TrigoCard:
      type: object
      required: [cardId, kind, available, title, checkLabel, href]
      properties:
        cardId: { type: string, example: "exp:havelock-try-dive" }
        kind: { type: string, enum: [experience, event], description: "event is a thing to do Yuvoy found, as on /v1/events." }
        available: { type: boolean, description: False once the listing or event is no longer shown; draw it as no longer listed. }
        title: { type: string }
        placeName: { type: [string, "null"] }
        whenText: { type: [string, "null"] }
        price: { oneOf: [ { $ref: "#/components/schemas/Money" }, { type: "null" } ] }
        priceText: { type: [string, "null"], description: "Server words: per person, per group, Free, or Price on the organiser's page." }
        checkLabel: { type: string, description: "From our records, never from the model: the operator's name for a listing, Checked by Yuvoy · {date}, or Found by Trigo · not checked yet · {source}." }
        sourceName: { type: [string, "null"] }
        href: { type: string, description: "App path: /e/{slug} for a listing, the event's page for an event (R2)." }
    TrigoSafetyAnswer:
      type: object
      required: [id, topic, text, label]
      properties: { id: { type: string, format: uuid }, topic: { type: string }, text: { type: string }, label: { type: string, enum: ["Safety answer checked by the Yuvoy team"] } }
    TrigoTeam:
      type: object
      required: [state, openNow]
      properties: { state: { type: string, enum: [none, waiting, joined] }, name: { type: [string, "null"] }, replyBy: { type: [string, "null"], format: date-time }, openNow: { type: boolean, description: "Inside TRIGO_TEAM_HOURS, 10am to 8pm India time (D-044 #9)." } }
    TrigoConversation:
      type: object
      required: [id, state, startedAt, lastMessageAt, team, unread, textRemoved]
      properties: { id: { type: string, format: uuid }, state: { type: string, enum: [open, closed] }, startedAt: { type: string, format: date-time }, lastMessageAt: { type: string, format: date-time }, team: { $ref: "#/components/schemas/TrigoTeam" }, unread: { type: integer, minimum: 0 }, textRemoved: { type: boolean } }
    TrigoConversationPage:
      type: object
      required: [conversation, messages, more, hasOlder, remainingToday, resetsAt, pollAfterSeconds]
      properties: { conversation: { $ref: "#/components/schemas/TrigoConversation" }, messages: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/TrigoMessage" } }, more: { type: boolean, description: "Messages lie past the page in the direction read: newer after a cursor, older on the newest page or before a cursor." }, hasOlder: { type: boolean, description: "The chat has messages older than the page's first. Read them with before." }, remainingToday: { type: integer, minimum: 0, maximum: 20 }, resetsAt: { type: string, format: date-time }, pollAfterSeconds: { type: integer, description: "10 while the team is waiting or joined, 0 when polling is pointless." } }
    TrigoHandoff:
      type: object
      required: [message, team]
      properties: { message: { $ref: "#/components/schemas/TrigoMessage" }, team: { $ref: "#/components/schemas/TrigoTeam" } }
    TrigoConsent:
      type: object
      required: [accepted, noticeVersion, noticeText]
      properties: { accepted: { type: boolean }, noticeVersion: { type: string }, noticeText: { type: string, description: "The notice to show before the first message, word for word." }, acceptedVersion: { type: [string, "null"] } }
    TrigoActionConfirmation:
      type: object
      required: [actionId, state, next]
      properties:
        actionId: { type: string, format: uuid }
        state: { type: string, enum: [confirmed, used] }
        next:
          description: Exactly one of checkout, change, done and handoff.
          oneOf:
            - type: object
              additionalProperties: false
              required: [checkout]
              properties:
                checkout:
                  type: object
                  required: [experienceSlug, slotId, localDate, guests, expectTotalPaise, idempotencyKey]
                  properties:
                    experienceSlug: { type: string }
                    slotId: { type: string, format: uuid }
                    localDate: { type: string, format: date }
                    guests: { type: integer, minimum: 1, maximum: 20 }
                    expectTotalPaise: { type: integer }
                    idempotencyKey: { type: string, description: "trg_ and the action id; use it for POST /reservations unless the traveller changes the body." }
                    mode: { type: string, enum: [allotment, request] }
            - type: object
              additionalProperties: false
              required: [change]
              properties:
                change:
                  type: object
                  required: [bookingReference, kind, expectTotalPaise, needsScreening]
                  properties:
                    bookingReference: { type: string }
                    kind: { type: string, enum: [move, add_people] }
                    toSlotId: { type: [string, "null"], format: uuid }
                    expectStartsAt: { type: [string, "null"], format: date-time }
                    extraPeople: { type: [integer, "null"] }
                    expectTotalPaise: { type: integer }
                    needsScreening: { type: boolean }
            - type: object
              additionalProperties: false
              required: [done]
              properties:
                done:
                  type: object
                  properties:
                    alertId: { type: [string, "null"], format: uuid }
                    draftId: { type: [string, "null"], format: uuid }
            - type: object
              additionalProperties: false
              required: [handoff]
              properties:
                handoff: { $ref: "#/components/schemas/TrigoMessage" }
    TrigoDateAlert:
      type: object
      additionalProperties: false
      required: [id, card, createdAt, notifiedAt]
      properties:
        id: { type: string, format: uuid }
        card: { $ref: "#/components/schemas/TrigoCard" }
        createdAt: { type: string, format: date-time }
        notifiedAt: { type: [string, "null"], format: date-time, description: "When the traveller was told the listing has a date; null while the alert waits." }
    TrigoTripDraft:
      type: object
      additionalProperties: false
      required: [id, title, destinationKey, dateFrom, dateTo, days, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 80 }
        destinationKey: { type: string, description: "The market or destination key the draft was planned for, such as andaman or andaman/havelock." }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        days: { type: array, maxItems: 14, items: { $ref: "#/components/schemas/TrigoTripDraftDay" } }
        createdAt: { type: string, format: date-time }
    TrigoTripDraftDay:
      type: object
      additionalProperties: false
      required: [date, cards]
      properties:
        date: { type: string, format: date }
        cards: { type: array, maxItems: 12, items: { $ref: "#/components/schemas/TrigoCard" } }
    TrigoMemory:
      type: object
      additionalProperties: false
      required: [items, clearedAt]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [subjectType, subjectId, label]
            properties:
              subjectType: { type: string, enum: [booking, going, save, department] }
              subjectId: { type: string, description: "A reservation id, a found item id or a Category key; the subjectId to hide it with." }
              label: { type: string, description: "What the app shows, such as the listing's title or the department's name." }
              card:
                description: >-
                  Always null for now: cards served today carry only their id, and the card's facts come with
                  R5-T1d and R5-T2.
                oneOf: [ { $ref: "#/components/schemas/TrigoCard" }, { type: "null" } ]
        clearedAt: { type: [string, "null"], format: date-time, description: "When the traveller last cleared all, null for never." }

    MarketKey:
      type: string
      description: Launch market. Extensible; `andaman` is simply the first.
      pattern: "^[a-z][a-z0-9_]*$"
      example: andaman

    DestinationKey:
      type: string
      description: A destination within a market, as `<market>/<destination>`.
      pattern: "^[a-z][a-z0-9_]*/[a-z][a-z0-9_]*$"
      example: andaman/havelock

    InterestGroup:
      type: string
      enum: [diving_water, boats_islands, food_culture, other]

    LeadSource:
      type: string
      description: Where the visitor arrived from. Campaign routes set this.
      enum: [ferry, kiosk, hotel, instagram, direct, web]
      default: web

    Utm:
      type: object
      description: Campaign attribution. Never treated as identifying data.
      properties:
        source: { type: string, maxLength: 120 }
        medium: { type: string, maxLength: 120 }
        campaign: { type: string, maxLength: 120 }
        content: { type: string, maxLength: 120 }
        term: { type: string, maxLength: 120 }
      additionalProperties: false

    LeadInputBase:
      type: object
      required: [audience, contactName, privacyAccepted, marketKey]
      description: >
        Contact rule (enforced server-side): every lead, whichever audience,
        must supply at least one of `whatsapp` or `email`. Providers were
        previously required to give `whatsapp`; that requirement is gone,
        because some operators will not hand a personal mobile number to a
        pre-launch platform and requiring one loses the application entirely.

        Deduplication uses the normalised contact — WhatsApp number when
        present, else email — so a provider identified only by email
        deduplicates on that address.
      properties:
        audience: { $ref: "#/components/schemas/LeadAudience" }
        contactName: { type: string, minLength: 1, maxLength: 120 }
        whatsapp:
          type: string
          description: Normalised to E.164 server-side.
          maxLength: 32
          example: "+919000000000"
        email: { type: string, format: email, maxLength: 254 }
        privacyAccepted:
          type: boolean
          description: Must be true. Acknowledges the Privacy Policy and Terms.
          const: true
        marketingOptIn:
          type: boolean
          description: Separate, optional, unchecked by default.
          default: false
        marketKey: { $ref: "#/components/schemas/MarketKey" }
        source: { $ref: "#/components/schemas/LeadSource" }
        utm: { $ref: "#/components/schemas/Utm" }
        website:
          type: string
          description: >
            Honeypot. Left empty by real visitors; a non-empty value is handled
            server-side and never becomes an actionable lead.
          maxLength: 255

    TravellerLeadInput:
      allOf:
        - $ref: "#/components/schemas/LeadInputBase"
        - type: object
          description: >
            Deliberately minimal — the public waitlist asks for a name and one
            way to reach you, nothing more. Destination and interests are
            optional attribution (campaign routes may set a destination
            default); they are never required of the visitor.
          properties:
            audience: { const: traveller }
            primaryDestinationKey:
              { $ref: "#/components/schemas/DestinationKey" }
            interests:
              type: array
              maxItems: 3
              uniqueItems: true
              items: { $ref: "#/components/schemas/InterestGroup" }

    ProviderLeadInput:
      allOf:
        - $ref: "#/components/schemas/LeadInputBase"
        - type: object
          required: [businessName]
          description: >
            Only the business name is required beyond the base. Where an
            operator works and what they offer are collected in the onboarding
            conversation instead, so the form need not ask: the site now
            invites operators outside the launch market, who have no truthful
            option to select from a destination list scoped to it.

            `coverageDestinationKeys` and `primaryInterest` remain accepted and
            are persisted unchanged when sent — existing clients are not
            broken, and an internal tool may still supply them. A resubmission
            that omits them does not erase values an earlier one provided.
          properties:
            audience: { const: provider }
            businessName: { type: string, minLength: 1, maxLength: 160 }
            coverageDestinationKeys:
              type: array
              maxItems: 24
              uniqueItems: true
              items: { $ref: "#/components/schemas/DestinationKey" }
            primaryInterest: { $ref: "#/components/schemas/InterestGroup" }

    LeadInput:
      oneOf:
        - $ref: "#/components/schemas/TravellerLeadInput"
        - $ref: "#/components/schemas/ProviderLeadInput"
      discriminator:
        propertyName: audience
        mapping:
          traveller: "#/components/schemas/TravellerLeadInput"
          provider: "#/components/schemas/ProviderLeadInput"

    LeadAcceptance:
      type: object
      description: >
        Deliberately minimal. It confirms the lead was recorded and carries no
        queue position, priority, or follow-up guarantee.
      required: [id, audience, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        audience: { $ref: "#/components/schemas/LeadAudience" }
        status:
          type: string
          enum: [recorded, updated]
        createdAt: { type: string, format: date-time }

    MessageTopic:
      type: string
      description: >
        What the message is about. These are stable slugs, not the labels the
        form shows, so wording can change without splitting a category's
        history.
      enum: [general, feedback, listing, partnership]

    MessageInput:
      type: object
      description: >
        A message from the public contact form. It asks for one contact
        channel — an email address — because that is where a reply goes; it
        never asks for a phone number.

        There is no marketing opt-in here, by design. A message is used to
        answer the person who sent it, and nothing else; it never joins a
        marketing list.
      required: [name, email, topic, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email:
          type: string
          format: email
          maxLength: 254
          description: The only contact field. Normalised to lowercase server-side.
        topic: { $ref: "#/components/schemas/MessageTopic" }
        message: { type: string, minLength: 1, maxLength: 4000 }
        source: { $ref: "#/components/schemas/LeadSource" }
        website:
          type: string
          description: >
            Honeypot, with the same contract and the same server-side handling
            as `LeadInputBase.website`. Left empty by real visitors; a
            non-empty value is acknowledged normally and never becomes an
            actionable message.
          maxLength: 255
      additionalProperties: false

    MessageAcceptance:
      type: object
      description: >
        Deliberately minimal. It confirms the message was received and carries
        no reply-time promise, because the site publishes none.
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [received]
        createdAt: { type: string, format: date-time }

    LeadStatus:
      type: string
      description: >
        Internal follow-up lifecycle for a lead, tracked ops-side only. It is
        never accepted on a request and never returned in `LeadAcceptance` —
        a visitor's submission carries no signal about how their registration
        is being worked. Documented here for the internal ops tooling that
        reads and updates it directly against the database; no public
        endpoint reads or writes this value yet.
      enum: [new, contacted, qualified, disqualified]
      default: new

    # Plans with friends (R7). Nothing here ever carries a phone number, an
    # email, a traveller id or a key, except the planner's own UPI ID in `payee`.
    PlanTemplateKey:
      type: string
      enum: [movie, potluck, games, dinner, trek, cricket, karaoke, cook, roadtrip, party, custom]
    PlanTemplate:
      type: object
      additionalProperties: false
      required: [key, name, defaultTitle, placeHint, items, splitSuggested]
      properties:
        key: { $ref: "#/components/schemas/PlanTemplateKey" }
        name: { type: string, description: 'The English name on the chip, such as "Board games".' }
        defaultTitle: { type: string, description: What a new plan is called. Empty for `custom`. }
        defaultPlace: { type: string, description: '"My place" for a plan at home; absent otherwise.' }
        placeHint: { type: string, description: 'The placeholder for Where, such as "Which café?".' }
        items: { type: array, maxItems: 5, items: { type: string } }
        splitSuggested: { type: boolean }
        keywords: { type: array, items: { type: string }, description: Words that pick this template from typed text. }
    PlanTemplateList:
      type: object
      additionalProperties: false
      required: [templates]
      properties:
        templates: { type: array, items: { $ref: "#/components/schemas/PlanTemplate" } }
    PlanState:
      type: string
      enum: [open, decided, done, cancelled, closed]
    PlanPersonReply:
      type: string
      enum: [going, maybe, cant, answered, none]
      description: Decided, the answer for the decided time; before, answered or none.
    PlanAnswer:
      type: string
      enum: [can, maybe, cant, vote]
      description: can, maybe or cant answer a time; vote answers an idea, one vote per person.
    PlanTime:
      type: object
      additionalProperties: false
      required: [id, startsAt, counts, names]
      properties:
        id: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        counts:
          type: object
          additionalProperties: false
          required: [can, maybe, cant]
          properties: { can: { type: integer }, maybe: { type: integer }, cant: { type: integer } }
        names:
          type: object
          additionalProperties: false
          description: First names per answer, in the order they answered. Never a number.
          properties:
            can: { type: array, items: { type: string } }
            maybe: { type: array, items: { type: string } }
            cant: { type: array, items: { type: string } }
    PlanIdeaSource:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [event, experience, text] }
        id: { type: string, format: uuid }
        slug: { type: string }
    PlanIdea:
      type: object
      additionalProperties: false
      required: [id, title, votes, names, mine]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        source: { $ref: "#/components/schemas/PlanIdeaSource" }
        votes: { type: integer }
        names: { type: array, items: { type: string } }
        mine: { type: boolean }
    PlanItem:
      type: object
      additionalProperties: false
      required: [id, label, mine]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        claimedBy: { type: string, description: First name of who is bringing it. Absent while free. }
        mine: { type: boolean }
    PlanShare:
      type: object
      additionalProperties: false
      required: [amountMinor, paidMarked, receivedMarked]
      properties:
        memberId: { type: string, format: uuid, description: Planner view only. }
        name: { type: string, description: Planner view only. }
        amountMinor: { type: integer, description: 'Whole rupees, in paise.' }
        paidMarked: { type: boolean, description: The person ticked "I've paid". Yuvoy cannot check it. }
        receivedMarked: { type: boolean, description: The planner ticked "Got it". }
        payLink:
          type: string
          description: >-
            `upi://pay?pa=...&pn=...&am=...&cu=INR&tn=...` for this share, built by the API. Absent on the payer's own
            share and on a zero share. Not every UPI app opens such a link: always show the UPI ID and amount as text too.
    PlanCost:
      type: object
      additionalProperties: false
      required: [id, label, amountMinor, currency, paidBy, split, paidCount, shareCount]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        amountMinor: { type: integer }
        currency: { type: string, enum: [INR] }
        paidBy: { type: string, description: First name of who paid. }
        split: { type: boolean, description: False until the plan is decided; shares are then frozen. }
        paidCount: { type: integer }
        shareCount: { type: integer }
        mine: { $ref: "#/components/schemas/PlanShare" }
        shares: { type: array, items: { $ref: "#/components/schemas/PlanShare" }, description: Planner view only. }
    PlanPerson:
      type: object
      additionalProperties: false
      required: [name, reply, you]
      properties:
        memberId: { type: string, format: uuid, description: "The planner sees it on every row. A signed-in member sees it on their own row and on each other signed-in member's row, to ask them to be friends (requestFriend via plan); never on the row of a guest with no account. Never on the row of somebody the caller has blocked or who blocked the caller. A visitor by link never sees it." }
        name: { type: string, description: "\"A guest\" for somebody the caller has blocked or who blocked the caller, here and in every name the plan shows." }
        role: { type: string, enum: [planner, guest] }
        reply: { $ref: "#/components/schemas/PlanPersonReply" }
        you: { type: boolean }
        signedIn: { type: boolean, description: Planner view only. Whether Yuvoy can email this person. }
    PlanMeAnswer:
      type: object
      additionalProperties: false
      required: [optionId, answer]
      properties:
        optionId: { type: string, format: uuid }
        answer: { $ref: "#/components/schemas/PlanAnswer" }
    PlanMe:
      type: object
      additionalProperties: false
      required: [name, answers, claims, paid, adultConfirmed, done, linked]
      properties:
        name: { type: string }
        answers: { type: array, items: { $ref: "#/components/schemas/PlanMeAnswer" } }
        claims: { type: array, items: { type: string, format: uuid } }
        paid: { type: array, items: { type: string, format: uuid }, description: Cost ids marked paid. }
        adultConfirmed: { type: boolean }
        done: { type: boolean }
        linked: { type: boolean, description: 'The reply belongs to a signed-in account, so Yuvoy can email it.' }
    PlanPayee:
      type: object
      additionalProperties: false
      required: [upiId, name]
      properties:
        upiId: { type: string, maxLength: 100, description: name@handle. A UPI ID made of a phone number is refused. }
        name: { type: string, maxLength: 50, description: The payee name the UPI app shows. }
    PlanEarlierShare:
      type: object
      additionalProperties: false
      description: >-
        Only on the by-link read (`getPlanByLink`), for a member found by `X-Yuvoy-Plan-Key` or a session: one
        frozen share of theirs, above zero, on an earlier week of the same weekly plan that has not been purged yet.
        Marking it paid is a paid-only `replyByLink` naming `costId`.
      required: [costId, label, startsAt, amountMinor, paidBy, paidMarked]
      properties:
        costId: { type: string, format: uuid }
        label: { type: string }
        startsAt: { type: string, format: date-time, description: When that earlier week started. }
        amountMinor: { type: integer, description: This member's share in paise. }
        paidBy: { type: string, description: First name of who paid. }
        paidMarked: { type: boolean, description: This member has marked it paid. }
        payLink: { type: string, description: 'The UPI pay link for this share, when that week has a payee.' }
    PlanView:
      type: object
      additionalProperties: false
      required: [id, seriesId, title, templateKey, state, role, timeZone, planner, times, ideas, items, costs, people, canReply, payeeSet]
      properties:
        id: { type: string, format: uuid }
        seriesId: { type: string, format: uuid, description: Same across a weekly series. The web cookie is named after it. }
        title: { type: string }
        templateKey: { $ref: "#/components/schemas/PlanTemplateKey" }
        state: { $ref: "#/components/schemas/PlanState" }
        role: { type: string, enum: [planner, member, visitor], description: visitor opened the link and has not replied. }
        timeZone: { type: string, example: Asia/Kolkata }
        planner:
          type: object
          additionalProperties: false
          required: [name]
          properties: { name: { type: string } }
        placeText: { type: string }
        mapUrl: { type: string }
        note: { type: string }
        gettingHome: { type: string }
        decidedTimeId: { type: string, format: uuid }
        decidedIdeaId: { type: string, format: uuid }
        replyBy: { type: string, format: date-time }
        minPeople: { type: integer }
        repeatWeekly: { type: boolean }
        repeatUntil: { type: string, format: date }
        times: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/PlanTime" } }
        ideas: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/PlanIdea" } }
        items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/PlanItem" } }
        costs: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/PlanCost" } }
        people: { type: array, items: { $ref: "#/components/schemas/PlanPerson" } }
        me: { $ref: "#/components/schemas/PlanMe" }
        canReply: { type: boolean, description: 'False once answers close, and on a plan done, cancelled or closed. A paid-only reply is still taken.' }
        answersCloseAt: { type: string, format: date-time, description: 'When answers close: the decided start, or while nothing is decided the latest time''s start. Adding a later time moves it. After it a reply other than paid-only is 409 `plan_closed` with `details.reason` `started`.' }
        payeeSet: { type: boolean }
        payee:
          allOf: [{ $ref: "#/components/schemas/PlanPayee" }]
          description: Members see it beside their share; the planner sees and edits it.
        notClaimed: { type: array, items: { type: string, format: uuid }, description: 'After a reply, items somebody took first. Say so; not an error.' }
        link: { type: string, description: Planner view only. Recomputable at any time. }
        linkRenewed: { type: boolean, description: 'Planner view only. True when copying the link had to make a new one because the old one could not be recomputed (the secret that made it was dropped); the old link has stopped working.' }
        linkExpiresAt: { type: string, format: date-time }
        earlierShares: { type: array, items: { $ref: "#/components/schemas/PlanEarlierShare" }, description: 'By-link read only, for a member found by key or session. Their shares on earlier weeks of a weekly plan, to mark paid from this link.' }
        guestKey:
          type: string
          description: >-
            Only in the answer to a first reply made with no session. Keep it and send it as `X-Yuvoy-Plan-Key`.
            A web client keeps it server-side and never returns it to page script. Never shown again.
    PlanSummary:
      type: object
      additionalProperties: false
      required: [id, title, templateKey, role, state, timeZone, going]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        templateKey: { $ref: "#/components/schemas/PlanTemplateKey" }
        role: { type: string, enum: [planner, member] }
        state: { $ref: "#/components/schemas/PlanState" }
        startsAt: { type: string, format: date-time, description: 'The decided time; else the earliest time still ahead; else the latest time; else when the plan was made.' }
        timeZone: { type: string }
        placeText: { type: string }
        going: { type: integer }
        myReply: { $ref: "#/components/schemas/PlanPersonReply" }
    PlanPage:
      type: object
      additionalProperties: false
      required: [items, complete]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PlanSummary" } }
        complete: { type: boolean }
        nextCursor: { type: string }
    PlanReply:
      type: object
      additionalProperties: false
      description: >-
        One person's whole reply. answers, claims and paid are complete sets; anything left out is cleared. A reply
        that carries only `paid` is accepted after answers close (`answersCloseAt`), and on a plan done or cancelled.
      properties:
        name: { type: string, minLength: 1, maxLength: 30, description: Required on a first reply without a session. }
        adult: { type: boolean, description: 'Must be true on a first reply without a session, and on the first reply of a member Yuvoy holds no age for.' }
        answers: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/PlanMeAnswer" } }
        claims: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
        paid: { type: array, maxItems: 10, uniqueItems: true, items: { type: string, format: uuid } }
    PlanFrom:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: { type: string, enum: [event, experience] }
        id: { type: string, format: uuid }
    NewPlanTime:
      type: object
      additionalProperties: false
      required: [startsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    NewPlanIdea:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [event, experience, text] }
        id: { type: string, format: uuid, description: Required for event and experience. }
        title: { type: string, maxLength: 80, description: Required for text. }
    NewPlan:
      type: object
      additionalProperties: false
      required: [templateKey, times]
      properties:
        templateKey: { $ref: "#/components/schemas/PlanTemplateKey" }
        title: { type: string, maxLength: 80, description: "Defaults to the template's; required for custom." }
        plannerName: { type: string, maxLength: 30, description: 'Required when the profile has no name, or when its first word is not a valid first name (letters, marks, space, apostrophe, full stop, hyphen).' }
        placeText: { type: string, maxLength: 120 }
        mapUrl: { type: string, maxLength: 300, description: A Google Maps link. }
        note: { type: string, maxLength: 500 }
        gettingHome: { type: string, maxLength: 200 }
        destinationKey: { $ref: "#/components/schemas/DestinationKey" }
        from: { $ref: "#/components/schemas/PlanFrom" }
        times: { type: array, minItems: 1, maxItems: 3, items: { $ref: "#/components/schemas/NewPlanTime" } }
        ideas: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/NewPlanIdea" } }
        items: { type: array, maxItems: 20, items: { type: string, maxLength: 40 }, description: "Omitted means the template's." }
        replyBy: { type: string, format: date-time }
        minPeople: { type: integer, minimum: 2, maximum: 41 }
        repeatWeekly: { type: boolean }
        repeatUntil: { type: string, format: date }
        payee: { $ref: "#/components/schemas/PlanPayee" }
    PlanChanges:
      type: object
      additionalProperties: false
      description: Only the fields sent change. null clears an optional field.
      properties:
        title: { type: string, maxLength: 80 }
        placeText: { type: [string, "null"], maxLength: 120 }
        mapUrl: { type: [string, "null"], maxLength: 300 }
        note: { type: [string, "null"], maxLength: 500 }
        gettingHome: { type: [string, "null"], maxLength: 200 }
        replyBy: { type: [string, "null"], format: date-time }
        minPeople: { type: [integer, "null"], minimum: 2, maximum: 41 }
        repeatWeekly: { type: boolean }
        repeatUntil: { type: [string, "null"], format: date }
        payee: { oneOf: [{ $ref: "#/components/schemas/PlanPayee" }, { type: "null" }] }
    PlanDecision:
      type: object
      additionalProperties: false
      description: Exactly one of timeId and ideaId.
      properties:
        timeId: { type: string, format: uuid }
        ideaId: { type: string, format: uuid }
    PlanReport:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [unsafe, harassment, spam, impersonation, other] }
        personName: { type: string, maxLength: 30, description: 'A first name on the plan, when it is about a person.' }
        note: { type: string, maxLength: 300, description: Read by Yuvoy staff only. }
    NewPlanItem:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, maxLength: 40 }
    NewPlanCost:
      type: object
      additionalProperties: false
      required: [label, amountMinor]
      properties:
        label: { type: string, maxLength: 40 }
        amountMinor: { type: integer, minimum: 100, maximum: 10000000, multipleOf: 100, description: 'Whole rupees, in paise.' }
    ShareReceived:
      type: object
      additionalProperties: false
      required: [memberId, received]
      properties:
        memberId: { type: string, format: uuid }
        received: { type: boolean }
    OrganiserLink:
      type: object
      additionalProperties: false
      required: [kind, url]
      properties:
        kind: { type: string, enum: [website, meetup, luma, other] }
        url: { type: string, format: uri, description: "https, and not on a domain the finder blocks (Instagram among them)." }
    Organiser:
      type: object
      additionalProperties: false
      description: >-
        An organiser page as its members see it (R11-T2). How staff checked
        it is never in it, and only an owner is shown its contact email.
      required: [id, slug, name, destinationKey, departments, links, state, selfPublish, role, clubId]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        destinationKey: { $ref: "#/components/schemas/DestinationKey" }
        departments: { type: array, minItems: 1, maxItems: 3, items: { type: string } }
        about: { type: string, maxLength: 600, description: Absent when there is none. }
        links: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/OrganiserLink" } }
        state:
          type: string
          enum: [pending, verified, not_verified, suspended, closed]
          description: >-
            `not_verified`: staff could not verify it. It posts as a pending
            organiser does (every event is checked) and may still be verified
            later. `closed` follows the erasure of its last owner.
        verificationCode: { type: string, pattern: "^YUVOY-[2-9ABCDEFGHJKMNPQRSTUVWXYZ]{6}$", description: "Present while pending or not verified: post it on your public page to be verified faster." }
        selfPublish: { type: boolean, description: "True when the caller's posts go live without waiting for a check." }
        role: { type: string, enum: [owner, helper], description: The caller's role. }
        contactEmail: { type: string, format: email, description: "The email staff use to reach the owner. Present only when the caller is an owner and one is set; send it back on updateOrganiser to keep it." }
        clubId: { type: [string, "null"], format: uuid, description: "The R9 group this organiser is, when it was set up from a held claim; null for any other." }
    OrganiserInput:
      type: object
      additionalProperties: false
      required: [name, destinationKey, departments, runsIt]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        destinationKey: { $ref: "#/components/schemas/DestinationKey" }
        departments: { type: array, minItems: 1, maxItems: 3, items: { type: string }, description: Category keys. }
        about: { type: string, maxLength: 600, description: "Links, phone numbers and emails are removed." }
        links: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/OrganiserLink" } }
        contactEmail: { type: string, format: email, maxLength: 254, description: "Private: for staff to reach the owner. Shown to owners only, never public. Left out, it is removed." }
        runsIt: { type: boolean, const: true, description: "The ticked line: I run this group or these events, and I am 18 or over." }
    OrganiserFromClubInput:
      type: object
      additionalProperties: false
      description: >-
        An organiser for an R9 group the caller holds. The name and place are
        the group's, so `name` and `destinationKey` are not sent.
      required: [clubId, departments, runsIt]
      properties:
        clubId: { type: string, format: uuid, description: "A group the caller's approved claim holds (R9). The organiser is verified at once, with the group's name and place." }
        departments: { type: array, minItems: 1, maxItems: 3, items: { type: string }, description: Category keys. }
        about: { type: string, maxLength: 600, description: "Links, phone numbers and emails are removed." }
        links: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/OrganiserLink" } }
        contactEmail: { type: string, format: email, maxLength: 254, description: "Private: for staff to reach the owner. Shown to owners only, never public. Left out, it is removed." }
        runsIt: { type: boolean, const: true, description: "The ticked line: I run this group or these events, and I am 18 or over." }
    OrganiserClubLink:
      type: object
      additionalProperties: false
      description: >-
        linkOrganiserToClub's body. The name and place are the group's, so
        `name` and `destinationKey` are not sent.
      required: [clubId]
      properties:
        clubId: { type: string, format: uuid, description: "A group the caller's approved claim holds (R9)." }
    OrganiserCreateInput:
      description: >-
        createOrganiser's body: a page of its own (OrganiserInput), or one for
        a group the caller holds (OrganiserFromClubInput, with `clubId`).
      oneOf:
        - $ref: "#/components/schemas/OrganiserInput"
        - $ref: "#/components/schemas/OrganiserFromClubInput"
    OrganiserEventInput:
      type: object
      additionalProperties: false
      required: [title, department, startsAt, destinationKey, venueName, free, link]
      properties:
        title: { type: string, minLength: 3, maxLength: 100 }
        department: { type: string, description: A category key. }
        startsAt: { type: string, format: date-time, description: "From now to 180 days ahead, with its offset. Stored in the place's zone." }
        endsAt: { type: string, format: date-time, description: After the start and at most 14 days after it. }
        repeatsWeeklyUntil: { type: string, format: date, description: "The same day and time each week until this date, read in the start's offset: from the start's own day to 26 weeks from today. One card, showing the next date." }
        destinationKey: { $ref: "#/components/schemas/DestinationKey" }
        venueName: { type: string, minLength: 2, maxLength: 120 }
        address: { type: string, maxLength: 240 }
        free: { type: boolean }
        priceFromRupees: { type: integer, minimum: 1, maximum: 100000, description: "Required when not free, refused when free. Same cap as event_submissions.price_min_paise (R3-b)." }
        priceNote: { type: string, maxLength: 80, description: "One line about the price, free or paid, such as \"Students pay half\"." }
        link: { type: string, format: uri, description: "https, and not on a domain the finder blocks." }
        about: { type: string, maxLength: 500, description: "Links, phone numbers and emails are removed. 500, the submission's summary limit." }
    OrganiserEvent:
      type: object
      additionalProperties: false
      description: >-
        One event as its organiser sees it: what they posted, as last
        changed, and where it stands.
      required: [id, state, title, department, startsAt, destinationKey, venueName, free, link]
      properties:
        id: { type: string, format: uuid, description: The organiser's own id for this event; stable across edits. }
        eventId: { type: string, format: uuid, description: "The public card's id, once there is one; `state` says whether it is live." }
        state: { type: string, enum: [in_checking, live, changes_in_checking, cancelled, not_accepted, ended] }
        notAcceptedReason: { type: string }
        lastCheckedAt: { type: string, format: date-time }
        picture:
          type: object
          additionalProperties: false
          description: >-
            The picture on the event's card, as every member sees it: the
            newest one uploading, in review, published or rejected. Absent
            when there is none. Any member may replace it (`startMyUpload`)
            or delete it (`deleteMyUpload` with `uploadId`).
          required: [uploadId, state]
          properties:
            uploadId: { type: string, format: uuid }
            state: { type: string, enum: [uploading, in_review, published, rejected] }
            rejectionCode: { type: string, description: "Only when rejected: why, as `CreatorUpload.rejection.code`." }
            imageUrl: { type: string, format: uri, description: Only once published. }
        title: { type: string }
        department: { type: string }
        startsAt: { type: string, format: date-time, description: In the place's zone. }
        endsAt: { type: string, format: date-time, description: Absent when none was given. }
        repeatsWeeklyUntil: { type: string, format: date, description: Absent when it does not repeat. }
        destinationKey: { $ref: "#/components/schemas/DestinationKey" }
        venueName: { type: string }
        address: { type: string, description: Absent when none was given. }
        free: { type: boolean }
        priceFromRupees: { type: integer, minimum: 1, maximum: 100000, description: Absent when free. }
        priceNote: { type: string, description: Absent when none was given. }
        link: { type: string, format: uri }
        about: { type: string, description: Absent when none was given. }
    OrganiserEventNumbers:
      type: object
      additionalProperties: false
      description: Counts only, never a name or an id.
      required: [going, ticketTapsAtLeast, checkedIn, went, on, asOf]
      properties:
        going: { type: integer, minimum: 0 }
        ticketTapsAtLeast: { type: integer, minimum: 0, description: "Shown as \"at least\": taps are counted only with consent, and the last few may not be counted yet." }
        checkedIn: { type: integer, minimum: 0 }
        went: { type: integer, minimum: 0 }
        on: { type: [string, "null"], format: date, description: "The date counted, in the event's place. Null only for a card with no date, which counts every date. An event not live yet gives its own start's date." }
        asOf: { type: string, format: date-time }
    OrganiserHelper:
      type: object
      additionalProperties: false
      required: [travellerId, firstName]
      properties:
        travellerId: { type: string, format: uuid }
        firstName: { type: string, description: The first word of the name they chose; empty when they have none. }
    OrganiserHelperListed:
      type: object
      additionalProperties: false
      required: [firstName]
      properties:
        travellerId: { type: string, format: uuid, description: Sent to an owner only. }
        firstName: { type: string, description: The first word of the name they chose; empty when they have none. }
