openapi: 3.1.0
info:
  title: Yuvoy API
  version: 0.0.0-proposal
  description: >
    **Proposal — v0.** The Experience Commerce API consumed by yuvoy-web (and,
    later, the mobile app). This document is the FE/BE contract. Once `yuvoy-api`
    exists it becomes the source of truth there; this copy lets the frontend
    generate types and build against mocks in the meantime.

    Conventions: money is an integer minor unit + currency; timestamps are
    ISO-8601 UTC; lists use cursor pagination; money-mutating requests require an
    `Idempotency-Key`; errors use a single envelope `{ error: { code, message, details, requestId } }`.
servers:
  - url: https://api.yuvoy.in/v1
    description: Production
    # No separate staging API exists — one App Runner service backs both the
    # production and staging web deployments (differentiated by CORS origin,
    # not by host). Do not add a staging entry unless a second service exists
    # to resolve it.
tags:
  - name: auth
  - name: experiences
  - name: bookings
  - name: leads
  - name: messages
  - name: waitlist
  - name: me

security: []

paths:
  /leads:
    post:
      tags: [leads]
      summary: Register pre-launch interest as a traveller or a provider
      description: >
        Public, rate-limited pre-launch lead capture. The request is
        discriminated on `audience`. Geography is generic: `marketKey` names a
        launch market and destination keys name a destination within it, so
        future markets reuse this shape unchanged.


        A returning contact (same audience + normalised WhatsApp) updates its
        current preferences and attribution and returns `200`; a new contact
        returns `201`. Notification jobs are written in the same transaction as
        the lead, so a saved lead is never lost to an unavailable alert target.
      operationId: createLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201":
          description: New lead recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadAcceptance" }
        "200":
          description: Existing lead updated (same audience + WhatsApp)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadAcceptance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /messages:
    post:
      tags: [messages]
      summary: Send a message from the public contact form
      description: >
        Public, rate-limited free-text contact. Shipped 2026-08-07
        (yuvoy-in/yuvoy-api#5) and verified against production.


        **A message is not a lead, and the schema enforces it rather than
        trusting anyone to remember.** There is no marketing-consent field —
        its absence is the guarantee, because there is nothing here for a later
        change to flip to true. Messages are never deduplicated: two questions
        from one address are two questions. There is no lifecycle status;
        triage happens in the inbox the alert lands in.


        **`202`, never `201`.** It acknowledges receipt and promises nothing
        about a reply, because the site publishes no reply time and an
        acknowledgement that implied one would be a commitment nobody made.


        Rate limiting has its own bucket, separate from `/leads`: a burst of
        spam on a public free-text endpoint must not lock a real visitor out of
        the waitlist, or the reverse.
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "202":
          description: Message received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageAcceptance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /waitlist:
    post:
      tags: [waitlist]
      summary: Join the launch waitlist
      operationId: joinWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitlistInput" }
      responses:
        "201":
          description: Added (idempotent on email)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /experiences:
    get:
      tags: [experiences]
      summary: List published experiences
      operationId: listExperiences
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: mode
          in: query
          schema: { $ref: "#/components/schemas/ExperienceMode" }
        - name: q
          in: query
          description: Free-text search
          schema: { type: string }
      responses:
        "200":
          description: A page of experience summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperiencePage" }

  /experiences/{slug}:
    get:
      tags: [experiences]
      summary: Get a single experience by slug
      operationId: getExperience
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The experience
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experience" }
        "404": { $ref: "#/components/responses/NotFound" }

  /experiences/{slug}/availability:
    get:
      tags: [experiences]
      summary: Bookable slots within a date range
      operationId: getAvailability
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Slot" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings:
    post:
      tags: [bookings]
      summary: Create a booking (holds a slot, initiates payment)
      operationId: createBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Booking created in pending_payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Slot no longer available (capacity race)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/otp/request:
    post:
      tags: [auth]
      summary: Request an OTP to a phone number
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: E.164 }
      responses:
        "202": { description: OTP dispatched }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify an OTP and issue tokens
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me:
    get:
      tags: [me]
      summary: The current user
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: A dependency is unavailable; the request was not recorded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_input }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            requestId: { type: string }

    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          description: Amount in the currency's minor unit (paise for INR)
          example: 450000
        currency: { type: string, example: INR }

    Category:
      type: string
      enum:
        - adventure
        - nature_wildlife
        - food_drink
        - arts_creativity
        - learning
        - culture_heritage
        - wellness
        - entertainment
        - community
        - sports
        - local_life
        - events

    ExperienceMode:
      type: string
      enum: [local, travel]

    PolicyTier:
      type: string
      enum: [flexible, firm, weather]

    ProviderTier:
      type: string
      enum: [professional, creator, community]

    Provider:
      type: object
      required: [id, name, tier]
      properties:
        id: { type: string }
        name: { type: string }
        tier: { $ref: "#/components/schemas/ProviderTier" }
        verified: { type: boolean }

    Media:
      type: object
      required: [id, type, url]
      properties:
        id: { type: string }
        type: { type: string, enum: [image, video] }
        url: { type: string, format: uri }
        posterUrl: { type: string, format: uri }
        alt: { type: string }

    ExperienceSummary:
      type: object
      required:
        [
          id,
          slug,
          title,
          location,
          category,
          mode,
          durationMinutes,
          fromPrice,
          rating,
          provider,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        location: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        mode: { $ref: "#/components/schemas/ExperienceMode" }
        durationMinutes: { type: integer }
        fromPrice: { $ref: "#/components/schemas/Money" }
        rating: { type: number, format: float, minimum: 0, maximum: 5 }
        reviewCount: { type: integer }
        hero: { $ref: "#/components/schemas/Media" }
        provider: { $ref: "#/components/schemas/Provider" }

    Experience:
      allOf:
        - $ref: "#/components/schemas/ExperienceSummary"
        - type: object
          required: [summary, description, policyTier, gallery]
          properties:
            summary: { type: string }
            description: { type: string }
            highlights:
              type: array
              items: { type: string }
            included:
              type: array
              items: { type: string }
            policyTier: { $ref: "#/components/schemas/PolicyTier" }
            maxGroupSize: { type: integer }
            gallery:
              type: array
              items: { $ref: "#/components/schemas/Media" }

    ExperiencePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ExperienceSummary" }
        nextCursor:
          # OpenAPI 3.1 drops `nullable`; a null union is the 3.1 spelling.
          type: [string, "null"]

    Slot:
      type: object
      required: [id, startsAt, capacity, remaining, price]
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer }
        remaining: { type: integer }
        price: { $ref: "#/components/schemas/Money" }

    BookingInput:
      type: object
      required: [slotId, guests]
      properties:
        slotId: { type: string }
        guests: { type: integer, minimum: 1 }

    Booking:
      type: object
      required: [id, status, experienceSlug, slotId, guests, total, createdAt]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending_payment, confirmed, completed, cancelled, no_show]
        experienceSlug: { type: string }
        slotId: { type: string }
        guests: { type: integer }
        total: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }

    WaitlistInput:
      type: object
      required: [email]
      properties:
        name: { type: string, maxLength: 80 }
        email: { type: string, format: email }
        source: { type: string }

    WaitlistEntry:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        createdAt: { type: string, format: date-time }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role: { type: string, enum: [seeker, provider, admin] }

    # ---- Pre-launch lead capture -------------------------------------------
    # Geography is deliberately generic. `marketKey` names a launch market and
    # a destination key is "<market>/<destination>". Andaman is the first
    # market, not the schema's boundary.

    LeadAudience:
      type: string
      description: >
        Which side of the marketplace the contact is. `provider` matches the
        existing `User.role` and `Provider` vocabulary in this contract.
      enum: [traveller, provider]

    MarketKey:
      type: string
      description: Launch market. Extensible; `andaman` is simply the first.
      pattern: "^[a-z][a-z0-9_]*$"
      example: andaman

    DestinationKey:
      type: string
      description: A destination within a market, as `<market>/<destination>`.
      pattern: "^[a-z][a-z0-9_]*/[a-z][a-z0-9_]*$"
      example: andaman/havelock

    InterestGroup:
      type: string
      enum: [diving_water, boats_islands, food_culture, other]

    LeadSource:
      type: string
      description: Where the visitor arrived from. Campaign routes set this.
      enum: [ferry, kiosk, hotel, instagram, direct, web]
      default: web

    Utm:
      type: object
      description: Campaign attribution. Never treated as identifying data.
      properties:
        source: { type: string, maxLength: 120 }
        medium: { type: string, maxLength: 120 }
        campaign: { type: string, maxLength: 120 }
        content: { type: string, maxLength: 120 }
        term: { type: string, maxLength: 120 }
      additionalProperties: false

    LeadInputBase:
      type: object
      required: [audience, contactName, privacyAccepted, marketKey]
      description: >
        Contact rule, as deployed (yuvoy-in/yuvoy-api#4, live 2026-08-07):
        **at least one of `whatsapp` or `email`**, for both audiences.
        Deduplication uses the normalised contact — WhatsApp number when
        present, else email — so an operator with no phone number deduplicates
        on their address.


        A request carrying neither is rejected on the field name **`contact`**,
        not `whatsapp`, because a form may legitimately no longer render a
        WhatsApp input to point an error at.


        **The frontend is deliberately stricter than this and requires `email`
        of everyone** (owner direction, 2026-08-07): it is the channel the
        launch announcement is actually sent on — free, no messaging-platform
        template approval, and it reaches every country. That is a product
        decision enforced in the forms, not a contract constraint; the API
        accepts either channel and this document describes the API.
      properties:
        audience: { $ref: "#/components/schemas/LeadAudience" }
        contactName: { type: string, minLength: 1, maxLength: 120 }
        whatsapp:
          type: string
          description: Normalised to E.164 server-side.
          maxLength: 32
          example: "+919000000000"
        email: { type: string, format: email, maxLength: 254 }
        privacyAccepted:
          type: boolean
          description: Must be true. Acknowledges the Privacy Policy and Terms.
          const: true
        marketingOptIn:
          type: boolean
          description: Separate, optional, unchecked by default.
          default: false
        marketKey: { $ref: "#/components/schemas/MarketKey" }
        source: { $ref: "#/components/schemas/LeadSource" }
        utm: { $ref: "#/components/schemas/Utm" }
        website:
          type: string
          description: >
            Honeypot. Left empty by real visitors; a non-empty value is handled
            server-side and never becomes an actionable lead.
          maxLength: 255

    TravellerLeadInput:
      allOf:
        - $ref: "#/components/schemas/LeadInputBase"
        - type: object
          description: >
            Deliberately minimal — the public waitlist asks for a name and one
            way to reach you, nothing more. Destination and interests are
            optional attribution (campaign routes may set a destination
            default); they are never required of the visitor.
          properties:
            audience: { const: traveller }
            primaryDestinationKey:
              { $ref: "#/components/schemas/DestinationKey" }
            interests:
              type: array
              maxItems: 3
              uniqueItems: true
              items: { $ref: "#/components/schemas/InterestGroup" }

    ProviderLeadInput:
      allOf:
        - $ref: "#/components/schemas/LeadInputBase"
        - type: object
          description: >
            `coverageDestinationKeys` and `primaryInterest` are optional as of
            2026-08-07 (yuvoy-in/yuvoy-api#4). Both are still accepted and
            stored when supplied; the public application form no longer asks
            for them, because an operator answers both in the onboarding
            conversation and the destination list could not represent an
            operator outside the launch market.
          required: [businessName]
          properties:
            audience: { const: provider }
            businessName: { type: string, minLength: 1, maxLength: 160 }
            coverageDestinationKeys:
              type: array
              minItems: 1
              maxItems: 24
              uniqueItems: true
              items: { $ref: "#/components/schemas/DestinationKey" }
            primaryInterest: { $ref: "#/components/schemas/InterestGroup" }

    LeadInput:
      oneOf:
        - $ref: "#/components/schemas/TravellerLeadInput"
        - $ref: "#/components/schemas/ProviderLeadInput"
      discriminator:
        propertyName: audience
        mapping:
          traveller: "#/components/schemas/TravellerLeadInput"
          provider: "#/components/schemas/ProviderLeadInput"

    MessageInput:
      type: object
      description: >
        A message from the public contact form. Deliberately not a lead: no
        marketing consent, no market or destination, no attribution beyond the
        campaign `source`.
      required: [name, email, topic, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        topic: { $ref: "#/components/schemas/MessageTopic" }
        message:
          type: string
          minLength: 1
          description: >
            Capped at 4000 **characters, not bytes** — 4000 multi-byte
            characters is still 4000 characters, so a message written in Hindi
            is not silently penalised. 4001 is a 400.
          maxLength: 4000
        source: { $ref: "#/components/schemas/LeadSource" }
        website:
          type: string
          maxLength: 255
          description: >
            Honeypot. A filled value answers `202` exactly as a real submission
            does, and writes neither a row nor a notification — a bot must not
            be able to tell it was caught.

    MessageTopic:
      type: string
      description: >
        What the message is about. Anything outside this list is a 400. There
        is deliberately no "a trip or experience" option: nothing is bookable
        yet, so offering it would invite a question nobody can answer.
      enum: [general, feedback, listing, partnership]

    MessageAcceptance:
      type: object
      description: >
        Acknowledges receipt and nothing else. No reply-time promise, because
        the site publishes none.
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, const: received }
        createdAt: { type: string, format: date-time }

    LeadAcceptance:
      type: object
      description: >
        Deliberately minimal. It confirms the lead was recorded and carries no
        queue position, priority, or follow-up guarantee.
      required: [id, audience, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        audience: { $ref: "#/components/schemas/LeadAudience" }
        status:
          type: string
          enum: [recorded, updated]
        createdAt: { type: string, format: date-time }

    LeadStatus:
      type: string
      description: >
        Internal follow-up lifecycle for a lead, tracked ops-side only. It is
        never accepted on a request and never returned in `LeadAcceptance` —
        a visitor's submission carries no signal about how their registration
        is being worked. Documented here for the internal ops tooling that
        reads and updates it directly against the database; no public
        endpoint reads or writes this value yet.
      enum: [new, contacted, qualified, disqualified]
      default: new
