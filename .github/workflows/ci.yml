name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Only the newest run of a branch matters. Pushing a fixup used to leave the
# previous run burning a full e2e suite (~7 minutes) against code nobody would
# merge — that happened twice on #72 alone.
#
# `cancel-in-progress` is deliberately limited to pull requests: on `main` and
# `dev` a run is the gate in front of a deployment, and cancelling one of those
# would leave a deploy with no record of having been checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Chromium is ~130MB and was re-downloaded on every single run. The
      # binary only changes when Playwright does, so the lockfile hash is the
      # right key. System libraries are installed by apt and cannot be cached,
      # so they are handled separately on a hit.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Next.js's own build cache. In CI the suite serves a production build
      # (see the `webServer` note in playwright.config.ts), so this job now
      # compiles the app as well as running the browser tests, and an uncached
      # `next build` is most of that step's time.
      #
      # Keyed on the lockfile plus the sources that actually affect output, so
      # a dependency bump or a source change invalidates it; `restore-keys`
      # then falls back to the newest previous cache rather than starting cold,
      # which is the case that matters on a busy branch.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', '*.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # Builds and starts the app, then runs the suite against it. Testing the
      # dev server instead was both slower and less truthful — it leaves a
      # duplicate copy of each route in the DOM that the shipped build does not.
      - run: pnpm test:e2e

      # The traces and screenshots Playwright keeps for a failed test. Without
      # this a red CI run gives a stack trace and nothing to look at, and the
      # only way to see what the page actually looked like is to reproduce it
      # locally — which is precisely what does not work for a failure that only
      # happens on a slower machine.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
