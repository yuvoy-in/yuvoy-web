name: CI

# MANUAL ONLY. This suite is the same one that now runs locally before every
# push (`pnpm verify`, wired to .husky/pre-push), so running it here as well
# on every push and every pull request was paying for the same answer twice.
#
# ## Why (2026-08-14)
#
# The account reached 90% of its 2,000 free Actions minutes with 20 days of
# the cycle left, and there is no budget to spend past it. Measured on this
# repo, a CI run bills 7 minutes (quality 78s -> 2, e2e 250s -> 5; GitHub
# rounds each job up to the minute) and a deploy bills 2. One change reaching
# production ran CI four times — on the feature PR, on the push to `dev`, on
# the release PR, and on the push to `main` — for 32 minutes, of which 28 was
# CI re-testing trees that had already passed, because a squash merge lands
# the same tree the PR just tested.
#
# Actions now does deployments only: 2 minutes to staging, 2 to production.
# Correctness moved to the pre-push hook, which runs the identical commands on
# the identical lockfile before anything leaves the machine.
#
# **Keep this workflow.** It is the second opinion on a machine that is not
# the author's, and it is worth 7 minutes before a release or when a failure
# smells like it might be environmental — the `/waitlist` structure flake is
# exactly that class. Run it from the Actions tab, or:
#
#     gh workflow run CI --ref <branch>
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Chromium is ~130MB and was re-downloaded on every single run. The
      # binary only changes when Playwright does, so the lockfile hash is the
      # right key. System libraries are installed by apt and cannot be cached,
      # so they are handled separately on a hit.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Next.js's own build cache. In CI the suite serves a production build
      # (see the `webServer` note in playwright.config.ts), so this job now
      # compiles the app as well as running the browser tests, and an uncached
      # `next build` is most of that step's time.
      #
      # Keyed on the lockfile plus the sources that actually affect output, so
      # a dependency bump or a source change invalidates it; `restore-keys`
      # then falls back to the newest previous cache rather than starting cold,
      # which is the case that matters on a busy branch.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', '*.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # Builds and starts the app, then runs the suite against it. Testing the
      # dev server instead was both slower and less truthful — it leaves a
      # duplicate copy of each route in the DOM that the shipped build does not.
      - run: pnpm test:e2e

      # The traces and screenshots Playwright keeps for a failed test. Without
      # this a red CI run gives a stack trace and nothing to look at, and the
      # only way to see what the page actually looked like is to reproduce it
      # locally — which is precisely what does not work for a failure that only
      # happens on a slower machine.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
