name: CI

# Runs on every pull request into `main` or `dev`, and by hand.
#
# The `main` and `dev` rulesets require `quality` and `e2e` to pass before a pull
# request can merge (yuvoy-mobile#403, decision D-052). On `dev` the branch
# must also be up to date with `dev`. On `main` that setting is off: release
# merge commits never go back into `dev`, so every release PR would read as
# behind. `main` deploys to production on every push, so this is the check
# standing between a merge and the live site.
#
# This was manual only from 14 Aug 2026, to save Actions minutes. That budget
# belongs to the org's private repositories: this repository is public, so its
# GitHub-hosted runs cost nothing. The pre-push hook (`pnpm verify`) still runs
# the same suite before anything leaves the machine; this is the second opinion
# on a machine that is not the author's.
#
#     gh workflow run CI --ref <branch>
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Chromium is ~130MB and was re-downloaded on every single run. The
      # binary only changes when Playwright does, so the lockfile hash is the
      # right key. System libraries are installed by apt and cannot be cached,
      # so they are handled separately on a hit.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Next.js's own build cache. In CI the suite serves a production build
      # (see the `webServer` note in playwright.config.ts), so this job now
      # compiles the app as well as running the browser tests, and an uncached
      # `next build` is most of that step's time.
      #
      # Keyed on the lockfile plus the sources that actually affect output, so
      # a dependency bump or a source change invalidates it; `restore-keys`
      # then falls back to the newest previous cache rather than starting cold,
      # which is the case that matters on a busy branch.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', '*.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # Builds and starts the app, then runs the suite against it. Testing the
      # dev server instead was both slower and less truthful: it leaves a
      # duplicate copy of each route in the DOM that the shipped build does not.
      - run: pnpm test:e2e

      # The traces and screenshots Playwright keeps for a failed test. Without
      # this a red CI run gives a stack trace and nothing to look at, and the
      # only way to see what the page actually looked like is to reproduce it
      # locally, which is precisely what does not work for a failure that only
      # happens on a slower machine.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
