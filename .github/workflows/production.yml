name: Production deployment

# A MANUAL redeploy of yuvoy.in, and nothing else.
#
# Vercel's Git integration deploys `main` on every push (connected 20 Sep
# 2026), so this workflow no longer runs on push. For four days it did both:
# every release deployed production twice, and the two builds raced for the
# domain. The gate in front of a release is still local, as below.
#
# ## History: why this ran on `push` until 24 Sep 2026
#
# Until 2026-08-14 this waited on `workflow_run: [CI]` so it could deploy only
# after CI went green **on the exact commit**. That existed for a real reason:
# deploying straight off `push` raced CI, and on the 2026-08-07 release the
# site was live and serving before the e2e job finished — which then failed.
# Nothing was actually wrong that time, but "we found out afterwards" is not a
# release process.
#
# The trigger is back to `push` because CI no longer runs automatically at all
# (see ci.yml: the account hit 90% of its free Actions minutes with no budget
# to go past it). There is no workflow to wait for, so waiting for one would
# deadlock the release.
#
# **What now stands in its place**, in order of when it catches something:
#
# 1. `.husky/pre-push` runs `pnpm verify` — typecheck, lint, format, unit
#    tests, production build, full e2e — against the exact tree being pushed.
#    Nothing reaches `dev` without passing it.
# 2. Staging deploys from `dev` and is looked at before anything is promoted.
#    A release is a promotion of a tree that has been on staging, not a new
#    tree, which is the substantive difference from the 08-07 incident: that
#    deployed a commit nobody had run anything against.
# 3. `gh workflow run CI --ref main` before promoting, when a release is worth
#    7 minutes of second opinion on a machine that is not the author's.
#
# **The residual risk is honest and worth stating:** a `--no-verify` push, or
# a merge whose result differs from any tree the hook saw, reaches production
# with nothing having checked it. Restore the `workflow_run` gate the moment
# Actions minutes are not the binding constraint.
on:
  # Manual redeploy. NEXT_PUBLIC_* values are inlined at build time, so
  # changing one in Vercel does nothing until a rebuild. Vercel's own
  # Redeploy button does the same job.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      # Empty: checkout's default is the pushed commit on a `push`, and the
      # dispatched ref on a manual run. The explicit SHA that used to be
      # passed here existed only because `workflow_run` reports the default
      # branch's context rather than the tested commit's — with that trigger
      # gone, the default is correct for both events.
      ref: ""
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
